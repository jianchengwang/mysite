services:
  api:
    image: mysite-api:${MYSITE_RELEASE:?Set release}
    restart: unless-stopped
    env_file:
      - ${MYSITE_RUNTIME_DIR:?Set runtime directory}/config/api.env
    environment:
      LISTEN_ADDR: 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
  web:
    user: "101:101"
    image: mysite-web:${MYSITE_RELEASE:?Set release}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MYSITE_HTTP_BIND:-0.0.0.0}:${MYSITE_HTTP_PORT:-9001}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,mode=1777
      - /var/run:rw,noexec,nosuid,size=1m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
