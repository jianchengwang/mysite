<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">同一组三项差，两种空间视角</title><desc id="desc">在原始xy平面中，观测为(0,1)、(1,2)、(2,2)，预测线为y帽=x/2+7/6；残差是竖直差。在三维输出空间里，y=(1,2,2)，p=(7/6,5/3,13/6)，r=y-p=(-1/6,1/3,-1/6)，SSE=1/6平方厘米。</desc><defs><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#127965"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2a6694"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#bc5d25"/></marker><marker id="inkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#233a3b"/></marker><marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#6f7e79"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  17  最小二乘与投影</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">同一组三项差，两种空间视角</text><text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">左边比较同一输入处的输出；右边把三项输出差收进一个向量</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text><text x="330" y="221" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">原来的数据平面</text><text x="1050" y="221" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">三个输出组成的 R³</text><line x1="125" y1="675" x2="630.25" y2="675" stroke="#dce3dc" stroke-width="1.8" stroke-linecap="round"/><text x="102" y="683" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">0</text><line x1="125" y1="525" x2="630.25" y2="525" stroke="#dce3dc" stroke-width="1.8" stroke-linecap="round"/><text x="102" y="533" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">1</text><line x1="125" y1="375" x2="630.25" y2="375" stroke="#dce3dc" stroke-width="1.8" stroke-linecap="round"/><text x="102" y="383" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">2</text><line x1="125" y1="675" x2="125" y2="277.5" stroke="#dce3dc" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7"/><text x="125" y="714" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">0</text><line x1="340" y1="675" x2="340" y2="277.5" stroke="#dce3dc" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7"/><text x="340" y="714" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1</text><line x1="555" y1="675" x2="555" y2="277.5" stroke="#dce3dc" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7"/><text x="555" y="714" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">2</text><line x1="125" y1="675" x2="651.75" y2="675" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><line x1="125" y1="675" x2="125" y2="266.99999999999994" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><text x="83" y="263" fill="#233a3b" font-family="Noto 