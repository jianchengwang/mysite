font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">13/6</text><text x="1283" y="579" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">−1/6</text><line x1="761" y1="615" x2="1350" y2="615" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="1040" y="671" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="middle">‖r‖² = 1/36 + 1/9 + 1/36</text><text x="1040" y="721" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="middle">= 1/6 平方厘米</text><text x="1040" y="767" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">y、p、r 的每个分量均以厘米计</text><text x="700" y="821" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">“最近”在输出空间中衡量，不是数据点到斜线的二维最短距离</text><text x="329" y="768" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" text-anchor="middle">实心为观测，空心为预测</text></svg>