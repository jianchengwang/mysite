<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">任取一个对手，误差不会更小</title><desc id="desc">最佳预测p位于可行列空间，观测y与p的差为r；任意另一可行预测q与p的差为d=Xδ。因r垂直列空间，r点积d=0。新残差y-q=r-d，长度平方等于r的长度平方加d的长度平方，因此不小于原来的平方和。这是截面示意，并非原xy数据图。</desc><defs><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#127965"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2a6694"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#bc5d25"/></marker><marker id="inkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#233a3b"/></marker><marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#6f7e79"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  17  最小二乘与投影</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">任取一个对手，误差不会更小</text><text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">固定任意竞争预测 q = p + d，画出 p、q、y 所在的截面</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text><line x1="105" y1="625" x2="705" y2="625" stroke="#dce3dc" stroke-width="3" stroke-linecap="round"/><text x="411" y="721" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">可行平面与这个截面的交线</text><line x1="222" y1="625" x2="639" y2="625" stroke="#2a6694" stroke-width="5" stroke-linecap="round" marker-end="url(#blueArrow)"/><line x1="222" y1="625" x2="222" y2="290" stroke="#bc5d25" stroke-width="5" stroke-linecap="round" marker-end="url(#orangeArrow)"/><line x1="639" y1="625" x2="222" y2="290" stroke="#233a3b" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#inkArrow)"/><path d="M222,587 L260,587 L260,625" fill="none" stroke="#6f7e79" stroke-width="2.5"/><circle cx="222" cy="625" r="8" fill="#233a3b" stroke="#fffdf7" stroke-width="2"/><circle cx="639" cy="625" r="8" fill="#233a3b" stroke="#fffdf7" stroke-width="2"/><circle cx="222" cy="290" r="8" fill="#233a3b" stroke="#fffdf7" stroke-width="2"/><text x="222" y="261" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">y</text><text x="190" y="673" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">p</text><text x="659" y="673" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">q</text><text x="122" y="453" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="middle">r</text><text x="419" y="663" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">d = Xδ</text><text x="484" y="421" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="middle">r − d</text><line x1="758" y1="246" x2="758" y2="728" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="815" y="288" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">正交的理由</text><text x="815" y="346" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">d ∈ col(X)，r ⟂ col(X)</text><text x="815" y="401" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="start">所以 r · d = 0</text><text x="815" y="484" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">新误差平方</text><text x="815" y="540" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="start">‖r − d‖² = ‖r‖² + ‖d‖²</text><text x="815" y="595" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="start">= 1/6 + ‖Xδ‖²</text><text x="815" y="651" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="start">≥ 1/6 平方厘米</text><text x="815" y="716" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">等号恰在 Xδ = 0 时成立</text><text x="700" y="804" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">直角来自点积为零；图上角度和边长只作示意，不充当证明</text></svg>