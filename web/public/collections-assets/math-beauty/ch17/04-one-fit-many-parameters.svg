<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">多组最优参数，对应同一个最佳预测</title><desc id="desc">重复特征矩阵X撇有零方向(0,-2,1)。三组参数(1/2,7/6,0)、(1/2,-5/6,1)、(1/2,19/6,-1)的a都为1/2，b+2c都为7/6，因此都给出相同最佳预测p=(7/6,5/3,13/6)。所有最优参数为(1/2,7/6-2t,t)，SSE恒为1/6平方厘米。</desc><defs><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#127965"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2a6694"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#bc5d25"/></marker><marker id="inkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#233a3b"/></marker><marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#6f7e79"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  17  最小二乘与投影</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">多组最优参数，对应同一个最佳预测</text><text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">重复特征 X′ = [x, u, 2u]：只要 a 与 b + 2c 不变，预测就不变</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text><text x="290" y="245" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">不同的参数 (a,b,c)</text><text x="899" y="245" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">同一个最佳预测 p</text><text x="290" y="338" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">(1/2, 7/6, 0)</text><line x1="525" y1="326" x2="726" y2="448" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#grayArrow)"/><text x="290" y="461" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">(1/2, −5/6, 1)</text><line x1="525" y1="449" x2="726" y2="448" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#grayArrow)"/><text x="290" y="584" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">(1/2, 19/6, −1)</text><line x1="525" y1="572" x2="726" y2="448" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#grayArrow)"/><circle cx="760" cy="448" r="12" fill="#127965" stroke="#fffdf7" stroke-width="3"/><text x="998" y="418" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle">(7/6, 5/3, 13/6) 厘米</text><text x="998" y="477" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">a = 1/2</text><text x="998" y="526" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">b + 2c = 7/6</text><line x1="90" y1="636" x2="1310" y2="636" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="700" y="697" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">全部最优参数：(1/2, 7/6 − 2t, t)，t 为任意实数</text><text x="700" y="752" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">沿零方向 (0, −2, 1) 移动，X′ 的输出不动</text><text x="700" y="810" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">参数可以不唯一；最佳预测唯一，SSE 始终为 1/6 平方厘米</text></svg>