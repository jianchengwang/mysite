<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">两行点积，就得到两条方程</title><desc id="desc">残差r=(1-b,2-a-b,2-2a-b)。与x=(0,1,2)点积为0得到5a+3b=6；与u=(1,1,1)点积为0得到3a+3b=5。两式相减得a=1/2，再代入得b=7/6。X转置乘X的两行为(5,3)、(3,3)，X转置乘y=(6,5)。</desc><defs><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#127965"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2a6694"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#bc5d25"/></marker><marker id="inkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#233a3b"/></marker><marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#6f7e79"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  17  最小二乘与投影</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">两行点积，就得到两条方程</text><text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">Xᵀr = 0：分别检查残差是否垂直于 X 的两列</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text><text x="700" y="235" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">r = (1 − b,  2 − a − b,  2 − 2a − b)</text><line x1="700" y1="268" x2="700" y2="555" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="355" y="315" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="700" text-anchor="middle">x · r = 0</text><text x="1045" y="315" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="700" text-anchor="middle">u · r = 0</text><text x="355" y="366" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">0(1 − b) + (2 − a − b)</text><text x="355" y="410" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">+ 2(2 − 2a − b) = 0</text><text x="1045" y="366" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">(1 − b) + (2 − a − b)</text><text x="1045" y="410" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">+ (2 − 2a − b) = 0</text><line x1="355" y1="437" x2="355" y2="475" stroke="#2a6694" stroke-width="3" stroke-linecap="round" marker-end="url(#blueArrow)"/><line x1="1045" y1="437" x2="1045" y2="475" stroke="#127965" stroke-width="3" stroke-linecap="round" marker-end="url(#greenArrow)"/><text x="355" y="533" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="41" font-weight="700" text-anchor="middle">5a + 3b = 6</text><text x="1045" y="533" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="41" font-weight="700" text-anchor="middle">3a + 3b = 5</text><line x1="150" y1="574" x2="1250" y2="574" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="700" y="624" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">两式相减：2a = 1   →   a = 1/2</text><text x="700" y="682" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">再代入：3/2 + 3b = 5   →   b = 7/6</text><text x="700" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">矩阵形式：XᵀX θ* = Xᵀy</text><text x="700" y="808" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">XᵀX 的两行是 (5,3)、(3,3)；Xᵀy = (6,5)</text></svg>