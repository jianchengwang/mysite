<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>远处若有更低点，线段会把改进带到附近</title><desc>左侧是凸域中的线段与局部邻域。右侧用g(t)=(1-t)^2演示端点弦和t=0.15处的函数值。候选起点不是实际局部最小点。</desc><rect width="1400" height="900" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="55.00" y="50.00" font-size="22" fill="#0b806c" text-anchor="start" font-weight="400">数学之美 / 33 局部与全局</text><text x="55.00" y="112.00" font-size="42" fill="#213b3d" text-anchor="start" font-weight="700">远处若有更低点，线段会把改进带到附近</text><text x="55.00" y="165.00" font-size="25" fill="#213b3d" text-anchor="start" font-weight="400">凸域保证中间点可选；凸函数保证中间值不高于弦</text><text x="345.00" y="238.00" font-size="29" fill="#0b806c" text-anchor="middle" font-weight="600">位置：整条线段留在 C 内</text><text x="1040.00" y="238.00" font-size="29" fill="#0b806c" text-anchor="middle" font-weight="600">函数值：曲线不高于端点弦</text><polygon points="85,355 575,280 635,600 120,650" fill="#e8f2e8" stroke="#0b806c" stroke-width="2"/><text x="555.00" y="580.00" font-size="34" fill="#0b806c" text-anchor="start" font-weight="400">C</text><circle cx="220" cy="505" r="95" fill="none" stroke="#2b6f9f" stroke-width="2.5" stroke-dasharray="7 6"/><line x1="220.00" y1="505.00" x2="550.00" y2="345.00" stroke="#718582" stroke-width="4"/><circle cx="220.00" cy="505.00" r="8" fill="#213b3d"/><circle cx="550.00" cy="345.00" r="8" fill="#c35922"/><circle cx="269.50" cy="481.00" r="9" fill="#0b806c"/><text x="192.00" y="548.00" font-size="30" fill="#213b3d" text-anchor="start" font-weight="400">x*</text><text x="544.00" y="326.00" font-size="30" fill="#c35922" text-anchor="start" font-weight="400">y</text><text x="260.00" y="449.00" font-size="30" fill="#0b806c" text-anchor="start" font-weight="400">zₜ</text><text x="135.00" y="389.00" font-size="24" fill="#2b6f9f" text-anchor="start" font-weight="400">半径 ρ</text><text x="355.00" y="676.00" font-size="24" fill="#0b806c" text-anchor="middle" font-weight="400">zₜ = (1−t)x* + ty</text><text x="355.0