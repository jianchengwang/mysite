<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc"><title id="title">逐个计算残差，再比较平方和</title><desc id="desc">三个等尺度面板分别显示A、B、C的观测点、预测值和竖直残差。A残差为0、0、负1；B为0、二分之一、0；C为负六分之一、三分之一、负六分之一。平方和分别为1、四分之一、六分之一。</desc><rect width="1400" height="960" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  12  数据与预测线</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">逐个计算残差，再比较平方和</text><text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">观测点保持不动；选不同的线，预测值和残差随之改变</text><circle cx="910" cy="204" r="8" fill="#233a3b" stroke="#fffdf7" stroke-width="2"/><text x="930" y="213" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">观测 y</text><circle cx="1115" cy="204" r="10" fill="#fffdf7" stroke="#2a6694" stroke-width="3"/><text x="1138" y="213" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">预测 ŷ</text><text x="237" y="266" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">A   ŷ = x + 1</text><line x1="115" y1="588" x2="414.0" y2="588" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="97" y="596" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">1</text><line x1="115" y1="460" x2="414.0" y2="460" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="97" y="468" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">2</text><line x1="115" y1="332" x2="414.0" y2="332" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="97" y="340" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">3</text><line x1="245" y1="716" x2="245" y2="319.2" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><line x1="375" y1="716" x2="375" y2="319.2" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><line x1="115" y1="716" x2="414.0" y2="716" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><line x1="115" y1="716" x2="115" y2="300.0" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="115" y="747" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0</text><text x="245" y="747" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">1</text><text x="375" y="747" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">2</text><line x1="115" y1="588" x2="394.5" y2="312.8" stroke="#bc5d25" stroke-width="4" stroke-linecap="round"/><line x1="115" y1="588" x2="115" y2="588" stroke="#bc5d25" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="115" cy="588" r="11" fill="#fffdf7" stroke="#bc5d25" stroke-width="3"/><circle cx="115" cy="588" r="7" fill="#233a3b" stroke="#fffdf7" stroke-width="1.5"/><line x1="245" y1="460" x2="245" y2="460" stroke="#bc5d25" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="245" cy="460" r="11" fill="#fffdf7" stroke="#bc5d25" stroke-width="3"/><circle cx="245" cy="460" r="7" fill="#233a3b" stroke="#fffdf7" stroke-width="1.5"/><line x1="375" y1="460" x2="375" y2="332" stroke="#bc5d25" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="375" cy="332" r="11" fill="#fffdf7" stroke="#bc5d25" stroke-width="3"/><circle cx="375" cy="460" r="7" fill="#233a3b" stroke="#fffdf7" stroke-width="1.5"/><text x