<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">三个数据点，给出三条要求</title><desc id="desc">观测点为(0,1)、(1,2)、(2,2)。A为y帽=x+1，B为y帽=x/2+1。对应精确通过三点的要求为b=1、a+b=2、2a+b=2，不能同时成立。</desc><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  12  数据与预测线</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">三个数据点，给出三条要求</text><text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">两点可以定下一条线，第三点却可能无法同时满足</text><line x1="140" y1="540" x2="715.75" y2="540" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="115" y="549" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">1</text><line x1="140" y1="420" x2="715.75" y2="420" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="115" y="429" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">2</text><line x1="140" y1="300" x2="715.75" y2="300" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="115" y="309" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">3</text><line x1="375" y1="660" x2="375" y2="252.0" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 7"/><line x1="610" y1="660" x2="610" y2="252.0" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 7"/><line x1="140" y1="660" x2="727.5" y2="660" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><line x1="140" y1="660" x2="140" y2="228.0" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><text x="140" y="696" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">0</text><text x="375" y="696" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">1</text><text x="610" y="696" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">2</text><text x="705" y="716" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">x / 厘米</text><text x="82" y="215" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">y / 厘米</text><line x1="140" y1="540" x2="692.25" y2="258.0" stroke="#bc5d25" stroke-width="5" stroke-linecap="round"/><line x1="140" y1="540" x2="692.25" y2="399.0" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><line x1="610" y1="420" x2="610" y2="300" stroke="#bc5d25" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 7"/><circle cx="610" cy="300" r="10" fill="#fffdf7" stroke="#bc5d25" stroke-width="3"/><line x1="375" y1="480.0" x2="375" y2="420" stroke="#2a6694" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 7"/><circle cx="375" cy="480.0" r="10" fill="#fffdf7" stroke="#2a6694" stroke-width="3"/><circle cx="140" cy="540" r="10" fill="#233a3b" stroke="#fffdf7" stroke-width="2"/><circle cx="375" cy="420" r="10" fill="#233a3b" stroke="#fffdf7" stroke-width="2"/><circle cx="610" cy="420" r="10" fill="#233a3b" stroke="#fffdf7" stroke-width="2"/><text x="156" y="576" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">(0,1)</text><text x="353" y="400" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="end">(1,2)</text><text x="630" y="450" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">(2,2)</text><text x="590" y="242" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">A：ŷ = x + 1</text><text x="460" y="570" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">B：ŷ = x/2 + 1</text><line x1="810" y1="220" x2="810" y2="720" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="870" y="253" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">要求精确通过</text><text x="1118" y="253" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">参数必须满足</text><text x="875" y="325" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" text-anchor="start">(0,1)</text><text x="1020" y="325" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start">→</text><text x="1110" y="325" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">b = 1</text><text x="875" y="414" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" text-anchor="start">(1,2)</text><text x="1020" y="414" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start">→</text><text x="1110" y="414" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">a + b = 2</text><text x="875" y="503" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" text-anchor="start">(2,2)</text><text x="1020" y="503" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start">→</text><text x="1110" y="503" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">2a + b = 2</text><line x1="865" y1="546" x2="1335" y2="546" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="870" y="599" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">前两条要求：b = 1，a = 1</text><text x="870" y="648" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">代入第三条：2a + b = 3 ≠ 2</text><text x="700" y="790" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">同一对参数 a、b，必须同时回应全部观测</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text></svg>