<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">选择怎样计分，会改变偏好</title><desc id="desc">同一组三点下比较B与C。平方和B为1/4，C为1/6，C较小；绝对误差和B为1/2，C为2/3，B较小；最大误差B为1/2，C为1/3，C较小。平方和以平方厘米计，其余两项以厘米计；三列标准不同，只在同一列比较候选。</desc><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  12  数据与预测线</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">选择怎样计分，会改变偏好</text><text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">用同一组三点，比较同样两条候选线；每列都是一个独立标准</text><text x="650" y="252" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">残差平方和</text><text x="650" y="294" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">单位：厘米²</text><text x="925" y="252" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">绝对误差和</text><text x="925" y="294" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">单位：厘米</text><text x="1200" y="252" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">最大误差</text><text x="1200" y="294" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">单位：厘米</text><line x1="55" y1="326" x2="1345" y2="326" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="55" y1="527" x2="1345" y2="527" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="55" y1="730" x2="1345" y2="730" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="510" y1="227" x2="510" y2="729" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><line x1="788" y1="227" x2="788" y2="729" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><line x1="1063" y1="227" x2="1063" y2="729" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="82" y="398" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" text-anchor="start">B</text><text x="143" y="396" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="start">ŷ = x/2 + 1</text><text x="82" y="452" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">r：0，1/2，0</text><text x="650" y="415" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" text-anchor="middle">1/4</text><rect x="820" y="350" width="210" height="135" rx="12" fill="#edf4ec" stroke="none"/><text x="925" y="415" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" text-anchor="middle">1/2</text><text x="925" y="459" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="middle">较小</text><text x="1200" y="415" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" text-anchor="middle">1/2</text><text x="82" y="598" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" text-anchor="start">C</text><text x="143" y="596" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="start">ŷ = x/2 + 7/6</text><text x="82" y="652" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">r：−1/6，1/3，−1/6</text><rect x="545" y="550" width="210" height="135" rx="12" fill="#edf4ec" stroke="none"/><text x="650" y="615" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" text-anchor="middle">1/6</text><text x="650" y="659" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="middle">较小</text><text x="925" y="615" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" text-anchor="middle">2/3</text><rect x="1095" y="550" width="210" height="135" rx="12" fill="#edf4ec" stroke="none"/><text x="1200" y="615" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" text-anchor="middle">1/3</text><text x="1200" y="659" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="middle">较小</text><text x="700" y="785" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">“更好”必须说明按什么标准；不能跨列混比分数</text><text x="700" y="830" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">这里只比较 B、C，没有证明任一标准的全局最优</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text></svg>