<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>同一份总账，拆成基准与额外代价</title><desc>顶部两行按每位320像素的同一尺度绘制。原平均码长1.75；新平均码长2.625包含1.75的熵和0.875的KL散度。下方独立列出实际样例AAAABBCD，原14位，新21位，多7位；这不是任意八符号消息的保证。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400.0000" height="900" fill="#fffdf6" stroke="none" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 27 分布失配的代价</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">同一份总账，拆成基准与额外代价</text><text x="55" y="165" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">固定同一个真实分布 p，把交叉熵分成基准与失配两笔</text><line x1="300" y1="224" x2="300" y2="490" stroke="#dce4de" stroke-width="2"/><text x="300" y="211" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0</text><line x1="460.0" y1="224" x2="460.0" y2="490" stroke="#dce4de" stroke-width="2"/><text x="460.0" y="211" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0.5</text><line x1="620" y1="224" x2="620" y2="490" stroke="#dce4de" stroke-width="2"/><text x="620" y="211" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">1</text><line x1="780.0" y1="224" x2="780.0" y2="490" stroke="#dce4de" stroke-width="2"/><text x="780.0" y="211" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">1.5</text><line x1="940" y1="224" x2="940" y2="490" stroke="#dce4de" stroke-width="2"/><text x="940" y="211" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">2</text><line x1="1100.0" y1="224" x2="1100.0" y2="490" stroke="#dce4de" stroke-width="2"/><text x="1100.0" y="211" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">2.5</text><text x="1190" y="211" font-size="24" fill="#718582" font-weight="400" text-anchor="start">位/符号</text><text x="55" y="300" font-size="30" fill="#0b806c" font-weight="600" text-anchor="start">按p收费</text><rect x="300" y="251" width="560.0000" height="73" fill="#0b806c" stroke="none" rx="0"/><text x="882.0" y="300" font-size="32" fill="#0b806c" font-weight="600" text-anchor="start">1.75</text><text x="55" y="440" font-size="30" fill="#213b3d" font-weight="600" text-anchor="start">按q收费</text><rect x="300" y="391" width="560.0000" height="73" fill="#0b806c" stroke="none" rx="0"/><rect x="860.0" y="391" width="280.0000" height="73" fill="#c35922" stroke="none" rx="0"/><text x="1162.0" y="440" font-size="32" fill="#c35922" font-weight="600" text-anchor="start">2.625</text><text x="580" y="439" font-size="32" fill="#ffffff" font-weight="600" text-anchor="middle">H(p) = 1.75</text><text x="1000" y="438" font-size="30" fill="#ffffff" font-weight="600" text-anchor="middle">+ 0.875</text><line x1="860" y1="338" x2="860" y2="520" stroke="#c35922" stroke-width="3" stroke-dasharray="7 5"/><line x1="1140" y1="480" x2="1140" y2="520" stroke="#c35922" stroke-width="2"/><line x1="860" y1="512" x2="1140" y2="512" stroke="#c35922" stroke-width="2"/><text x="1000" y="556" font-size="29" fill="#c35922" font-weight="600" text-anchor="middle">D(p ∥ q) = 7/8</text><line x1="55" y1="603" x2="1345" y2="603" stroke="#dce4de" stroke-width="2"/><text x="55" y="651" font-size="30" fill="#213b3d" font-weight="600" text-anchor="start">具体样例 AAAABBCD 的正文账单</text><text x="55" y="706" font-size="25" fill="#718582" font-weight="400" text-anchor="start">出现次数</text><text x="315" y="708" font-size="29" fill="#213b3d" font-weight="500" text-anchor="middle">A × 4</text><text x="590" y="708" font-size="29" fill="#213b3d" font-weight="500" text-anchor="middle">B × 2</text><text x="865" y="708" font-size="29" fill="#213b3d" font-weight="500" text-anchor="middle">C × 1</text><text x="1140" y="708" font-size="29" fill="#213b3d" font-weight="500" text-anchor="middle">D × 1</text><text x="700" y="775" font-size="39" fill="#213b3d" font-weight="700" text-anchor="middle">14位  +  7位  =  21位</text><text x="700" y="826" font-size="25" fill="#718582" font-weight="400" text-anchor="middle">这条样例恰好吻合p；其他八符号消息不保证也多7位</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 对数以2为底，费用单位为位</text></g></svg>