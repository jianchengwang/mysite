<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>换了码表，不能换掉实际权重</title><desc>四符号真实概率依次为二分之一、四分之一、八分之一、八分之一。原码字为0、10、110、111，另一码字为110、111、10、0。两种方案的加权成本分别为0.5、0.5、0.375、0.375与1.5、0.75、0.25、0.125。每一横条用同一零点和每位400像素的尺度。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400.0000" height="900" fill="#fffdf6" stroke="none" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 27 分布失配的代价</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">换了码表，不能换掉实际权重</text><text x="55" y="165" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">数据来自 p；横条表示期望贡献 pᵢ × 码长</text><rect x="915" y="147" width="25.0000" height="18" fill="#0b806c" stroke="none" rx="0"/><text x="950" y="165" font-size="23" fill="#0b806c" font-weight="400" text-anchor="start">按p的码表</text><rect x="1142" y="147" width="25.0000" height="18" fill="#c35922" stroke="none" rx="0"/><text x="1177" y="165" font-size="23" fill="#c35922" font-weight="400" text-anchor="start">按q的码表</text><line x1="560" y1="218" x2="560" y2="756" stroke="#dce4de" stroke-width="2"/><text x="560" y="210" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0</text><line x1="760.0" y1="218" x2="760.0" y2="756" stroke="#dce4de" stroke-width="2"/><text x="760.0" y="210" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0.5</text><line x1="960" y1="218" x2="960" y2="756" stroke="#dce4de" stroke-width="2"/><text x="960" y="210" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">1</text><line x1="1160.0" y1="218" x2="1160.0" y2="756" stroke="#dce4de" stroke-width="2"/><text x="1160.0" y="210" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">1.5</text><text x="1240" y="210" font-size="23" fill="#718582" font-weight="400" text-anchor="start">位/符号</text><text x="64" y="285" font-size="39" fill="#213b3d" font-weight="700" text-anchor="start">A</text><text x="155" y="285" font-size="28" fill="#213b3d" font-weight="400" text-anchor="start">p = 1/2</text><text x="332" y="262" font-size="27" fill="#0b806c" font-weight="500" text-anchor="start">0 · 1位</text><text x="332" y="313" font-size="27" fill="#c35922" font-weight="500" text-anchor="start">110 · 3位</text><rect x="560" y="233" width="200.0000" height="38" fill="#0b806c" stroke="none" rx="0"/><text x="775.0" y="262" font-size="27" fill="#0b806c" font-weight="600" text-anchor="start">1/2</text><rect x="560" y="284" width="600.0000" height="38" fill="#c35922" stroke="none" rx="0"/><text x="1175.0" y="313" font-size="27" fill="#c35922" font-weight="600" text-anchor="start">3/2</text><line x1="55" y1="352" x2="1345" y2="352" stroke="#dce4de" stroke-width="1"/><text x="64" y="419" font-size="39" fill="#213b3d" font-weight="700" text-anchor="start">B</text><text x="155" y="419" font-size="28" fill="#213b3d" font-weight="400" text-anchor="start">p = 1/4</text><text x="332" y="396" font-size="27" fill="#0b806c" font-weight="500" text-anchor="start">10 · 2位</text><text x="332" y="447" font-size="27" fill="#c35922" font-weight="500" text-anchor="start">111 · 3位</text><rect x="560" y="367" width="200.0000" height="38" fill="#0b806c" stroke="none" rx="0"/><text x="775.0" y="396" font-size="27" fill="#0b806c" font-weight="600" text-anchor="start">1/2</text><rect x="560" y="418" width="300.0000" height="38" fill="#c35922" stroke="none" rx="0"/><text x="875.0" y="447" font-size="27" fill="#c35922" font-weight="600" text-anchor="start">3/4</text><line x1="55" y1="486" x2="1345" y2="486" stroke="#dce4de" stroke-width="1"/><text x="64" y="553" font-size="39" fill="#213b3d" font-weight="700" text-anchor="start">C</text><text x="155" y="553" font-size="28" fill="#213b3d" font-weight="400" text-anchor="start">p = 1/8</text><text x="332" y="530" font-size="27" fill="#0b806c" font-weight="500" text-anchor="start">110 · 3位</text><text x="332" y="581" font-size="27" fill="#c35922" font-weight="500" text-anchor="start">10 · 2位</text><rect x="560" y="501" width="150.0000" height="38" fill="#0b806c" stroke="none" rx="0"/><text x="725.0" y="530" font-size="27" fill="#0b806c" font-weight="600" text-anchor="start">3/8</text><rect x="560" y="552" width="100.0000" height="38" fill="#c35922" stroke="none" rx="0"/><text x="675.0" y="581" font-size="27" fill="#c35922" font-weight="600" text-anchor="start">1/4</text><line x1="55" y1="620" x2="1345" y2="620" stroke="#dce4de" stroke-width="1"/><text x="64" y="687" font-size="39" fill="#213b3d" font-weight="700" text-anchor="start">D</text><text x="155" y="687" font-size="28" fill="#213b3d" font-weight="400" text-anchor="start">p = 1/8</text><text x="332" y="664" font-size="27" fill="#0b806c" font-weight="500" text-anchor="start">111 · 3位</text><text x="332" y="715" font-size="27" fill="#c35922" font-weight="500" text-anchor="start">0 · 1位</text><rect x="560" y="635" width="150.0000" height="38" fill="#0b806c" stroke="none" rx="0"/><text x="725.0" y="664" font-size="27" fill="#0b806c" font-weight="600" text-anchor="start">3/8</text><rect x="560" y="686" width="50.0000" height="38" fill="#c35922" stroke="none" rx="0"/><text x="625.0" y="715" font-size="27" fill="#c35922" font-weight="600" text-anchor="start">1/8</text><line x1="55" y1="779" x2="1345" y2="779" stroke="#dce4de" stroke-width="2"/><text x="64" y="824" font-size="29" fill="#213b3d" font-weight="600" text-anchor="start">加权总账</text><text x="366" y="824" font-size="30" fill="#0b806c" font-weight="600" text-anchor="start">原码表  7/4 = 1.75</text><text x="830" y="824" font-size="30" fill="#c35922" font-weight="600" text-anchor="start">误用q  21/8 = 2.625</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 对数以2为底，费用单位为位</text></g></svg>