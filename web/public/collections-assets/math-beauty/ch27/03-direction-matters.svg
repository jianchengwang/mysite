<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>多付多少，取决于谁是真实来源</title><desc>概率条长度按概率精确分配；r的A和B各一半，s的A占四分之三、B占四分之一。下方两条KL费用使用每位3000像素的共同尺度，D(r||s)约0.207519，D(s||r)约0.188722。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400.0000" height="900" fill="#fffdf6" stroke="none" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 27 分布失配的代价</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">多付多少，取决于谁是真实来源</text><text x="55" y="165" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">换一个二符号例子：r = (1/2, 1/2)，s = (3/4, 1/4)</text><text x="55" y="226" font-size="28" fill="#213b3d" font-weight="600" text-anchor="start">两种来源，概率质量的分配不同</text><text x="85" y="309" font-size="36" fill="#213b3d" font-weight="700" text-anchor="start">r</text><rect x="220" y="259" width="460.0000" height="69" fill="#0b806c" stroke="none" rx="0"/><rect x="680.0" y="259" width="460.0000" height="69" fill="#2b6f9f" stroke="none" rx="0"/><text x="450.0" y="305" font-size="30" fill="#ffffff" font-weight="600" text-anchor="middle">A：1/2</text><text x="910.0" y="305" font-size="30" fill="#ffffff" font-weight="600" text-anchor="middle">B：1/2</text><text x="85" y="415" font-size="36" fill="#213b3d" font-weight="700" text-anchor="start">s</text><rect x="220" y="365" width="690.0000" height="69" fill="#0b806c" stroke="none" rx="0"/><rect x="910.0" y="365" width="230.0000" height="69" fill="#2b6f9f" stroke="none" rx="0"/><text x="565.0" y="411" font-size="30" fill="#ffffff" font-weight="600" text-anchor="middle">A：3/4</text><text x="1025.0" y="411" font-size="30" fill="#ffffff" font-weight="600" text-anchor="middle">B：1/4</text><text x="700" y="493" font-size="29" fill="#213b3d" font-weight="600" text-anchor="middle">交换顺序，也交换了平均时的权重</text><line x1="455" y1="565" x2="455" y2="783" stroke="#dce4de" stroke-width="2"/><text x="455" y="554" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">0</text><line x1="605.0" y1="565" x2="605.0" y2="783" stroke="#dce4de" stroke-width="2"/><text x="605.0" y="554" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">0.05</text><line x1="755.0" y1="565" x2="755.0" y2="783" stroke="#dce4de" stroke-width="2"/><text x="755.0" y="554" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">0.1</text><line x1="905.0" y1="565" x2="905.0" y2="783" stroke="#dce4de" stroke-width="2"/><text x="905.0" y="554" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">0.15</text><line x1="1055.0" y1="565" x2="1055.0" y2="783" stroke="#dce4de" stroke-width="2"/><text x="1055.0" y="554" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">0.2</text><line x1="1205.0" y1="565" x2="1205.0" y2="783" stroke="#dce4de" stroke-width="2"/><text x="1205.0" y="554" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">0.25</text><text x="55" y="610" font-size="27" fill="#213b3d" font-weight="600" text-anchor="start">r是真实，s是模型</text><text x="55" y="650" font-size="26" fill="#718582" font-weight="400" text-anchor="start">D(r ∥ s)</text><rect x="455" y="585" width="622.5562" height="55" fill="#c35922" stroke="none" rx="0"/><text x="1093.5562489182655" y="623" font-size="29" fill="#c35922" font-weight="600" text-anchor="start">0.207519</text><text x="55" y="724" font-size="27" fill="#213b3d" font-weight="600" text-anchor="start">s是真实，r是模型</text><text x="55" y="764" font-size="26" fill="#718582" font-weight="400" text-anchor="start">D(s ∥ r)</text><rect x="455" y="699" width="566.1656" height="55" fill="#c35922" stroke="none" rx="0"/><text x="1037.1656266226014" y="737" font-size="29" fill="#c35922" font-weight="600" text-anchor="start">0.188722</text><text x="700" y="830" font-size="28" fill="#213b3d" font-weight="600" text-anchor="middle">两笔代价都非负，但并不相等；KL不是对称距离</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 对数以2为底，费用单位为位</text></g></svg>