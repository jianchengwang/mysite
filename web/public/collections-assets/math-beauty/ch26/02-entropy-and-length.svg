<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>下界来自概率加权，不是等分</title><desc>概率为二分之一、四分之一、八分之一、八分之一；长度1、2、3、3加权为1.75，固定两位加权为2。两条横条从相同零点按相同比例绘制。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" fill="#fffdf6" stroke="none" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 26 熵与编码下界</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">下界来自概率加权，不是等分</text><text x="55" y="165" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">同一分布 p = (1/2, 1/4, 1/8, 1/8)，比较两张合法码表</text><text x="410" y="245" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">A</text><text x="650" y="245" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">B</text><text x="890" y="245" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">C</text><text x="1130" y="245" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">D</text><text x="70" y="310" font-size="29" fill="#718582" font-weight="600" text-anchor="start">出现概率</text><text x="410" y="310" font-size="32" fill="#718582" font-weight="500" text-anchor="middle">1/2</text><text x="650" y="310" font-size="32" fill="#718582" font-weight="500" text-anchor="middle">1/4</text><text x="890" y="310" font-size="32" fill="#718582" font-weight="500" text-anchor="middle">1/8</text><text x="1130" y="310" font-size="32" fill="#718582" font-weight="500" text-anchor="middle">1/8</text><text x="70" y="390" font-size="29" fill="#0b806c" font-weight="600" text-anchor="start">原码长 ℓ</text><text x="410" y="390" font-size="32" fill="#0b806c" font-weight="500" text-anchor="middle">1</text><text x="650" y="390" font-size="32" fill="#0b806c" font-weight="500" text-anchor="middle">2</text><text x="890" y="390" font-size="32" fill="#0b806c" font-weight="500" text-anchor="middle">3</text><text x="1130" y="390" font-size="32" fill="#0b806c" font-weight="500" text-anchor="middle">3</text><text x="70" y="470" font-size="29" fill="#2b6f9f" font-weight="600" text-anchor="start">固定码长</text><text x="410" y="470" font-size="32" fill="#2b6f9f" font-weight="500" text-anchor="middle">2</text><text x="650" y="470" font-size="32" fill="#2b6f9f" font-weight="500" text-anchor="middle">2</text><text x="890" y="470" font-size="32" fill="#2b6f9f" font-weight="500" text-anchor="middle">2</text><text x="1130" y="470" font-size="32" fill="#2b6f9f" font-weight="500" text-anchor="middle">2</text><line x1="55" y1="505" x2="1345" y2="505" stroke="#dce4de" stroke-width="2"/><text x="55" y="555" font-size="29" fill="#213b3d" font-weight="600" text-anchor="start">概率加权后的平均长度</text><text x="70" y="630" font-size="29" fill="#0b806c" font-weight="400" text-anchor="start">原码表</text><rect x="260" y="592" width="787.5" height="58" fill="#0b806c" stroke="none" rx="0"/><text x="1080" y="632" font-size="31" fill="#0b806c" font-weight="600" text-anchor="start">1.75 = H</text><text x="70" y="730" font-size="29" fill="#2b6f9f" font-weight="400" text-anchor="start">固定两位</text><rect x="260" y="692" width="900" height="58" fill="#2b6f9f" stroke="none" rx="0"/><text x="1190" y="732" font-size="31" fill="#2b6f9f" font-weight="600" text-anchor="start">2</text><line x1="1047.5" y1="575" x2="1047.5" y2="765" stroke="#c35922" stroke-width="3" stroke-dasharray="7 5"/><text x="700" y="818" font-size="29" fill="#213b3d" font-weight="600" text-anchor="middle">原码表达到下界；固定两位平均多用 0.25 位/符号</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 二进制前缀码模型</text></g></svg>