<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>三个长度，回答三个不同的问题</title><desc>三个等可能符号的熵log2(3)约1.585；最优逐符号前缀码平均5/3；向上取整每个2位的方案平均2。横条均从同一零点按相同尺度绘制。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" fill="#fffdf6" stroke="none" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 26 熵与编码下界</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">三个长度，回答三个不同的问题</text><text x="55" y="165" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">三个等可能符号：每个概率都是1/3，码字长度必须是整数</text><text x="55" y="312" font-size="29" fill="#718582" font-weight="600" text-anchor="start">熵下界</text><rect x="350" y="275" width="633.9850002884624" height="55" fill="#718582" stroke="none" rx="0"/><text x="1185" y="312" font-size="27" fill="#718582" font-weight="500" text-anchor="middle">log₂3 ≈ 1.585</text><text x="55" y="467" font-size="29" fill="#0b806c" font-weight="600" text-anchor="start">最优逐符号码</text><rect x="350" y="430" width="666.6666666666667" height="55" fill="#0b806c" stroke="none" rx="0"/><text x="1185" y="467" font-size="27" fill="#0b806c" font-weight="500" text-anchor="middle">5/3 ≈ 1.667</text><text x="55" y="622" font-size="29" fill="#2b6f9f" font-weight="600" text-anchor="start">简单向上取整</text><rect x="350" y="585" width="800" height="55" fill="#2b6f9f" stroke="none" rx="0"/><text x="1185" y="622" font-size="27" fill="#2b6f9f" font-weight="500" text-anchor="middle">2</text><text x="355" y="370" font-size="25" fill="#718582" font-weight="400" text-anchor="start">未必存在逐个符号都恰好达到它的码字</text><text x="355" y="525" font-size="27" fill="#0b806c" font-weight="400" text-anchor="start">0、10、11  →  长度 1、2、2</text><text x="355" y="680" font-size="27" fill="#2b6f9f" font-weight="400" text-anchor="start">00、01、10  →  长度 2、2、2</text><line x1="55" y1="735" x2="1345" y2="735" stroke="#dce4de" stroke-width="2"/><text x="700" y="790" font-size="32" fill="#213b3d" font-weight="600" text-anchor="middle">下界 ≤ 最优码长 ≤ 构造出的码长</text><text x="700" y="835" font-size="26" fill="#718582" font-weight="400" text-anchor="middle">此处整数余量真实存在，并非四舍五入误差</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 二进制前缀码模型</text></g></svg>