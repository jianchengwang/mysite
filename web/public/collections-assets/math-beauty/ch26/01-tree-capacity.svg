<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>短码字占更多树容量</title><desc>码字0、10、110、111在完整深度3二叉树底部分别占4、2、1、1个后代；容量总和为1。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" fill="#fffdf6" stroke="none" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 26 熵与编码下界</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">短码字占更多树容量</text><text x="55" y="165" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">码字是叶子；它下面的所有位置，都不能再分给其他符号</text><line x1="700" y1="235" x2="350" y2="355" stroke="#718582" stroke-width="3"/><line x1="700" y1="235" x2="960" y2="355" stroke="#718582" stroke-width="3"/><line x1="960" y1="355" x2="800" y2="480" stroke="#718582" stroke-width="3"/><line x1="960" y1="355" x2="1175" y2="480" stroke="#718582" stroke-width="3"/><line x1="1175" y1="480" x2="1095" y2="605" stroke="#718582" stroke-width="3"/><line x1="1175" y1="480" x2="1260" y2="605" stroke="#718582" stroke-width="3"/><circle cx="700" cy="235" r="8" fill="#0b806c"/><text x="700" y="215" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">根</text><circle cx="350" cy="355" r="8" fill="#0b806c"/><text x="350" y="335" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">A：0</text><circle cx="960" cy="355" r="8" fill="#0b806c"/><text x="960" y="335" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">1</text><circle cx="800" cy="480" r="8" fill="#0b806c"/><text x="800" y="460" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">B：10</text><circle cx="1175" cy="480" r="8" fill="#0b806c"/><text x="1175" y="460" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">11</text><circle cx="1095" cy="605" r="8" fill="#0b806c"/><text x="1095" y="585" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">C：110</text><circle cx="1260" cy="605" r="8" fill="#0b806c"/><text x="1260" y="585" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">D：111</text><text x="500" y="285" font-size="25" fill="#2b6f9f" font-weight="400" text-anchor="start">0</text><text x="850" y="285" font-size="25" fill="#2b6f9f" font-weight="400" text-anchor="start">1</text><text x="850" y="415" font-size="25" fill="#2b6f9f" font-weight="400" text-anchor="start">0</text><text x="1100" y="420" font-size="25" fill="#2b6f9f" font-weight="400" text-anchor="start">1</text><text x="1115" y="550" font-size="25" fill="#2b6f9f" font-weight="400" text-anchor="start">0</text><text x="1235" y="550" font-size="25" fill="#2b6f9f" font-weight="400" text-anchor="start">1</text><text x="160" y="475" font-size="29" fill="#0b806c" font-weight="600" text-anchor="start">A占4个位置</text><text x="680" y="575" font-size="29" fill="#2b6f9f" font-weight="600" text-anchor="start">B占2个位置</text><text x="55" y="680" font-size="25" fill="#718582" font-weight="400" text-anchor="start">补到深度3：共8个等宽位置</text><rect x="100" y="715" width="150" height="74" fill="#d7ece0" stroke="#fffdf6" rx="0"/><text x="175" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">000</text><rect x="250" y="715" width="150" height="74" fill="#d7ece0" stroke="#fffdf6" rx="0"/><text x="325" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">001</text><rect x="400" y="715" width="150" height="74" fill="#d7ece0" stroke="#fffdf6" rx="0"/><text x="475" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">010</text><rect x="550" y="715" width="150" height="74" fill="#d7ece0" stroke="#fffdf6" rx="0"/><text x="625" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">011</text><rect x="700" y="715" width="150" height="74" fill="#dcebf3" stroke="#fffdf6" rx="0"/><text x="775" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">100</text><rect x="850" y="715" width="150" height="74" fill="#dcebf3" stroke="#fffdf6" rx="0"/><text x="925" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">101</text><rect x="1000" y="715" width="150" height="74" fill="#f4e0cb" stroke="#fffdf6" rx="0"/><text x="1075" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">110</text><rect x="1150" y="715" width="150" height="74" fill="#f4e0cb" stroke="#fffdf6" rx="0"/><text x="1225" y="762" font-size="28" fill="#213b3d" font-weight="500" text-anchor="middle">111</text><text x="700" y="832" font-size="33" fill="#0b806c" font-weight="600" text-anchor="middle">4/8 + 2/8 + 1/8 + 1/8 = 1</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 二进制前缀码模型</text></g></svg>