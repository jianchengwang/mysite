<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">沿不可见的方向移动，输出不变</title><desc id="desc">左侧是三维参数空间中a=1的二维截面，横轴b，纵轴c。解直线b+2c=1上三个点(1,3,-1)、(1,1,0)、(1,-1,1)都映为三维输出(1,2,3)。零方向是(0,-2,1)。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#127965" stroke-width="1.7"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  16  秩与零空间</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">沿不可见的方向移动，输出不变</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">新矩阵 X′ = [x, u, 2u]，数据只能识别 a 和 b + 2c</text><text x="375" y="237" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">参数空间 ℝ³ 中的截面 a = 1</text><line x1="136" y1="300" x2="136" y2="720" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="136" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">-3</text><line x1="219" y1="300" x2="219" y2="720" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="219" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">-2</text><line x1="302" y1="300" x2="302" y2="720" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="302" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">-1</text><line x1="385" y1="300" x2="385" y2="720" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="385" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">0</text><line x1="468" y1="300" x2="468" y2="720" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="468" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">1</text><line x1="551" y1="300" x2="551" y2="720" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="551" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">2</text><line x1="634" y1="300" x2="634" y2="720" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="634" y="754" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">3</text><line x1="112" y1="675" x2="680" y2="675" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="92" y="683" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">-1</text><line x1="112" y1="575" x2="680" y2="575" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="92" y="583" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">0</text><line x1="112" y1="475" x2="680" y2="475" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="92" y="483" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">1</text><line x1="112" y1="375" x2="680" y2="375" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round"/><text x="92" y="383" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">2</text><line x1="112" y1="575" x2="700" y2="575" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><line x1="385" y1="720" x2="385" y2="282" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><text x="711" y="583" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">b</text><text x="397" y="280" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">c</text><line x1="136" y1="375" x2="667.2" y2="695.0" stroke="#127965" stroke-width="5" stroke-linecap="round"/><text x="115" y="313" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">b + 2c = 1</text><circle cx="634" cy="675" r="10" fill="#127965" stroke="#fffdf7" stroke-width="3"/><circle cx="468" cy="575" r="10" fill="#127965" stroke="#fffdf7" stroke-width="3"/><circle cx="302" cy="475" r="10" fill="#127965" stroke="#fffdf7" stroke-width="3"/><text x="615" y="706" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="end">(1,3,−1)</text><text x="493" y="557" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="start">(1,1,0)</text><path d="M 302 410 V 455" fill="none" stroke="#6f7e79" stroke-width="1.5"/><text x="210" y="400" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="start">(1,−1,1)</text><line x1="447" y1="555" x2="281" y2="455" stroke="#127965" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="148" y="503" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="start">Δa = 0</text><text x="148" y="537" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="start">Δb = −2</text><text x="148" y="570" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="start">Δc = +1</text><text x="770" y="419" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">X′</text><line x1="735" y1="457" x2="910" y2="457" stroke="#127965" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1080" y="237" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">输出空间 ℝ³</text><text x="1080" y="292" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">每个 t 都到达同一个 q</text><path d="M 1025 345 H 1010 V 564 H 1025" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1135 345 H 1150 V 564 H 1135" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1080" y="399" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="500" text-anchor="middle">1</text><text x="1080" y="464" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="500" text-anchor="middle">2</text><text x="1080" y="529" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="500" text-anchor="middle">3</text><text x="1080" y="638" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">输出 q 始终不变</text><text x="1080" y="685" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">与 t 的取值无关</text><line x1="65" y1="781" x2="1335" y2="781" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="65" y="822" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">零空间：a = 0，b + 2c = 0</text><text x="720" y="822" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">目标 q 的解：a = 1，b + 2c = 1</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text></svg>