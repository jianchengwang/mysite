<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">先检查是否有解，再检查是否唯一</title><desc id="desc">对实数线性方程Aθ=q，若q不在列空间则无解。若q在列空间，再检查零空间；只有零向量则唯一，含非零向量则无穷多解。例子分别为Xθ=(1,2,2)、Xθ=(1,2,3)、X′θ=(1,2,3)。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#127965" stroke-width="1.7"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  16  秩与零空间</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">先检查是否有解，再检查是否唯一</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">普通实数线性方程 Aθ = q：两个问题，不能省去第一个</text><rect x="450" y="214" width="500" height="94" rx="15" fill="#eaf3ed" stroke="#dce3dc" stroke-width="2"/><text x="700" y="274" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="middle">q 属于 col(A) 吗？</text><path d="M 500 308 V 355 H 260 V 557" fill="none" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="325" y="343" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">否</text><path d="M 830 308 V 375" fill="none" stroke="#127965" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="850" y="350" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="start">是：已经确认有解</text><rect x="640" y="392" width="535" height="100" rx="15" fill="#eaf3ed" stroke="#dce3dc" stroke-width="2"/><text x="907" y="454" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">ker(A) 只有零向量吗？</text><path d="M 790 492 V 533 H 700 V 557" fill="none" stroke="#127965" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="739" y="528" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">是</text><path d="M 1060 492 V 533 H 1140 V 557" fill="none" stroke="#127965" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1118" y="519" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">否</text><rect x="65" y="579" width="390" height="214" rx="15" fill="#faeee6" stroke="none" stroke-width="2"/><text x="260" y="628" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="middle">无解</text><rect x="505" y="579" width="390" height="214" rx="15" fill="#eaf3ed" stroke="none" stroke-width="2"/><text x="700" y="628" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="middle">唯一解</text><rect x="945" y="579" width="390" height="214" rx="15" fill="#eaf1f6" stroke="none" stroke-width="2"/><text x="1140" y="628" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="middle">无穷多解</text><text x="91" y="681" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">Xθ = (1,2,2)</text><text x="91" y="731" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">目标不在可达平面上</text><text x="531" y="681" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">Xθ = (1,2,3)</text><text x="531" y="731" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">唯一参数：(1,1)</text><text x="971" y="681" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">X′θ = (1,2,3)</text><text x="971" y="731" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">参数：(1,1−2t,t)</text><text x="700" y="839" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">“列独立”保证至多一个解；存在性还要看目标</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text></svg>