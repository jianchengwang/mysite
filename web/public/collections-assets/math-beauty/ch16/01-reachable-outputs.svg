<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">两个参数，不会填满三维输出空间</title><desc id="desc">X把二维参数(a,b)映为三维输出(b,a+b,2a+b)。所有输出满足q₁−2q₂+q₃=0。可达输出(1,2,3)满足该关系，观测(1,2,2)不满足。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#127965" stroke-width="1.7"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  16  秩与零空间</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">两个参数，不会填满三维输出空间</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">列空间 col(X)：让参数遍历实数，所有能够产生的输出</text><text x="215" y="247" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">参数空间 ℝ²</text><text x="215" y="294" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">两项：a、b</text><path d="M 160 343 H 145 V 523 H 160" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 270 343 H 285 V 523 H 270" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="408" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="600" text-anchor="middle">a</text><text x="215" y="486" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="600" text-anchor="middle">b</text><text x="340" y="440" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="500" text-anchor="start">→</text><text x="590" y="247" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">3 × 2 矩阵 X</text><text x="553" y="304" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle">x</text><text x="640" y="304" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle">u</text><path d="M 505 326 H 490 V 538 H 505" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 680 326 H 695 V 538 H 680" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="553" y="376" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">0</text><text x="640" y="376" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="553" y="441" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="640" y="441" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="553" y="506" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">2</text><text x="640" y="506" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="755" y="440" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="500" text-anchor="start">→</text><text x="1080" y="247" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">输出空间 ℝ³</text><text x="1080" y="294" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">三项：q₁、q₂、q₃</text><path d="M 940 326 H 925 V 538 H 940" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1220 326 H 1235 V 538 H 1220" fill="none" stroke="#233a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1080" y="376" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="middle">b</text><text x="1080" y="441" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="middle">a + b</text><text x="1080" y="506" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="middle">2a + b</text><line x1="70" y1="580" x2="1330" y2="580" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="700" y="632" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">列空间的精确限制：q₁ − 2q₂ + q₃ = 0</text><rect x="65" y="670" width="620" height="132" rx="15" fill="#eaf3ed" stroke="none" stroke-width="2"/><rect x="715" y="670" width="620" height="132" rx="15" fill="#faeee6" stroke="none" stroke-width="2"/><text x="95" y="714" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">可达输出  q = (1,2,3)</text><text x="95" y="766" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start">1 − 2×2 + 3 = 0</text><text x="745" y="714" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">原观测  y = (1,2,2)</text><text x="745" y="766" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start">1 − 2×2 + 2 = −1 ≠ 0</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构玩具读数</text></svg>