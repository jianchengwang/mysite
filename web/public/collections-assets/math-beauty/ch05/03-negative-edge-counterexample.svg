<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">负边让确认步骤失去保证</title><desc id="desc">三个节点的有向图：S到A代价1，S到B代价2，B到A代价负3。先确认A为1会出错，因为S到B到A代价负1。本图没有有向环。</desc>
<rect width="1200" height="730" fill="#FAFBFC"/>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#17659E"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AD6A12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B13F39"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536777"/></marker></defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="52" y="57" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">负边让前半程更贵的路线，最后反而更便宜</text>
<text x="52" y="99" font-size="23" fill="#536777" font-weight="400" text-anchor="start">另一个有向图：边权表示一般代价，不能解释为地铁行车时间</text>
<line x1="154" y1="338" x2="440" y2="219" stroke="#536777" stroke-width="4" marker-end="url(#arrow-muted)"/>
<line x1="154" y1="363" x2="440" y2="477" stroke="#536777" stroke-width="4" marker-end="url(#arrow-muted)"/>
<line x1="478" y1="453" x2="478" y2="247" stroke="#B13F39" stroke-width="5" marker-end="url(#arrow-red)"/>
<circle cx="121" cy="350" r="34" fill="#FAFBFC" stroke="#17659E" stroke-width="3"/>
<text x="121" y="360" font-size="30" fill="#17659E" font-weight="600" text-anchor="middle">S</text>
<circle cx="478" cy="210" r="34" fill="#FFF2D9" stroke="#AD6A12" stroke-width="3"/>
<text x="478" y="220" font-size="30" fill="#AD6A12" font-weight="600" text-anchor="middle">A</text>
<circle cx="478" cy="488" r="34" fill="#FAFBFC" stroke="#17659E" stroke-width="3"/>
<text x="478" y="498" font-size="30" fill="#17659E" font-weight="600" text-anchor="middle">B</text>
<text x="271" y="253" font-size="29" fill="#536777" font-weight="600" text-anchor="middle">1</text>
<text x="270" y="450" font-size="29" fill="#536777" font-weight="600" text-anchor="middle">2</text>
<rect x="495" y="321" width="77" height="54" rx="8" fill="#FBEDEC" stroke="none" stroke-width="2"/>
<text x="533" y="359" font-size="31" fill="#B13F39" font-weight="600" text-anchor="middle">−3</text>
<text x="660" y="190" font-size="25" fill="#18334A" font-weight="600" text-anchor="start">确认S后</text>
<text x="660" y="238" font-size="28" fill="#18334A" font-weight="400" text-anchor="start">d(A)＝1，d(B)＝2</text>
<line x1="687" y1="259" x2="687" y2="300" stroke="#AD6A12" stroke-width="3" marker-end="url(#arrow-gold)"/>
<text x="660" y="345" font-size="27" fill="#AD6A12" font-weight="600" text-anchor="start">按最小值，先把A确认成1</text>
<line x1="687" y1="365" x2="687" y2="407" stroke="#B13F39" stroke-width="3" marker-end="url(#arrow-red)"/>
<text x="660" y="450" font-size="25" fill="#18334A" font-weight="400" text-anchor="start">但S→B→A的总代价</text>
<text x="660" y="501" font-size="32" fill="#B13F39" font-weight="600" text-anchor="start">2＋(−3)＝−1 ＜ 1</text>
<line x1="53" y1="556" x2="1147" y2="556" stroke="#D5DEE5" stroke-width="2"/>
<text x="69" y="606" font-size="25" fill="#18334A" font-weight="600" text-anchor="start">证明断在这里：</text>
<text x="315" y="606" font-size="27" fill="#B13F39" font-weight="600" text-anchor="start">走到B花2，走完全程只花−1</text>
<text x="69" y="655" font-size="24" fill="#536777" font-weight="400" text-anchor="start">本图没有有向环。负边已足以破坏“确认后不再修改”的保证。</text>
<text x="69" y="695" font-size="24" fill="#536777" font-weight="400" text-anchor="start">最短路径仍然存在，代价是−1。</text>
</g>
</svg>