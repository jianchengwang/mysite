<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">限制到 B，再把总概率调回 1</title><desc id="desc">原模型a、b、c、d的概率为0.1、0.2、0.3、0.4。已知结果属于B即b或c，只保留0.2和0.3，总和0.5。每项除以0.5后，b的条件概率是0.4，c的是0.6。</desc><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf7" stroke="none" stroke-width="0"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  19  有限概率模型</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">限制到 B，再把总概率调回 1</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">B = {b, c}，P(B) = 0.5；A = {a, b}，A∩B = {b}</text><text x="55" y="294" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">原分配</text><text x="1240" y="294" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">总和 1</text><rect x="210" y="235" width="100.0" height="86" rx="0" fill="#e5e8e3" stroke="#fffdf7" stroke-width="3"/><text x="260.0" y="271" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">a</text><text x="260.0" y="305" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">0.1</text><rect x="310.0" y="235" width="200.0" height="86" rx="0" fill="#dcd0e8" stroke="#fffdf7" stroke-width="3"/><text x="410.0" y="271" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">b</text><text x="410.0" y="305" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">0.2</text><rect x="510.0" y="235" width="300.0" height="86" rx="0" fill="#ccdfef" stroke="#fffdf7" stroke-width="3"/><text x="660.0" y="271" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">c</text><text x="660.0" y="305" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">0.3</text><rect x="810.0" y="235" width="400.0" height="86" rx="0" fill="#e5e8e3" stroke="#fffdf7" stroke-width="3"/><text x="1010.0" y="271" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">d</text><text x="1010.0" y="305" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">0.4</text><text x="55" y="442" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">只保留 B</text><rect x="210" y="381" width="100" height="86" rx="0" fill="none" stroke="#dce3dc" stroke-width="2"/><rect x="810" y="381" width="400" height="86" rx="0" fill="none" stroke="#dce3dc" stroke-width="2"/><text x="260" y="434" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">排除</text><text x="1010" y="434" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">排除</text><rect x="310" y="381" width="200" height="86" rx="0" fill="#dcd0e8" stroke="#fffdf7" stroke-width="3"/><rect x="510" y="381" width="300" height="86" rx="0" fill="#ccdfef" stroke="#fffdf7" stroke-width="3"/><text x="410" y="415" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">b</text><text x="410" y="450" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">0.2</text><text x="660" y="415" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">c</text><text x="660" y="450" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">0.3</text><text x="1240" y="438" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">总和 0.5</text><text x="530" y="526" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">每项 ÷ P(B)，即每项 ÷ 0.5</text><text x="55" y="620" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">归一化后</text><rect x="210" y="562" width="400" height="92" rx="0" fill="#dcd0e8" stroke="#fffdf7" stroke-width="3"/><rect x="610" y="562" width="600" height="92" rx="0" fill="#ccdfef" stroke="#fffdf7" stroke-width="3"/><text x="410" y="599" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">b</text><text x="410" y="637" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">0.2/0.5 = 0.4</text><text x="910" y="599" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">c</text><text x="910" y="637" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">0.3/0.5 = 0.6</text><text x="1240" y="620" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">总和 1</text><line x1="55" y1="711" x2="1345" y2="711" stroke="#dce3dc" stroke-width="2"/><text x="55" y="764" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="start">P(A|B) = P(A∩B)/P(B) = 0.2/0.5 = 0.4</text><text x="55" y="821" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">原有比例 2∶3 保持不变，总和从 0.5 调回 1。</text><text x="55" y="867" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">所有条形共用同一概率尺度；必须有 P(B) &gt; 0 才能这样计算。</text></svg>