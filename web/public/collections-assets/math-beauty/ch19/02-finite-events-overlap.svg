<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">事件可以重叠，概率不必均匀</title><desc id="desc">有限样本空间由a、b、c、d四个结果组成，概率分别为0.1、0.2、0.3、0.4。事件A含a和b，事件B含b和c。交集只有b，并集含a、b、c。</desc><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf7" stroke="none" stroke-width="0"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  19  有限概率模型</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">事件可以重叠，概率不必均匀</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">圆点是结果，轮廓是事件；旁边标出的数才是概率</text><rect x="55" y="225" width="855" height="445" rx="14" fill="none" stroke="#dce3dc" stroke-width="2"/><text x="80" y="270" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="start">Ω</text><ellipse cx="370" cy="435" rx="205" ry="157" fill="#e7f2eb" stroke="#127965" stroke-width="3"/><ellipse cx="605" cy="435" rx="205" ry="157" fill="#eaf0f6" fill-opacity="0.72" stroke="#2a6694" stroke-width="3"/><text x="245" y="330" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">A = {a, b}</text><text x="625" y="330" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">B = {b, c}</text><circle cx="280" cy="430" r="10" fill="#127965" stroke="none" stroke-width="0"/><text x="280" y="406" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="middle">a</text><text x="304" y="441" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">p = 0.1</text><circle cx="485" cy="430" r="10" fill="#795899" stroke="none" stroke-width="0"/><text x="485" y="406" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="middle">b</text><text x="509" y="441" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">p = 0.2</text><circle cx="700" cy="430" r="10" fill="#2a6694" stroke="none" stroke-width="0"/><text x="700" y="406" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="middle">c</text><text x="724" y="441" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">p = 0.3</text><circle cx="165" cy="610" r="10" fill="#6f7e79" stroke="none" stroke-width="0"/><text x="165" y="586" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="middle">d</text><text x="189" y="621" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">p = 0.4</text><text x="960" y="294" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">A∩B = {b}</text><text x="960" y="352" fill="#795899" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">P(A∩B) = 0.2</text><text x="960" y="427" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">P(A) = 0.1 + 0.2</text><text x="960" y="468" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">= 0.3</text><text x="960" y="537" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">P(B) = 0.2 + 0.3</text><text x="960" y="578" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">= 0.5</text><line x1="55" y1="711" x2="1345" y2="711" stroke="#dce3dc" stroke-width="2"/><text x="55" y="764" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="start">P(A∪B) = 0.3 + 0.5 − 0.2 = 0.6</text><text x="55" y="821" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">相加时，b 的概率出现两次；减去交集，让它只保留一次。</text><text x="55" y="868" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">A 和 B 各含两个结果，概率却不同。轮廓面积不表示概率。</text></svg>