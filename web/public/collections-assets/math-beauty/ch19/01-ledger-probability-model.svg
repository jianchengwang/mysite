<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">每行等可能，事件概率按行相加</title><desc id="desc">均匀抽取固定台账的10000行之一，每行概率为1/10000。四个不重叠事件的行数分别是故障且告警99、故障且未告警1、健康且告警99、健康且未告警9801。</desc><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf7" stroke="none" stroke-width="0"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  19  有限概率模型</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">每行等可能，事件概率按行相加</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">Ω 是全部行号；D 是故障行号集合，E 是告警行号集合</text><text x="60" y="240" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">随机实验</text><text x="60" y="290" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">在固定台账中</text><text x="60" y="334" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">均匀抽取一行</text><text x="60" y="402" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">Ω = {1, 2, …, 10000}</text><rect x="61" y="450" width="78" height="76" rx="8" fill="#eef3eb" stroke="#dce3dc" stroke-width="2"/><text x="100" y="499" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">1</text><rect x="166" y="450" width="78" height="76" rx="8" fill="#eef3eb" stroke="#dce3dc" stroke-width="2"/><text x="205" y="499" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">2</text><rect x="271" y="450" width="78" height="76" rx="8" fill="#eef3eb" stroke="#dce3dc" stroke-width="2"/><text x="310" y="499" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">…</text><text x="60" y="582" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">每个行号的概率</text><text x="60" y="637" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="start">p(ω) = 1/10000</text><line x1="455" y1="230" x2="455" y2="680" stroke="#dce3dc" stroke-width="2"/><text x="760" y="255" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">告警 E</text><text x="1135" y="255" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">未告警 Eᶜ</text><rect x="585" y="288" width="365" height="170" rx="10" fill="#edf3ec" stroke="#dce3dc" stroke-width="2"/><rect x="970" y="288" width="365" height="170" rx="10" fill="#fcf0e6" stroke="#dce3dc" stroke-width="2"/><rect x="585" y="478" width="365" height="170" rx="10" fill="#edf2f6" stroke="#dce3dc" stroke-width="2"/><rect x="970" y="478" width="365" height="170" rx="10" fill="#f0f1ec" stroke="#dce3dc" stroke-width="2"/><text x="480" y="370" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">D</text><text x="480" y="560" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">Dᶜ</text><text x="767" y="325" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">故障且告警</text><text x="767" y="377" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="600" text-anchor="middle">99 行</text><text x="767" y="426" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">99/10000</text><text x="1152" y="325" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">故障且未告警</text><text x="1152" y="377" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="600" text-anchor="middle">1 行</text><text x="1152" y="426" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">1/10000</text><text x="767" y="515" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">健康且告警</text><text x="767" y="567" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="600" text-anchor="middle">99 行</text><text x="767" y="616" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">99/10000</text><text x="1152" y="515" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">健康且未告警</text><text x="1152" y="567" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="600" text-anchor="middle">9801 行</text><text x="1152" y="616" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="middle">9801/10000</text><line x1="55" y1="711" x2="1345" y2="711" stroke="#dce3dc" stroke-width="2"/><text x="55" y="763" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">P(D) = 100/10000</text><text x="480" y="763" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">P(E) = 198/10000</text><text x="920" y="763" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">P(D∩E) = 99/10000</text><text x="55" y="828" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">四组覆盖 Ω，且互不重叠；格子面积不表示概率。</text><text x="55" y="867" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">教学虚构台账；此处只描述均匀抽取，不把历史比例直接当作未来分布。</text></svg>