<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">箭头可以平移，加法可以接着走</title><desc id="desc">左图从(0,0)到(2,1)、从(1,1)到(3,2)表示同一位移(2,1)。右图把(2,1)与(-1,2)首尾相接，得到(1,3)。坐标轴向右、向上，每格1厘米。</desc>
