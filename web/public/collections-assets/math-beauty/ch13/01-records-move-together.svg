<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">同样增加1/6，三个预测一起改变</title><desc id="desc">从候选B的预测(1,3/2,2)逐项加1/6得到C的预测(7/6,5/3,13/6)。观测不变，残差从(0,1/2,0)逐项减1/6变为(-1/6,1/3,-1/6)。</desc>
<rect width="1400" height="900" fill="#fffdf7"/>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#233a3b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#127965"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6694"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc5d25"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7e79"/></marker></defs>
<text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  13  向量</text>
<text x="55" y="114" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">同样增加 1/6，三个预测一起改变</text>
<text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">次序始终对应滑杆位置 0、1、2；本图预测与残差都以厘米计</text>
<text x="510" y="238" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">第 1 条记录</text>
<text x="510" y="277" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">x = 0 厘米</text>
<line x1="375" y1="300" x2="645" y2="300" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/>
<text x="825" y="238" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">第 2 条记录</text>
<text x="825" y="277" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">x = 1 厘米</text>
<line x1="690" y1="300" x2="960" y2="300" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/>
<text x="1140" y="238" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">第 3 条记录</text>
<text x="1140" y="277" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">x = 2 厘米</text>
<line x1="1005" y1="300" x2="1275" y2="300" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/>
<text x="90" y="353" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start">观测 y</text>
<text x="510" y="353" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">1</text>
<text x="825" y="353" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">2</text>
<text x="1140" y="353" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">2</text>
<text x="90" y="431" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start">B 的预测</text>
<text x="510" y="431" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">1</text>
<text x="825" y="431" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">3/2</text>
<text x="1140" y="431" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">2</text>
<text x="90" y="593" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start">C 的预测</text>
<text x="510" y="593" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">7/6</text>
<text x="825" y="593" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">5/3</text>
<text x="1140" y="593" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">13/6</text>
<text x="90" y="681" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start">B 的残差</text>
<text x="510" y="681" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">0</text>
<text x="825" y="681" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">1/2</text>
<text x="1140" y="681" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">0</text>
<text x="90" y="752" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start">C 的残差</text>
<text x="510" y="752" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">−1/6</text>
<text x="825" y="752" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">1/3</text>
<text x="1140" y="752" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">−1/6</text>
<line x1="510" y1="459" x2="510" y2="538" stroke="#bc5d25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<text x="539" y="511" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">+ 1/6</text>
<line x1="825" y1="459" x2="825" y2="538" stroke="#bc5d25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<text x="854" y="511" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">+ 1/6</text>
<line x1="1140" y1="459" x2="1140" y2="538" stroke="#bc5d25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<text x="1169" y="511" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">+ 1/6</text>
<line x1="75" y1="628" x2="1315" y2="628" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/>
<line x1="350" y1="217" x2="350" y2="773" stroke="#dce3dc" stroke-width="1" stroke-linecap="round"/>
<line x1="668" y1="217" x2="668" y2="773" stroke="#dce3dc" stroke-width="1" stroke-linecap="round"/>
<line x1="983" y1="217" x2="983" y2="773" stroke="#dce3dc" stroke-width="1" stroke-linecap="round"/>
<text x="700" y="825" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">预测逐项加 1/6，残差就逐项减 1/6</text>
<text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  虚构玩具读数</text>
</svg>