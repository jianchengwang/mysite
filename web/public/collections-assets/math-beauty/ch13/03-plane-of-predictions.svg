<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">两个调整方向，张成一片预测平面</title><desc id="desc">左图用三个预测坐标示意向量x=(0,1,2)、u=(1,1,1)张成过原点平面。右侧证明可表达的向量p=(p1,p2,p3)满足p2=(p1+p3)/2，而观测(1,2,2)不满足。三维图不按屏幕角度或距离判定。</desc>
<rect width="1400" height="900" fill="#fffdf7" />
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#233a3b" /></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#127965" /></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6694" /></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc5d25" /></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7e79" /></marker></defs>
<text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  13  向量</text>
<text x="55" y="114" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">两个调整方向，张成一片预测平面</text>
<text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">一个空间点代表三条记录的整组预测，不再代表单条观测</text>
<line x1="740" y1="213" x2="740" y2="760" stroke="#dce3dc" stroke-width="2" stroke-linecap="round" />
<polygon points="339.5,708.5 533.0,558.0 425.0,294.75 231.5,445.25" fill="#e4efe6" stroke="#87aa91" stroke-width="2" />
<line x1="323.5" y1="669.5" x2="517.0" y2="519.0" stroke="#bed1bf" stroke-width="1" stroke-linecap="round" />
<line x1="283.5" y1="572.0" x2="477.0" y2="421.5" stroke="#bed1bf" stroke-width="1" stroke-linecap="round" />
<line x1="243.5" y1="474.5" x2="437.0" y2="324.0" stroke="#bed1bf" stroke-width="1" stroke-linecap="round" />
<line x1="371.0" y1="684.0" x2="263.0" y2="420.75" stroke="#bed1bf" stroke-width="1" stroke-linecap="round" />
<line x1="438.5" y1="631.5" x2="330.5" y2="368.25" stroke="#bed1bf" stroke-width="1" stroke-linecap="round" />
<line x1="506.0" y1="579.0" x2="398.0" y2="315.75" stroke="#bed1bf" stroke-width="1" stroke-linecap="round" />
<line x1="355" y1="645" x2="635.0" y2="771.0" stroke="#6f7e79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)" />
<text x="648.0" y="781.0" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">p₁</text>
<line x1="355" y1="645" x2="547.0" y2="533.0" stroke="#6f7e79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)" />
<text x="562.0" y="543.0" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">p₂</text>
<line x1="355" y1="645" x2="89.0" y2="341.0" stroke="#6f7e79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)" />
<text x="75.0" y="331.0" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">p₃</text>
<line x1="355" y1="645" x2="275" y2="450" stroke="#2a6694" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)" />
<line x1="355" y1="645" x2="445" y2="575" stroke="#127965" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-green)" />
<circle cx="355" cy="645" r="7" fill="#233a3b" />
<text x="323" y="677" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">0</text>
<text x="151" y="431" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">x = (0,1,2)</text>
<text x="482" y="595" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">u = (1,1,1)</text>
<text x="354" y="247" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">所有 a x + b u</text>
<text x="354" y="288" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">a、b 可取任意实数</text>
<text x="60" y="747" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">这里只画出平面的一部分；平面无限延伸</text>
<text x="808" y="250" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">可表达的预测</text>
<text x="808" y="310" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start">p = (b, a+b, 2a+b)</text>
<text x="808" y="375" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="start">中项 = 两端平均</text>
<text x="808" y="427" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="500" text-anchor="start">p₂ = (p₁ + p₃) / 2</text>
<line x1="809" y1="467" x2="1325" y2="467" stroke="#dce3dc" stroke-width="2" stroke-linecap="round" />
<text x="808" y="525" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">观测 y = (1,2,2)</text>
<text x="808" y="584" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start">中项：2</text>
<text x="808" y="635" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="start">两端平均：(1+2)/2 = 3/2</text>
<text x="808" y="703" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">2 ≠ 3/2，因此 y 不在平面内</text>
<text x="700" y="818" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">三维投影示意：不按屏幕上的角度、长度判断空间关系</text>
<text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  虚构玩具读数</text>
</svg>