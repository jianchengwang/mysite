<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">同一条边的两种存法</title><desc id="desc">左边是按P G F S顺序排列的四乘四邻接矩阵，四个1位于P G、P F、G F、F S。右边是P指向G和F、G指向F、F指向S、S空的邻接表。两侧突出同一条P到F的边。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#087F83"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#CD6A22"/></marker></defs><rect width="1200" height="670" fill="#F7F9FB"/><g font-family="Noto Sans CJK SC, sans-serif">
