<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc"><title id="title">一份关系，两种画法</title><desc id="desc">关系为P到G、P到F、G到F、F到S。两种布局保留全部四个节点和四条有向边。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#087F83"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#CD6A22"/></marker></defs><rect width="1320" height="620" fill="#F7F9FB"/><g font-family="Noto Sans CJK SC, sans-serif">
<text x="48" y="57" font-size="31" fill="#192C3C" font-weight="700" text-anchor="start">一份关系，两种画法</text>
<text x="48" y="97" font-size="21" fill="#526779" font-weight="400" text-anchor="start">P 页面 · G 推荐 · F 特征 · S 存储      箭头约定：使用者 → 被使用者</text>
<rect x="48" y="133" width="290" height="386" rx="18" fill="white" stroke="#D9E2E8"/>
<rect x="370" y="133" width="420" height="386" rx="18" fill="white" stroke="#D9E2E8"/>
<rect x="822" y="133" width="450" height="386" rx="18" fill="white" stroke="#D9E2E8"/>
<text x="75" y="184" font-size="24" fill="#192C3C" font-weight="600" text-anchor="start">有序对集合</text>
<text x="193" y="255" font-size="28" fill="#087F83" font-weight="500" text-anchor="middle">(P, G)</text>
<text x="193" y="318" font-size="28" fill="#087F83" font-weight="500" text-anchor="middle">(P, F)</text>
<text x="193" y="381" font-size="28" fill="#087F83" font-weight="500" text-anchor="middle">(G, F)</text>
<text x="193" y="444" font-size="28" fill="#087F83" font-weight="500" text-anchor="middle">(F, S)</text>
<text x="397" y="184" font-size="24" fill="#192C3C" font-weight="600" text-anchor="start">画法一</text>
<path d="M462.0,264.0 L635.0,264.0" stroke="#087F83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
