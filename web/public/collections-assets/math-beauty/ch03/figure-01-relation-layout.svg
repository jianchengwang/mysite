<text x="728" y="412" font-size="24" fill="#087F83" font-weight="600" text-anchor="middle">S</text>
<text x="849" y="184" font-size="24" fill="#192C3C" font-weight="600" text-anchor="start">画法二</text>
<path d="M935.0,264.0 L1153.0,264.0" stroke="#087F83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
