<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">扫描边界向右移动</title><desc id="desc">列表为12、7、19、15、9。第一行已读前两项，最大值12。将下一项19加入，第二行已读前三项，最大值19。</desc>
<rect width="1200" height="660" fill="#FAFBFC"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#17659E"/></marker><marker id="gold-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AD6A12"/></marker></defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="52" y="57" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">扫描边界向右移动</text>
<text x="52" y="98" font-size="23" fill="#536777" font-weight="400" text-anchor="start">M 的含义始终是：已经看过的前 i 项中的最大值</text>
<text x="70" y="151" font-size="23" fill="#17659E" font-weight="600" text-anchor="start">检查点  i = 2</text>
<rect x="70" y="171" width="140" height="83" rx="12" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="140" y="225" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">12</text>
<text x="140" y="287" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第1项</text>
<rect x="235" y="171" width="140" height="83" rx="12" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="305" y="225" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">7</text>
<text x="305" y="287" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第2项</text>
<rect x="400" y="171" width="140" height="83" rx="12" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/>
<text x="470" y="225" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">19</text>
<text x="470" y="287" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第3项</text>
<rect x="565" y="171" width="140" height="83" rx="12" fill="#EDF0F3" stroke="none" stroke-width="2"/>
<text x="635" y="225" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">15</text>
<text x="635" y="287" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第4项</text>
<rect x="730" y="171" width="140" height="83" rx="12" fill="#EDF0F3" stroke="none" stroke-width="2"/>
<text x="800" y="225" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">9</text>
<text x="800" y="287" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第5项</text>
<line x1="387.5" y1="166" x2="387.5" y2="262" stroke="#17659E" stroke-width="3"/>
<rect x="942" y="171" width="193" height="83" rx="12" fill="#E4F0F8" stroke="none" stroke-width="2"/>
<text x="1038" y="225" font-size="30" fill="#17659E" font-weight="700" text-anchor="middle">M = 12</text>
<text x="1038" y="287" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">还剩 3 项</text>
<text x="70" y="407" font-size="23" fill="#17659E" font-weight="600" text-anchor="start">检查点  i = 3</text>
<rect x="70" y="427" width="140" height="83" rx="12" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="140" y="481" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">12</text>
<text x="140" y="543" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第1项</text>
<rect x="235" y="427" width="140" height="83" rx="12" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="305" y="481" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">7</text>
<text x="305" y="543" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第2项</text>
<rect x="400" y="427" width="140" height="83" rx="12" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="470" y="481" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">19</text>
<text x="470" y="543" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第3项</text>
<rect x="565" y="427" width="140" height="83" rx="12" fill="#EDF0F3" stroke="none" stroke-width="2"/>
<text x="635" y="481" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">15</text>
<text x="635" y="543" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第4项</text>
<rect x="730" y="427" width="140" height="83" rx="12" fill="#EDF0F3" stroke="none" stroke-width="2"/>
<text x="800" y="481" font-size="34" fill="#18334A" font-weight="600" text-anchor="middle">9</text>
<text x="800" y="543" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">第5项</text>
<line x1="552.5" y1="422" x2="552.5" y2="518" stroke="#17659E" stroke-width="3"/>
<rect x="942" y="427" width="193" height="83" rx="12" fill="#E4F0F8" stroke="none" stroke-width="2"/>
<text x="1038" y="481" font-size="30" fill="#17659E" font-weight="700" text-anchor="middle">M = 19</text>
<text x="1038" y="543" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">还剩 2 项</text>
<line x1="470" y1="306" x2="470" y2="377" stroke="#17659E" stroke-width="3" marker-end="url(#arrow)"/>
<text x="520" y="340" font-size="25" fill="#18334A" font-weight="600" text-anchor="start">读到 19：19 &gt; 12</text>
<text x="520" y="373" font-size="23" fill="#536777" font-weight="400" text-anchor="start">更新 M，再让 i 加 1</text>
<rect x="70" y="603" width="21" height="21" rx="3" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="105" y="623" font-size="20" fill="#536777" font-weight="400" text-anchor="start">已处理</text>
<rect x="273" y="603" width="21" height="21" rx="3" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/>
<text x="308" y="623" font-size="20" fill="#536777" font-weight="400" text-anchor="start">下一项</text>
<rect x="476" y="603" width="21" height="21" rx="3" fill="#EDF0F3" stroke="none" stroke-width="2"/>
<text x="511" y="623" font-size="20" fill="#536777" font-weight="400" text-anchor="start">待处理</text>
</g>
</svg>