<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">先列码表，再比较完整长度</title><desc id="desc">四符号A、B、C、D固定码分别00、01、10、11，可变前缀码分别0、10、110、111。消息AAAABBCD正文固定码16位，可变码14位。两种完整文件还可能包含不同的附加数据，图中附加区域宽度仅作示意。</desc><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  24  无损压缩与编码</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">先列码表，再比较完整长度</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">消息 AAAABBCD：正文省了 2 位，总文件还需完整结账</text><rect x="65" y="212" width="1270" height="274" rx="0" fill="#fffdf7" stroke="#dce3dc" stroke-width="2"/><rect x="65" y="212" width="1270" height="55" rx="0" fill="#edf4ef" stroke="#dce3dc" stroke-width="2"/><line x1="280" y1="212" x2="280" y2="486" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="212" x2="530" y2="486" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="860" y1="212" x2="860" y2="486" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="1150" y1="212" x2="1150" y2="486" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="65" y1="267" x2="1335" y2="267" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="65" y1="322" x2="1335" y2="322" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="65" y1="377" x2="1335" y2="377" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="65" y1="432" x2="1335" y2="432" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="90" y="249" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">符号</text><text x="335" y="249" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">预设比例</text><text x="630" y="249" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">固定码</text><text x="950" y="249" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">前缀码</text><text x="1240" y="249" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">码长</text><text x="90" y="304" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">A</text><text x="335" y="304" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">1/2</text><text x="630" y="304" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">00</text><text x="950" y="304" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">0</text><text x="1240" y="304" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">1 位</text><text x="90" y="359" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">B</text><text x="335" y="359" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">1/4</text><text x="630" y="359" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">01</text><text x="950" y="359" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">10</text><text x="1240" y="359" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start">2 位</text><text x="90" y="414" fill="#233a3b"