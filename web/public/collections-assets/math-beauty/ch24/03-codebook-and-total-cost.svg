 fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="start">0｜0｜0｜0｜10｜10｜110｜111</text><text x="1260" y="610" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="end">14 位</text><line x1="65" y1="641" x2="1335" y2="641" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="65" y="689" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">完整表示</text><rect x="275" y="658" width="610" height="64" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="580" y="701" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">正文</text><rect x="885" y="658" width="430" height="64" rx="12" fill="#fff0e4" stroke="#bc5d25" stroke-width="2"/><text x="1100" y="701" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">必要的附加数据</text><text x="275" y="767" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">码表说明 / 消息边界 / 填充等：是否需要，取决于具体约定</text><text x="700" y="823" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">16 与 14 只比较正文；附加部分宽度为示意</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构教学模型</text></svg>