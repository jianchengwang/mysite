<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">读到叶子，就译出一个符号</title><desc id="desc">根向左读0到A，向右读1继续；10到B，110到C，111到D。每个符号对应叶子，叶子后不继续延伸其他代码字。解出一个符号后返回根，从下一个比特继续。</desc><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  24  无损压缩与编码</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">读到叶子，就译出一个符号</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">前缀码 A → 0，B → 10，C → 110，D → 111</text><line x1="590" y1="264" x2="265" y2="414" stroke="#127965" stroke-width="4" stroke-linecap="round"/><text x="427.5" y="324.0" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">0</text><line x1="590" y1="264" x2="870" y2="414" stroke="#2a6694" stroke-width="4" stroke-linecap="round"/><text x="730.0" y="324.0" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">1</text><line x1="870" y1="414" x2="665" y2="558" stroke="#127965" stroke-width="4" stroke-linecap="round"/><text x="767.5" y="471.0" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">0</text><line x1="870" y1="414" x2="1050" y2="558" stroke="#2a6694" stroke-width="4" stroke-linecap="round"/><text x="960.0" y="471.0" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">1</text><line x1="1050" y1="558" x2="915" y2="704" stroke="#127965" stroke-width="4" stroke-linecap="round"/><text x="982.5" y="616.0" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">0</text><line x1="1050" y1="558" x2="1230" y2="704" stroke="#2a6694" stroke-width="4" stroke-linecap="round"/><text x="1140.0" y="616.0" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">1</text><circle cx="590" cy="264" r="13" fill="#fffdf7" stroke="#233a3b" stroke-width="3"/><circle cx="870" cy="414" r="13" fill="#fffdf7" stroke="#233a3b" stroke-width="3"/><circle cx="1050" cy="558" r="13" fill="#fffdf7" stroke="#233a3b" stroke-width="3"/><text x="590" y="235" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">根</text><circle cx="265" cy="414" r="40" fill="#edf4ef" stroke="#127965" stroke-width="3"/><text x="265" y="426" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="700" text-anchor="middle">A</text><text x="265" y="493" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">0</text><circle cx="665" cy="558" r="40" fill="#edf4ef" stroke="#127965" stroke-width="3"/><text x="665" y="570" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="700" text-anchor="middle">B</text><text x="665" y="637" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">10</text><circle cx="915" cy="704" r="40" fill="#edf4ef" stroke="#127965" stroke-width="3"/><text x="915" y="716" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="700" text-anchor="middle">C</text><text x="915" y="783" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">110</text><circle cx="1230" cy="704" r="40" fill="#edf4ef" stroke="#127965" stroke-width="3"/><text x="1230" y="716" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="700" text-anchor="middle">D</text><text x="1230" y="783" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">111</text><text x="76" y="600" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="start">走到叶子</text><text x="76" y="645" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">→ 输出对应符号</text><text x="76" y="690" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">→ 回到根继续读</text><text x="700" y="825" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">例如：111｜0｜10  →  D A B；分隔线仅供阅读</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构教学模型</text></svg>