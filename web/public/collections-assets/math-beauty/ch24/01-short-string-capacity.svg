<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">所有输入，都有更短的位置吗</title><desc id="desc">八种三位输入分别为000至111。更短的输出包含一个空串、两个一位串、四个两位串，共七种。无损要求输入对应不同的输出，八种输入无法全放进七个位置。</desc><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  24  无损压缩与编码</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">所有输入，都有更短的位置吗</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">固定 n = 3：无损要求不同输入，拥有不同的完整输出</text><text x="315" y="252" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">长度恰好 3 位</text><text x="1010" y="252" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">长度少于 3 位</text><rect x="70" y="338" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="124" y="388" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">000</text><rect x="196" y="338" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="250" y="388" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">001</text><rect x="322" y="338" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="376" y="388" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">010</text><rect x="448" y="338" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="502" y="388" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">011</text><rect x="70" y="450" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="124" y="500" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">100</text><rect x="196" y="450" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="250" y="500" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">101</text><rect x="322" y="450" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="376" y="500" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">110</text><rect x="448" y="450" width="108" height="76" rx="12" fill="#eef4f8" stroke="#2a6694" stroke-width="2"/><text x="502" y="500" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">111</text><text x="1010" y="300" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0 位</text><rect x="955" y="319" width="110" height="65" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="1010" y="362" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">空串</text><text x="1010" y="421" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">1 位</text><rect x="875" y="440" width="110" height="65" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="930" y="483" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">0</text><rect x="1035" y="440" width="110" height="65" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="1090" y="483" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">1</text><text x="1010" y="543" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">2 位</text><rect x="760" y="562" width="110" height="65" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="815" y="605" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">00</text><rect x="895" y="562" width="110" height="65" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="950" y="605" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">01</text><rect x="1030" y="562" width="110" height="65" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="1085" y="605" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">10</text><rect x="1165" y="562" width="110" height="65" rx="12" fill="#edf4ef" stroke="#127965" stroke-width="2"/><text x="1220" y="605" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">11</text><text x="315" y="610" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="middle">2³ = 8 种</text><text x="1010" y="687" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle">1 + 2 + 4 = 7 种</text><line x1="669" y1="261" x2="669" y2="683" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="700" y="779" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle">8 &gt; 7：不能让所有三位输入都无损缩短</text><text x="700" y="827" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">空串也已计入；这张图只比较容量，不指定哪一个输入压不短</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构教学模型</text></svg>