<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120"><title>两种波动，一个平方展开</title><desc>固定一个输入x，虚构预测分布T取1,2,3的概率分别是1/4,1/2,1/4，均值2，方差1/2。真实均值f星为2.5，新读数独立取2或3各一半，噪声方差1/4。因此偏差平方1/4加方差1/2加噪声1/4得到期望平方误差1。示例不是三点实验。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#718582"/></marker></defs><rect width="1400" height="1120" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif">
<text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 34 拟合与泛化</text>
<text x="55" y="111" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">两种波动，一个平方展开</text>
<text x="55" y="165" font-size="25" fill="#718582" font-weight="400" text-anchor="start">固定输入 x；左侧换训练数据，右侧产生独立的新读数</text>
<rect x="55" y="215" width="620" height="427" fill="#e6f2ec" stroke="none" rx="12"/>
<rect x="725" y="215" width="620" height="427" fill="#edf2f7" stroke="none" rx="12"/>
<text x="82" y="261" font-size="28" fill="#0b806c" font-weight="700" text-anchor="start">训练数据 D 改变 → 预测 T 改变</text>
<text x="752" y="261" font-size="28" fill="#2b6f9f" font-weight="700" text-anchor="start">相同位置的新读数 Y = f*(x) + ε</text>
<line x1="135.0" y1="494" x2="585.0" y2="494" stroke="#213b3d" stroke-width="2"/>
<line x1="210.0" y1="489" x2="210.0" y2="501" stroke="#213b3d" stroke-width="2"/>
<text x="210.0" y="535" font-size="25" fill="#213b3d" font-weight="400" text-anchor="middle">1</text>
<line x1="360.0" y1="489" x2="360.0" y2="501" stroke="#213b3d" stroke-width="2"/>
<text x="360.0" y="535" font-size="25" fill="#213b3d" font-weight="400" text-anchor="middle">2</text>
<line x1="510.0" y1="489" x2="510.0" y2="501" stroke="#213b3d" stroke-width="2"/>
<text x="510.0" y="535" font-size="25" fill="#213b3d" font-weight="400" text-anchor="middle">3</text>
<line x1="805.0" y1="494" x2="1255.0" y2="494" stroke="#213b3d" stroke-width="2"/>
<line x1="880.0" y1="489" x2="880.0" y2="501" stroke="#213b3d" stroke-width="2"/>
<text x="880.0" y="535" font-size="25" fill="#213b3d" font-weight="400" text-anchor="middle">1</text>
<line x1="1030.0" y1="489" x2="1030.0" y2="501" stroke="#213b3d" stroke-width="2"/>
<text x="1030.0" y="535" font-size="25" fill="#213b3d" font-weight="400" text-anchor="middle">2</text>
<line x1="1180.0" y1="489" x2="1180.0" y2="501" stroke="#213b3d" stroke-width="2"/>
<text x="1180.0" y="535" font-size="25" fill="#213b3d" font-weight="400" text-anchor="middle">3</text>
<line x1="210.0" y1="405" x2="210.0" y2="489" stroke="#0b806c" stroke-width="2"/>
<circle cx="210.0" cy="405" r="11" fill="#0b806c" stroke="#fffdf6" stroke-width="2"/>
<text x="210.0" y="377" font-size="23" fill="#0b806c" font-weight="400" text-anchor="middle">P = 1/4</text>
<line x1="360.0" y1="405" x2="360.0" y2="489" stroke="#0b806c" stroke-width="2"/>
<circle cx="360.0" cy="405" r="11" fill="#0b806c" stroke="#fffdf6" stroke-width="2"/>
<text x="360.0" y="377" font-size="23" fill="#0b806c" font-weight="400" text-anchor="middle">P = 1/2</text>
<line x1="510.0" y1="405" x2="510.0" y2="489" stroke="#0b806c" stroke-width="2"/>
<circle cx="510.0" cy="405" r="11" fill="#0b806c" stroke="#fffdf6" stroke-width="2"/>
<text x="510.0" y="377" font-size="23" fill="#0b806c" font-weight="400" text-anchor="middle">P = 1/4</text>
<line x1="360.0" y1="300" x2="360.0" y2="488" stroke="#0b806c" stroke-width="2" stroke-dasharray="5 5"/>
<text x="348.0" y="327" font-size="25" fill="#0b806c" font-weight="600" text-anchor="end">m = 2</text>
<line x1="435.0" y1="300" x2="435.0" y2="488" stroke="#c35922" stroke-width="2" stroke-dasharray="5 5"/>
<text x="447.0" y="327" font-size="25" fill="#c35922" font-weight="600" text-anchor="start">f* = 2.5</text>
<line x1="1030.0" y1="405" x2="1030.0" y2="489" stroke="#2b6f9f" stroke-width="2"/>
<circle cx="1030.0" cy="405" r="11" fill="#2b6f9f" stroke="#fffdf6" stroke-width="2"/>
<text x="1030.0" y="377" font-size="23" fill="#2b6f9f" font-weight="400" text-anchor="middle">P = 1/2</text>
<line x1="1180.0" y1="405" x2="1180.0" y2="489" stroke="#2b6f9f" stroke-width="2"/>
<circle cx="1180.0" cy="405" r="11" fill="#2b6f9f" stroke="#fffdf6" stroke-width="2"/>
<text x="1180.0" y="377" font-size="23" fill="#2b6f9f" font-weight="400" text-anchor="middle">P = 1/2</text>
<line x1="1105.0" y1="300" x2="1105.0" y2="488" stroke="#c35922" stroke-width="2" stroke-dasharray="5 5"/>
<text x="1105.0" y="327" font-size="25" fill="#c35922" font-weight="600" text-anchor="middle">f* = 2.5</text>
<text x="82" y="584" font-size="25" fill="#213b3d" font-weight="400" text-anchor="start">平均预测 m = 2；真实均值 f* = 2.5</text>
<text x="82" y="622" font-size="25" fill="#0b806c" font-weight="600" text-anchor="start">偏差² = 1/4；预测方差 = 1/2</text>
<text x="752" y="584" font-size="25" fill="#213b3d" font-weight="400" text-anchor="start">ε 等概率取 −1/2 或 1/2</text>
<text x="752" y="622" font-size="25" fill="#2b6f9f" font-weight="600" text-anchor="start">E[ε] = 0；噪声方差 = 1/4</text>
<text x="55" y="690" font-size="24" fill="#718582" font-weight="400" text-anchor="start">示例横轴单位：厘米；点旁标概率，点面积不代表概率</text>
<text x="55" y="751" font-size="32" fill="#213b3d" font-weight="600" text-anchor="start">一般展开：T − Y = (T − m) + (m − f*) − ε</text>
<line x1="55" y1="783" x2="1345" y2="783" stroke="#d8e1da" stroke-width="2"/>
<rect x="55" y="814" width="400" height="160" fill="#fbede2" stroke="none" rx="12"/>
<text x="77" y="853" font-size="28" fill="#213b3d" font-weight="700" text-anchor="start">偏差平方</text>
<text x="255.0" y="907" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">(E[T] − f*)²</text>
<text x="255.0" y="954" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">平均预测离真实均值多远</text>
<rect x="500" y="814" width="400" height="160" fill="#e6f2ec" stroke="none" rx="12"/>
<text x="522" y="853" font-size="28" fill="#213b3d" font-weight="700" text-anchor="start">预测方差</text>
<text x="700.0" y="907" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">Var(T)</text>
<text x="700.0" y="954" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">换训练数据，预测怎样波动</text>
<rect x="945" y="814" width="400" height="160" fill="#edf2f7" stroke="none" rx="12"/>
<text x="967" y="853" font-size="28" fill="#213b3d" font-weight="700" text-anchor="start">噪声方差</text>
<text x="1145.0" y="907" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">σ²</text>
<text x="1145.0" y="954" font-size="23" fill="#718582" font-weight="400" text-anchor="middle">同一输入，新读数怎样波动</text>
<text x="476" y="909" font-size="33" fill="#718582" font-weight="600" text-anchor="middle">+</text>
<text x="921" y="909" font-size="33" fill="#718582" font-weight="600" text-anchor="middle">+</text>
<text x="700" y="1030" font-size="29" fill="#213b3d" font-weight="700" text-anchor="middle">合计 = E[(T − Y)²]；上例为 1/4 + 1/2 + 1/4 = 1 平方厘米</text>
<text x="55" y="1085" font-size="25" fill="#718582" font-weight="400" text-anchor="start">条件：测试噪声独立于训练过程，噪声均值为 0，所需二阶矩有限</text>
</g></svg>