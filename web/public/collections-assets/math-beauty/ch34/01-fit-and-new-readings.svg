<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><title>训练归零，新读数未必更准</title><desc>虚构教学反例。训练点为0,1；1,2；2,2，新点为0.5,1.5；1.5,2。曲线C为x/2加7/6，q为负x平方/2加3x/2加1。训练平方和C为1/6，q为0；新点平方和C为1/72，q为1/32。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#718582"/></marker></defs><rect width="1400" height="1050" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif">
