<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010"><title>别让最终证据悄悄参与选择</title><desc>数据用途时间线：先约定目标分布损失单位和来源，然后训练求参数，验证选择模型族惩罚强度等，在训练和验证之间迭代。固定全部规则后才以独立保留的测试数据评估。若看测试后改方案，该批测试已进入开发。仍需检查样本相关性和时间漂移。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#718582"/></marker></defs><rect width="1400" height="1010" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif">
<text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 34 拟合与泛化</text>
<text x="55" y="111" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">别让最终证据悄悄参与选择</text>
<text x="55" y="165" font-size="25" fill="#718582" font-weight="400" text-anchor="start">先分清数据用途，再看分数；箭头表示工作顺序</text>
<rect x="55" y="208" width="1290" height="108" fill="#f1f3ef" stroke="none" rx="12"/>
<text x="80" y="250" font-size="27" fill="#0b806c" font-weight="700" text-anchor="start">开始前约定</text>
<text x="285" y="250" font-size="28" fill="#213b3d" font-weight="600" text-anchor="start">目标使用分布 · 损失与单位 · 数据来源与划分规则</text>
<text x="285" y="292" font-size="25" fill="#718582" font-weight="400" text-anchor="start">相关记录按来源或时间处理；分开存放不等于已经相互独立</text>
<rect x="55" y="390" width="285" height="223" fill="#e6f2ec" stroke="none" rx="12"/>
<text x="77" y="432" font-size="24" fill="#0b806c" font-weight="700" text-anchor="start">01</text>
<text x="77" y="479" font-size="34" fill="#0b806c" font-weight="700" text-anchor="start">训练</text>
<text x="77" y="532" font-size="23" fill="#213b3d" font-weight="400" text-anchor="start">求每个候选的参数</text>
<text x="77" y="584" font-size="25" fill="#0b806c" font-weight="600" text-anchor="start">训练数据</text>
<rect x="390" y="390" width="285" height="223" fill="#edf2f7" stroke="none" rx="12"/>
<text x="412" y="432" font-size="24" fill="#2b6f9f" font-weight="700" text-anchor="start">02</text>
<text x="412" y="479" font-size="34" fill="#2b6f9f" font-weight="700" text-anchor="start">验证</text>
<text x="412" y="532" font-size="23" fill="#213b3d" font-weight="400" text-anchor="start">选择模型族、λ 等</text>
<text x="412" y="584" font-size="25" fill="#2b6f9f" font-weight="600" text-anchor="start">验证数据</text>
<rect x="725" y="390" width="285" height="223" fill="#f1f3ef" stroke="none" rx="12"/>
<text x="747" y="432" font-size="24" fill="#213b3d" font-weight="700" text-anchor="start">03</text>
<text x="747" y="479" font-size="34" fill="#213b3d" font-weight="700" text-anchor="start">固定方案</text>
<text x="747" y="532" font-size="23" fill="#213b3d" font-weight="400" text-anchor="start">模型与处理规则定稿</text>
<text x="747" y="584" font-size="25" fill="#213b3d" font-weight="600" text-anchor="start">冻结完整流程</text>
<rect x="1060" y="390" width="285" height="223" fill="#fbede2" stroke="none" rx="12"/>
<text x="1082" y="432" font-size="24" fill="#c35922" font-weight="700" text-anchor="start">04</text>
<text x="1082" y="479" font-size="34" fill="#c35922" font-weight="700" text-anchor="start">最终测试</text>
<text x="1082" y="532" font-size="23" fill="#213b3d" font-weight="400" text-anchor="start">估计未见数据表现</text>
<text x="1082" y="584" font-size="25" fill="#c35922" font-weight="600" text-anchor="start">独立保留数据</text>
<line x1="348" y1="497" x2="380" y2="497" stroke="#718582" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="683" y1="497" x2="715" y2="497" stroke="#718582" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1018" y1="497" x2="1050" y2="497" stroke="#718582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 623 L 532 681 L 197 681 L 197 625" fill="none" stroke="#718582" stroke-width="3" marker-end="url(#arrow)"/>
<text x="365" y="725" font-size="26" fill="#718582" font-weight="400" text-anchor="middle">开发迭代：只用训练与验证</text>
<line x1="1038" y1="350" x2="1038" y2="745" stroke="#c35922" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1150" y="365" font-size="25" fill="#c35922" font-weight="600" text-anchor="start">最后打开</text>
<text x="1124" y="681" font-size="24" fill="#718582" font-weight="400" text-anchor="start">测试均值仍有</text>
<text x="1124" y="719" font-size="24" fill="#718582" font-weight="400" text-anchor="start">抽样不确定性</text>
<rect x="55" y="780" width="1290" height="153" fill="#fbede2" stroke="none" rx="12"/>
<text x="83" y="826" font-size="31" fill="#c35922" font-weight="700" text-anchor="start">看测试后改方案 → 这批数据已经进入开发</text>
<text x="83" y="872" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">记录选择过程，为最终版本补充新的保留证据；改文件名不能恢复独立性</text>
<text x="55" y="980" font-size="25" fill="#718582" font-weight="400" text-anchor="start">用途隔离之外，还要检查重复样本、事件或设备相关性，以及时间变化和部署分布差异</text>
</g></svg>