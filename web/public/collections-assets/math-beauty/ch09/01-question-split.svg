<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">同样一个问题 最坏留下多少张</title><desc id="desc">左侧问是否是A，是时只剩A，否时还有B到H七张。右侧问是否在A到D中，是和否都剩四张。比较两个回答中的最大剩余候选数。</desc><rect width="1200" height="650" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="50" y="59" font-size="32" fill="#18334A" text-anchor="start" font-weight="700">同样一个问题，最坏留下多少张</text><text x="50" y="103" font-size="23" fill="#536777" text-anchor="start" font-weight="400">目标保证属于 A—H；比较的是较难的回答，不是平均结果</text><rect x="50" y="140" width="525" height="390" rx="14" fill="#FFFFFF" stroke="#D4DFE7" stroke-width="2"/><rect x="625" y="140" width="525" height="390" rx="14" fill="#FFFFFF" stroke="#D4DFE7" stroke-width="2"/><text x="312" y="198" font-size="29" fill="#18334A" text-anchor="middle" font-weight="700">是 A 吗？</text><line x1="312" y1="218" x2="158" y2="283" stroke="#D4DFE7" stroke-width="3"/><line x1="312" y1="218" x2="408" y2="283" stroke="#AD6A12" stroke-width="4"/><text x="203" y="248" font-size="22" fill="#17659E" text-anchor="middle" font-weight="400">是</text><text x="378" y="248" font-size="22" fill="#AD6A12" text-anchor="middle" font-weight="400">否</text><rect x="137.0" y="310" width="42" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="158" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">A</text><rect x="293.5" y="310" width="27" height="56" rx="6" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="307" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">B</text><rect x="325.5" y="310" width="27" height="56" rx="6" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="339" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">C</text><rect x="357.5" y="310" width="27" height="56" rx="6" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="371" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">D</text><rect x="389.5" y="310" width="27" height="56" rx="6" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="403" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">E</text><rect x="421.5" y="310" width="27" height="56" rx="6" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="435" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">F</text><rect x="453.5" y="310" width="27" height="56" rx="6" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="467" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">G</text><rect x="485.5" y="310" width="27" height="56" rx="6" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="499" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">H</text><text x="158" y="408" font-size="23" fill="#536777" text-anchor="middle" font-weight="400">剩 1 张</text><text x="403" y="408" font-size="23" fill="#AD6A12" text-anchor="middle" font-weight="400">剩 7 张</text><text x="312" y="481" font-size="30" fill="#AD6A12" text-anchor="middle" font-weight="700">最坏留下 7 张</text><text x="887" y="198" font-size="26" fill="#18334A" text-anchor="middle" font-weight="700">在 A、B、C、D 中吗？</text><line x1="887" y1="218" x2="746" y2="283" stroke="#17659E" stroke-width="3"/><line x1="887" y1="218" x2="1024" y2="283" stroke="#17659E" stroke-width="3"/><text x="806" y="249" font-size="22" fill="#17659E" text-anchor="middle" font-weight="400">是</text><text x="969" y="249" font-size="22" fill="#17659E" text-anchor="middle" font-weight="400">否</text><rect x="662.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="680" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">A</text><rect x="706.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="724" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">B</text><rect x="750.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="768" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">C</text><rect x="794.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="812" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">D</text><text x="746" y="408" font-size="23" fill="#536777" text-anchor="middle" font-weight="400">剩 4 张</text><rect x="940.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="958" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">E</text><rect x="984.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="1002" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">F</text><rect x="1028.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="1046" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">G</text><rect x="1072.5" y="310" width="35" height="56" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="1090" y="348" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">H</text><text x="1024" y="408" font-size="23" fill="#536777" text-anchor="middle" font-weight="400">剩 4 张</text><text x="887" y="481" font-size="30" fill="#17659E" text-anchor="middle" font-weight="700">最坏留下 4 张</text><text x="600" y="584" font-size="27" fill="#18334A" text-anchor="middle" font-weight="600">两组一共 m 张，至少有一组不少于 ⌈m/2⌉ 张</text></g></svg>