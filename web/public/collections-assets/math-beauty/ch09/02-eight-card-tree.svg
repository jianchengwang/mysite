"middle" font-weight="600">G</text><rect x="1066.0" y="549" width="58" height="61" rx="6" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="1095" y="587" font-size="26" fill="#18334A" text-anchor="middle" font-weight="600">H</text><text x="600" y="662" font-size="28" fill="#17659E" text-anchor="middle" font-weight="700">深度 3　→　最多 2³ = 8 个叶子</text><text x="600" y="708" font-size="23" fill="#536777" text-anchor="middle" font-weight="400">橙色示例：否 → 是 → 否，唯一到达 F</text></g></svg>