<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">三个是非回答识别八张卡</title><desc id="desc">三层二叉决策树。第一问是否在ABCD中；是分支问是否在AB中，否则问是否在EF中；第三问分别为是A、C、E、G吗，最终到达A到H八个叶子。橙色路径否是否到达F。</desc><rect width="1200" height="740" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="50" y="57" font-size="32" fill="#18334A" text-anchor="start" font-weight="700">三个是非回答，识别八张卡</text><text x="50" y="99" font-size="23" fill="#536777" text-anchor="start" font-weight="400">每个内部节点是一道问题；左分支为“是”，右分支为“否”</text><line x1="600" y1="203" x2="315" y2="273" stroke="#D4DFE7" stroke-width="3"/><text x="447.5" y="234.0" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">是</text><line x1="600" y1="203" x2="885" y2="273" stroke="#AD6A12" stroke-width="4"/><text x="752.5" y="234.0" font-size="20" fill="#AD6A12" text-anchor="middle" font-weight="400">否</text><line x1="315" y1="331" x2="175" y2="401" stroke="#D4DFE7" stroke-width="3"/><text x="235.0" y="362.0" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">是</text><line x1="315" y1="331" x2="455" y2="401" stroke="#D4DFE7" stroke-width="3"/><text x="395.0" y="362.0" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">否</text><line x1="885" y1="331" x2="745" y2="401" stroke="#AD6A12" stroke-width="4"/><text x="805.0" y="362.0" font-size="20" fill="#AD6A12" text-anchor="middle" font-weight="400">是</text><line x1="885" y1="331" x2="1025" y2="401" stroke="#D4DFE7" stroke-width="3"/><text x="965.0" y="362.0" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">否</text><line x1="175" y1="459" x2="105" y2="549" stroke="#D4DFE7" stroke-width="3"/><text x="133.0" y="506" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">是</text><line x1="175" y1="459" x2="245" y2="549" stroke="#D4DFE7" stroke-width="3"/><text x="217.0" y="506" font-size="20" fil