<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">四个互异键需要区分二十四种次序</title><desc id="desc">左侧列出ABCD的二十四种身份排列，代表二十四种可能的升序输出。右上四层二叉树容量用十六个小格表示，少于二十四。右下五层容量为三十二，只说明没有被容量条件排除，未构造排序算法。</desc><rect width="1200" height="800" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="50" y="59" font-size="32" fill="#18334A" text-anchor="start" font-weight="700">四个互异键，要区分 24 种完整次序</text><text x="50" y="103" font-size="23" fill="#536777" text-anchor="start" font-weight="400">一个叶子只能给出一种记录身份的升序排列</text><rect x="50" y="138" width="465" height="575" rx="14" fill="#FFFFFF" stroke="#D4DFE7" stroke-width="2"/><text x="282" y="193" font-size="28" fill="#18334A" text-anchor="middle" font-weight="700">需要：4! = 24 个叶子</text><rect x="76" y="226" width="90" height="48" rx="6" fill="#E4F0F8" stroke="#D4DFE7" stroke-width="1"/><text x="121" y="259" font-size="22" fill="#17659E" text-anchor="middle" font-weight="600">ABCD</text><rect x="184" y="226" width="90" height="48" rx="6" fill="#E4F0F8" stroke="#D4DFE7" stroke-width="1"/><text x="229" y="259" font-size="22" fill="#17659E" text-anchor="middle" font-weight="600">ABDC</text><rect x="292" y="226" width="90" height="48" rx="6" fill="#E4F0F8" stroke="#D4DFE7" stroke-width="1"/><text x="337" y="259" font-size="22" fill="#17659E" text-anchor="middle" font-weight="600">ACBD</text><rect x="400" y="226" width="90" height="48" rx="6" fill="#E4F0F8" stroke="#D4DFE7" stroke-width="1"/><text x="445" y="259" font-size="22" fill="#17659E" text-anchor="middle" font-weight="600">ACDB</text><rect x="76" y="294" width="90" height="48" rx="6" fill="#E4F0F8" stroke="#D4DFE7" stroke-width="1"/><text x="121" y="327" font-size="22" fill="#17659E" text-anchor="middle" font-weight="600">ADBC</text><rect x="184" y="294" width="90" height="48" rx="6" fill="#E4F0F8" stroke="#D4DFE7" stroke-width="1"/><text x="229" y="327" font-size