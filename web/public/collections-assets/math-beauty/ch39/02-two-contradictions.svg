<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">两个答案分别导致矛盾</title><desc id="desc">H(D,D)若返回会停，D按规则永久循环；若返回不会停，D在H有限返回后立刻结束。两个允许答案均违背H正确性承诺。</desc><rect width="1200" height="720" fill="#FAFBFC"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#17659E"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#AD6A12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536777"/></marker></defs><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="52" y="58" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">无论 H 回答哪一个，都会违背承诺</text>
<text x="52" y="100" font-size="23" fill="#536777" font-weight="400" text-anchor="start">共同前提：H(D,D) 必须在有限步内返回</text>
<text x="82" y="165" font-size="24" fill="#18334A" font-weight="600" text-anchor="start">H 的回答</text>
<text x="323" y="165" font-size="24" fill="#18334A" font-weight="600" text-anchor="start">它承诺 D(D)</text>
<text x="665" y="165" font-size="24" fill="#18334A" font-weight="600" text-anchor="start">D 按代码执行</text>
<text x="995" y="165" font-size="24" fill="#18334A" font-weight="600" text-anchor="start">核对</text>
<rect x="52" y="195" width="1096" height="164" rx="14" fill="#E4F0F8" stroke="#D7E0E6" stroke-width="2"/>
<rect x="52" y="391" width="1096" height="164" rx="14" fill="#FFF2D9" stroke="#D7E0E6" stroke-width="2"/>
<text x="83" y="266" font-size="32" fill="#17659E" font-weight="700" text-anchor="start">会停</text>
<text x="325" y="266" font-size="28" fill="#17659E" font-weight="600" text-anchor="start">最终结束</text>
<text x="665" y="266" font-size="28" fill="#AD6A12" font-weight="600" text-anchor="start">永久循环</text>
<text x="1018" y="266" font-size="30" fill="#B54442" font-weight="700" text-anchor="middle">矛盾</text>
<text x="325" y="316" font-size="21" fill="#536777" font-weight="400" text-anchor="start">H 正确性要求</text>
<text x="665" y="316" font-size="21" fill="#536777" font-weight="400" text-anchor="start">D 选择相反动作</text>
<text x="83" y="462" font-size="32" fill="#AD6A12" font-weight="700" text-anchor="start">不会停</text>
<text x="325" y="462" font-size="28" fill="#AD6A12" font-weight="600" text-anchor="start">永远运行</text>
<text x="665" y="462" font-size="28" fill="#17659E" font-weight="600" text-anchor="start">立刻结束</text>
<text x="1018" y="462" font-size="30" fill="#B54442" font-weight="700" text-anchor="middle">矛盾</text>
<text x="325" y="512" font-size="21" fill="#536777" font-weight="400" text-anchor="start">H 正确性要求</text>
<text x="665" y="512" font-size="21" fill="#536777" font-weight="400" text-anchor="start">H 返回后，退出 D</text>
<line x1="559" y1="259" x2="631" y2="259" stroke="#17659E" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="559" y1="455" x2="631" y2="455" stroke="#17659E" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="280" y1="195" x2="280" y2="359" stroke="#D7E0E6" stroke-width="3"/>
<line x1="280" y1="391" x2="280" y2="555" stroke="#D7E0E6" stroke-width="3"/>
<line x1="610" y1="195" x2="610" y2="359" stroke="#D7E0E6" stroke-width="3"/>
<line x1="610" y1="391" x2="610" y2="555" stroke="#D7E0E6" stroke-width="3"/>
<line x1="951" y1="195" x2="951" y2="359" stroke="#D7E0E6" stroke-width="3"/>
<line x1="951" y1="391" x2="951" y2="555" stroke="#D7E0E6" stroke-width="3"/>
<text x="52" y="617" font-size="26" fill="#B54442" font-weight="600" text-anchor="start">“H 永远不回答”不能成为第三种允许结果</text>
<text x="52" y="660" font-size="23" fill="#536777" font-weight="400" text-anchor="start">它会直接违反判定器自己总结束的合同</text>
</g></svg>