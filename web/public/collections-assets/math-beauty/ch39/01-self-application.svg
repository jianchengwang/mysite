<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">D 的自应用与判断对象</title><desc id="desc">D接收自身编码，调用H(D,D)，根据有限返回作相反动作。实线为调用的信息流，灰色虚线只标出被判断对象和实际执行对象一致，并非重复递归调用。</desc><rect width="1200" height="720" fill="#FAFBFC"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#17659E"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#AD6A12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536777"/></marker></defs><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="52" y="58" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">D(D)：把程序自己的编码交给它</text>
<text x="52" y="100" font-size="23" fill="#536777" font-weight="400" text-anchor="start">整张图只在假设 H 存在时成立；D 的代码是有限的</text>
<text x="65" y="159" font-size="25" fill="#17659E" font-weight="600" text-anchor="start">1  传入编码</text>
<text x="445" y="159" font-size="25" fill="#17659E" font-weight="600" text-anchor="start">2  请求判断</text>
<text x="825" y="159" font-size="25" fill="#17659E" font-weight="600" text-anchor="start">3  按回答行动</text>
<rect x="65" y="188" width="290" height="154" rx="14" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="210" y="241" font-size="32" fill="#17659E" font-weight="600" text-anchor="middle">D 的编码</text>
<text x="210" y="287" font-size="23" fill="#536777" font-weight="400" text-anchor="middle">一份有限字符串</text>
<rect x="445" y="188" width="290" height="154" rx="14" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/>
<text x="590" y="240" font-size="34" fill="#17659E" font-weight="600" text-anchor="middle">H(D, D)</text>
<text x="590" y="284" font-size="23" fill="#536777" font-weight="400" text-anchor="middle">自己必须有限步返回</text>
<rect x="825" y="188" width="310" height="154" rx="14" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/>
<text x="980" y="239" font-size="24" fill="#AD6A12" font-weight="600" text-anchor="middle">说会停 → 永久循环</text>
<text x="980" y="288" font-size="24" fill="#AD6A12" font-weight="600" text-anchor="middle">说不停 → 立刻结束</text>
<line x1="364" y1="265" x2="432" y2="265" stroke="#17659E" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="744" y1="265" x2="813" y2="265" stroke="#17659E" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="312" y="453" width="576" height="100" rx="14" fill="#F1F4F6" stroke="#D7E0E6" stroke-width="2"/>
<text x="600" y="493" font-size="27" fill="#18334A" font-weight="600" text-anchor="middle">被 H 判断的，正是这个 D(D)</text>
<text x="600" y="530" font-size="22" fill="#536777" font-weight="400" text-anchor="middle">预测的对象与作出反向动作的对象相同</text>
<path d="M 980 354 L 980 502 L 900 502" fill="none" stroke="#536777" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<path d="M 312 502 L 210 502 L 210 390 L 590 390 L 590 354" fill="none" stroke="#536777" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<text x="52" y="623" font-size="23" fill="#17659E" font-weight="600" text-anchor="start">实线：有限调用的信息流</text>
<text x="52" y="666" font-size="23" fill="#536777" font-weight="400" text-anchor="start">虚线：核对“同一个对象”，不是运行时反复调用的循环</text>
</g></svg>