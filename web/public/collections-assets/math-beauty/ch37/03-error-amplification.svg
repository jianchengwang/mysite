<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>大部分消去了，误差未必消去</title><desc>两个中间量带有误差，精确减法得到目标差值加误差之差。以微小目标差值为分母会放大相对误差。下方记录独立实验对照。</desc><rect width="1400" height="900" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 37 等价公式与稳定计算</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">大部分消去了，误差未必消去</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">即使最后一次减法完全精确，答案仍可能已经不准</text><rect x="90" y="225" width="440" height="112" rx="12" fill="#eef3ee" stroke="#c8d8d0" stroke-width="2"/><text x="310" y="269" font-size="26" fill="#2b6f9f" font-weight="500" text-anchor="middle">第一个中间量</text><text x="310" y="314" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">a ＋ e₁</text><rect x="870" y="225" width="440" height="112" rx="12" fill="#eef3ee" stroke="#c8d8d0" stroke-width="2"/><text x="1090" y="269" font-size="26" fill="#2b6f9f" font-weight="500" text-anchor="middle">第二个中间量</text><text x="1090" y="314" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">b ＋ e₂</text><text x="700" y="300" font-size="48" fill="#c35922" font-weight="700" text-anchor="middle">−</text><line x1="310" y1="345" x2="310" y2="375" stroke="#2b6f9f" stroke-width="3"/><line x1="1090" y1="345" x2="1090" y2="375" stroke="#2b6f9f" stroke-width="3"/><line x1="310" y1="375" x2="1090" y2="375" stroke="#2b6f9f" stroke-width="3"/><line x1="700" y1="375" x2="700" y2="415" stroke="#2b6f9f" stroke-width="4"/><path d="M 690 403 L 700 415 L 710 403" fill="none" stroke="#2b6f9f" stroke-width="4"/><rect x="245" y="429" width="910" height="124" rx="12" fill="#fff4e9" stroke="#c8d8d0" stroke-width="2"/><text x="700" y="478" font-size="36" fill="#213b3d" font-weight="600" text-anchor="middle">(a − b) ＋ (e₁ − e₂)</text><text x="700" y="527" font-size="26" fill="#c35922" font-weight="500" text-anchor="middle">目标差值很小，不保证已有的绝对误差也同样小</text><text x="700" y="610" font-size="32" fill="#c35922" font-weight="600" text-anchor="middle">相对误差 ＝ |e₁−e₂| / |a−b|</text><rect x="90" y="662" width="590" height="146" rx="12" fill="#fff4e9" stroke="#c8d8d0" stroke-width="2"/><text x="120" y="703" font-size="26" fill="#c35922" font-weight="600" text-anchor="start">本次直接式</text><text x="120" y="746" font-size="32" fill="#213b3d" font-weight="600" text-anchor="start">结果：0.0</text><text x="120" y="789" font-size="29" fill="#c35922" font-weight="500" text-anchor="start">相对误差：1（100%）</text><rect x="720" y="662" width="590" height="146" rx="12" fill="#eef3ee" stroke="#c8d8d0" stroke-width="2"/><text x="750" y="703" font-size="26" fill="#0b806c" font-weight="600" text-anchor="start">本次有理化式</text><text x="750" y="746" font-size="32" fill="#213b3d" font-weight="600" text-anchor="start">结果显示：5e−09</text><text x="750" y="789" font-size="29" fill="#0b806c" font-weight="500" text-anchor="start">相对误差：约 4.59×10⁻¹⁷</text><text x="700" y="842" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">实验输入 x＝10¹⁶；误差由高精度参考估计；卡片面积不代表比例</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 舍入条件与误差尺度见正文</text></g></svg>