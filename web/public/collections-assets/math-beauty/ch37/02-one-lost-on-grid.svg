<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>还没开方，那个 1 已经丢失</title><desc>在x等于10的16次方处，相邻浮点数间隔2，精确的x加1在中点并舍回x。数轴只使用相对x的标签。</desc><rect width="1400" height="900" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 37 等价公式与稳定计算</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">还没开方，那个 1 已经丢失</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">x ＝ 10¹⁶；二进制53位有效精度；最近舍入，中点取偶</text><rect x="70" y="218" width="1260" height="115" rx="12" fill="#eef3ee" stroke="#c8d8d0" stroke-width="2"/><text x="700" y="264" font-size="30" fill="#213b3d" font-weight="600" text-anchor="middle">2⁵³ ≤ x ＜ 2⁵⁴</text><text x="700" y="309" font-size="29" fill="#0b806c" font-weight="500" text-anchor="middle">格点间距 ＝ 2^(53−53＋1) ＝ 2</text><line x1="140" y1="485" x2="1260" y2="485" stroke="#213b3d" stroke-width="3"/><line x1="220" y1="463" x2="220" y2="507" stroke="#0b806c" stroke-width="4"/><circle cx="220" cy="485" r="10" fill="#0b806c"/><text x="220" y="543" font-size="31" fill="#0b806c" font-weight="600" text-anchor="middle">x − 2</text><line x1="620" y1="463" x2="620" y2="507" stroke="#0b806c" stroke-width="4"/><circle cx="620" cy="485" r="10" fill="#0b806c"/><text x="620" y="543" font-size="31" fill="#0b806c" font-weight="600" text-anchor="middle">x</text><line x1="1020" y1="463" x2="1020" y2="507" stroke="#0b806c" stroke-width="4"/><circle cx="1020" cy="485" r="10" fill="#0b806c"/><text x="1020" y="543" font-size="31" fill="#0b806c" font-weight="600" text-anchor="middle">x ＋ 2</text><circle cx="820" cy="485" r="10" fill="#fffdf6" stroke="#c35922" stroke-width="4"/><line x1="820" y1="409" x2="820" y2="468" stroke="#c35922" stroke-width="3" stroke-dasharray="8 6"/><text x="820" y="381" font-size="29" fill="#c35922" font-weight="600" text-anchor="middle">精确的 x＋1</text><text x="820" y="576" font-size="25" fill="#c35922" font-weight="500" text-anchor="middle">恰好在中点</text><line x1="800" y1="450" x2="641" y2="450" stroke="#c35922" stroke-width="4"/><path d="M 653 440 L 641 450 L 653 460" fill="none" stroke="#c35922" stroke-width="4"/><text x="638" y="417" font-size="26" fill="#c35922" font-weight="600" text-anchor="middle">舍回 x</text><line x1="620" y1="605" x2="1020" y2="605" stroke="#2b6f9f" stroke-width="2"/><line x1="620" y1="596" x2="620" y2="614" stroke="#2b6f9f" stroke-width="2"/><line x1="1020" y1="596" x2="1020" y2="614" stroke="#2b6f9f" stroke-width="2"/><text x="820" y="652" font-size="27" fill="#2b6f9f" font-weight="500" text-anchor="middle">两个格点相差 2</text><rect x="70" y="705" width="1260" height="100" rx="12" fill="#eef3ee" stroke="#c8d8d0" stroke-width="2"/><text x="700" y="747" font-size="29" fill="#213b3d" font-weight="600" text-anchor="middle">fl(x＋1) ＝ x → 两次开方相等 → 相减精确得到 0</text><text x="700" y="785" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">中点取偶：x/2 ＝ 5×10¹⁵ 是偶数，对应格点末位为 0</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 舍入条件与误差尺度见正文</text></g></svg>