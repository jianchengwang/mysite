<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>实数公式相等，计算路径不同</title><desc>两种算法计算相同数学函数。各基本操作后舍入，直接式相减，有理化式相加后以常数1除以和。</desc><rect width="1400" height="900" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 37 等价公式与稳定计算</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">实数公式相等，计算路径不同</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">√(x＋1) − √x ＝ 1 / [√(x＋1)＋√x]，x ≥ 0</text><rect x="55" y="215" width="1290" height="230" rx="12" fill="#fff4e9" stroke="#c8d8d0" stroke-width="2"/><text x="80" y="257" font-size="28" fill="#c35922" font-weight="700" text-anchor="start">直接式</text><rect x="80" y="278" width="535" height="130" rx="12" fill="#eef3ee" stroke="#c8d8d0" stroke-width="2"/><text x="105" y="324" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">a ＝ fl(√fl(x＋1))</text><text x="105" y="377" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">b ＝ fl(√x)</text><line x1="625" y1="343" x2="690" y2="343" stroke="#c35922" stroke-width="4"/><path d="M 678 334 L 690 343 L 678 352" fill="none" stroke="#c35922" stroke-width="4"/><rect x="705" y="288" width="300" height="110" rx="12" fill="#fffdf6" stroke="#c8d8d0" stroke-width="2"/><text x="855" y="333" font-size="26" fill="#c35922" font-weight="600" text-anchor="middle">相减，再舍入</text><text x="855" y="375" font-size="31" fill="#213b3d" font-weight="600" text-anchor="middle">fl(a − b)</text><line x1="1018" y1="343" x2="1095" y2="343" stroke="#c35922" stroke-width="4"/><path d="M 1083 334 L 1095 343 L 1083 352" fill="none" stroke="#c35922" stroke-width="4"/><text x="1210" y="334" font-size="25" fill="#c35922" font-weight="500" text-anchor="middle">目标是小差值</text><text x="1210" y="381" font-size="36" fill="#213b3d" font-weight="700" text-anchor="middle">f(x)</text><rect x="55" y="480" width="1290" height="230" rx="12" fill="#eef3ee" stroke="#c8d8d0" stroke-width="2"/><text x="80" y="522" font-size="28" fill="#0b806c" font-weight="700" text-anchor="start">有理化式</text><rect x="80" y="543" width="535" height="130" rx="12" fill="#fffdf6" stroke="#c8d8d0" stroke-width="2"/><text x="105" y="589" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">a ＝ fl(√fl(x＋1))</text><text x="105" y="642" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">b ＝ fl(√x)</text><line x1="625" y1="608" x2="690" y2="608" stroke="#0b806c" stroke-width="4"/><path d="M 678 599 L 690 608 L 678 617" fill="none" stroke="#0b806c" stroke-width="4"/><rect x="705" y="553" width="300" height="110" rx="12" fill="#fffdf6" stroke="#c8d8d0" stroke-width="2"/><text x="855" y="598" font-size="26" fill="#0b806c" font-weight="600" text-anchor="middle">相加，再舍入</text><text x="855" y="640" font-size="29" fill="#213b3d" font-weight="600" text-anchor="middle">s ＝ fl(a ＋ b)</text><line x1="1018" y1="608" x2="1095" y2="608" stroke="#0b806c" stroke-width="4"/><path d="M 1083 599 L 1095 608 L 1083 617" fill="none" stroke="#0b806c" stroke-width="4"/><text x="1210" y="597" font-size="26" fill="#0b806c" font-weight="500" text-anchor="middle">保留常数 1</text><text x="1210" y="642" font-size="31" fill="#213b3d" font-weight="700" text-anchor="middle">fl(1 / s)</text><text x="700" y="777" font-size="29" fill="#2b6f9f" font-weight="600" text-anchor="middle">fl：操作后的值回到当前格式允许的格点</text><text x="700" y="824" font-size="27" fill="#213b3d" font-weight="400" text-anchor="middle">不是改变函数，而是改变误差经过的路径</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 舍入条件与误差尺度见正文</text></g></svg>