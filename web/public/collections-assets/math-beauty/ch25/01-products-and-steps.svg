<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="概率相乘，信息刻度相加"><rect width="1400" height="800" fill="#faf8f1"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#18342d}</style><text x="55" y="77" font-size="44" font-weight="700" text-anchor="start">概率相乘，信息刻度相加</text><text x="57" y="127" font-size="24" font-weight="400" text-anchor="start" fill="#6b7c74" style="fill:#6b7c74">一次公平二选一，再做一次独立的公平四选一</text><rect x="65" y="194" width="330" height="298" rx="12" fill="#ffffff" stroke="#dbe2d8" stroke-width="2"/><text x="230" y="239" font-size="25" font-weight="400" text-anchor="middle">第一步的指定结果</text><text x="230" y="324" font-size="42" font-weight="700" text-anchor="middle" fill="#157a63" style="fill:#157a63">p = 1/2</text><line x1="105" y1="353" x2="355" y2="353" stroke="#dbe2d8" stroke-width="3"/><text x="230" y="428" font-size="45" font-weight="700" text-anchor="middle" fill="#157a63" style="fill:#157a63">1 bit</text><rect x="527" y="194" width="330" height="298" rx="12" fill="#ffffff" stroke="#dbe2d8" stroke-width="2"/><text x="692" y="239" font-size="25" font-weight="400" text-anchor="middle">第二步的指定结果</text><text x="692" y="324" font-size="42" font-weight="700" text-anchor="middle" fill="#326c97" style="fill:#326c97">q = 1/4</text><line x1="567" y1="353" x2="817" y2="353" stroke="#dbe2d8" stroke-width="3"/><text x="692" y="428" font-size="45" font-weight="700" text-anchor="middle" fill="#326c97" style="fill:#326c97">2 bits</text><rect x="1002" y="194" width="330" height="298" rx="12" fill="#ffffff" stroke="#dbe2d8" stroke-width="2"/><text x="1167" y="239" font-size="25" font-weight="400" text-anchor="middle">两步都命中</text><text x="1167" y="324" font-size="42" font-weight="700" text-anchor="middle" fill="#b95a2b" style="fill:#b95a2b">pq = 1/8</text><line x1="1042" y1="353" x2="1292" y2="353" stroke="#dbe2d8" stroke-width="3"/><text x="1167" y="428" font-size="45" font-weight="700" text-anchor="middle" fill="#b95a2b" style="fill:#b95a2b">3 bits</text><text x="460" y="325" font-size="49" font-weight="400" text-anchor="middle">×</text><text x="925" y="325" font-size="49" font-weight="400" text-anchor="middle">=</text><text x="460" y="429" font-size="49" font-weight="400" text-anchor="middle">+</text><text x="925" y="429" font-size="49" font-weight="400" text-anchor="middle">=</text><text x="70" y="561" font-size="30" font-weight="600" text-anchor="start">从 1 到 1/8：每次概率除以 2，信息量加 1</text><line x1="186" y1="629" x2="504" y2="629" stroke="#157a63" stroke-width="4"/><text x="345.0" y="610" font-size="25" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">× 1/2</text><text x="345.0" y="689" font-size="25" font-weight="400" text-anchor="middle" fill="#326c97" style="fill:#326c97">+ 1 bit</text><circle cx="170" cy="629" r="9" fill="#157a63"/><text x="170" y="668" font-size="27" font-weight="400" text-anchor="middle">1</text><line x1="536" y1="629" x2="854" y2="629" stroke="#157a63" stroke-width="4"/><text x="695.0" y="610" font-size="25" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">× 1/2</text><text x="695.0" y="689" font-size="25" font-weight="400" text-anchor="middle" fill="#326c97" style="fill:#326c97">+ 1 bit</text><circle cx="520" cy="629" r="9" fill="#157a63"/><text x="520" y="668" font-size="27" font-weight="400" text-anchor="middle">1/2</text><line x1="886" y1="629" x2="1204" y2="629" stroke="#157a63" stroke-width="4"/><text x="1045.0" y="610" font-size="25" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">× 1/2</text><text x="1045.0" y="689" font-size="25" font-weight="400" text-anchor="middle" fill="#326c97" style="fill:#326c97">+ 1 bit</text><circle cx="870" cy="629" r="9" fill="#157a63"/><text x="870" y="668" font-size="27" font-weight="400" text-anchor="middle">1/4</text><circle cx="1220" cy="629" r="9" fill="#157a63"/><text x="1220" y="668" font-size="27" font-weight="400" text-anchor="middle">1/8</text><text x="55" y="773" font-size="18" font-weight="400" text-anchor="start" fill="#6b7c74" style="fill:#6b7c74">数学之美 · 第25章 · 原创图解 · 虚构教学模型</text></svg>