idth="3"/><circle cx="695.1380571741504" cy="424" r="8" fill="#b95a2b"/><text x="672.7777777777783" y="375" font-size="27" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">[1.55, 1.60]</text><text x="1310" y="469" font-size="21" font-weight="400" text-anchor="end" fill="#6b7c74" style="fill:#6b7c74">bit</text><text x="55" y="586" font-size="29" font-weight="600" text-anchor="start">n = 100</text><text x="55" y="627" font-size="22" font-weight="400" text-anchor="start" fill="#6b7c74" style="fill:#6b7c74">宽度 1/100</text><line x1="270" y1="587" x2="1310" y2="587" stroke="#dbe2d8" stroke-width="3"/><rect x="684.0000000000002" y="570" width="22.444444444444457" height="34" rx="4" fill="#c5e0d4"/><line x1="684.0000000000002" y1="562" x2="684.0000000000002" y2="612" stroke="#157a63" stroke-width="3"/><line x1="706.4444444444447" y1="562" x2="706.4444444444447" y2="612" stroke="#157a63" stroke-width="3"/><circle cx="695.1380571741504" cy="587" r="8" fill="#b95a2b"/><text x="695.2222222222222" y="538" font-size="27" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">[1.58, 1.59]</text><text x="1310" y="632" font-size="21" font-weight="400" text-anchor="end" fill="#6b7c74" style="fill:#6b7c74">bit</text><line x1="695.1380571741504" y1="178" x2="695.1380571741504" y2="200" stroke="#b95a2b" stroke-width="2" stroke-dasharray="7 7"/><line x1="695.1380571741504" y1="225" x2="695.1380571741504" y2="342" stroke="#b95a2b" stroke-width="2" stroke-dasharray="7 7"/><line x1="695.1380571741504" y1="384" x2="695.1380571741504" y2="505" stroke="#b95a2b" stroke-width="2" stroke-dasharray="7 7"/><line x1="695.1380571741504" y1="548" x2="695.1380571741504" y2="651" stroke="#b95a2b" stroke-width="2" stroke-dasharray="7 7"/><text x="709.1380571741504" y="189" font-size="27" font-weight="400" text-anchor="start" fill="#b95a2b" style="fill:#b95a2b">t</text><line x1="280.0" y1="652" x2="280.0" y2="663" stroke="#6b7c74" stroke-width="2"/><text x="28