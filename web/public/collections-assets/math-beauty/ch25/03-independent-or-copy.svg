<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-label="第二条告警，究竟增加多少"><rect width="1400" height="950" fill="#faf8f1"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#18342d}</style><text x="55" y="77" font-size="44" font-weight="700" text-anchor="start">第二条告警，究竟增加多少</text><text x="57" y="127" font-size="24" font-weight="400" text-anchor="start" fill="#6b7c74" style="fill:#6b7c74">两边均有 P(A) = 1/8；分支标注的是条件概率</text><line x1="700" y1="175" x2="700" y2="788" stroke="#dbe2d8" stroke-width="2"/><text x="350" y="212" font-size="35" font-weight="700" text-anchor="middle" fill="#326c97" style="fill:#326c97">独立机制</text><circle cx="98" cy="402" r="12" fill="#326c97"/><text x="98" y="443" font-size="24" font-weight="400" text-anchor="middle">开始</text><line x1="111" y1="396" x2="277" y2="310" stroke="#326c97" stroke-width="4"/><line x1="111" y1="408" x2="277" y2="620" stroke="#dbe2d8" stroke-width="3"/><text x="170" y="319" font-size="25" font-weight="400" text-anchor="middle" fill="#326c97" style="fill:#326c97">1/8</text><text x="169" y="541" font-size="24" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">7/8</text><rect x="272" y="266" width="119" height="71" rx="12" fill="#ffffff" stroke="#326c97" stroke-width="2"/><text x="331" y="312" font-size="26" font-weight="600" text-anchor="middle" fill="#326c97" style="fill:#326c97">A 告警</text><text x="321" y="651" font-size="25" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">A 未告警</text><text x="321" y="686" font-size="21" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">此处不展开</text><line x1="391" y1="293" x2="530" y2="271" stroke="#326c97" stroke-width="4"/><line x1="391" y1="310" x2="530" y2="444" stroke="#dbe2d8" stroke-width="3"/><text x="455" y="241" font-size="25" font-weight="400" text-anchor="middle" fill="#326c97" style="fill:#326c97">1/8</text><text x="471" y="407" font-size="24" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">7/8</text><rect x="527" y="236" width="122" height="69" rx="12" fill="#ffffff" stroke="#326c97" stroke-width="2"/><text x="588" y="280" font-size="25" font-weight="600" text-anchor="middle" fill="#326c97" style="fill:#326c97">B 告警</text><text x="588" y="474" font-size="23" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">B 未告警</text><text x="489" y="531" font-size="22" font-weight="400" text-anchor="middle" fill="#326c97" style="fill:#326c97">已知 A 后，新增 3 bits</text><text x="350" y="740" font-size="27" font-weight="600" text-anchor="middle" fill="#326c97" style="fill:#326c97">P(A∩B) = 1/8 × 1/8 = 1/64</text><text x="350" y="794" font-size="34" font-weight="700" text-anchor="middle" fill="#326c97" style="fill:#326c97">联合：3 + 3 = 6 bits</text><text x="1050" y="212" font-size="35" font-weight="700" text-anchor="middle" fill="#157a63" style="fill:#157a63">确定复制</text><circle cx="798" cy="402" r="12" fill="#157a63"/><text x="798" y="443" font-size="24" font-weight="400" text-anchor="middle">开始</text><line x1="811" y1="396" x2="977" y2="310" stroke="#157a63" stroke-width="4"/><line x1="811" y1="408" x2="977" y2="620" stroke="#dbe2d8" stroke-width="3"/><text x="870" y="319" font-size="25" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">1/8</text><text x="869" y="541" font-size="24" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">7/8</text><rect x="972" y="266" width="119" height="71" rx="12" fill="#ffffff" stroke="#157a63" stroke-width="2"/><text x="1031" y="312" font-size="26" font-weight="600" text-anchor="middle" fill="#157a63" style="fill:#157a63">A 告警</text><text x="1021" y="651" font-size="25" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">A 未告警</text><text x="1021" y="686" font-size="21" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">此处不展开</text><line x1="1091" y1="294" x2="1230" y2="271" stroke="#157a63" stroke-width="4"/><text x="1155" y="241" font-size="28" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">1</text><rect x="1227" y="236" width="122" height="69" rx="12" fill="#ffffff" stroke="#157a63" stroke-width="2"/><text x="1288" y="280" font-size="25" font-weight="600" text-anchor="middle" fill="#157a63" style="fill:#157a63">B 告警</text><text x="1189" y="388" font-size="28" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">P(B|A) = 1</text><text x="1189" y="443" font-size="22" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">没有不告警的分支</text><text x="1189" y="531" font-size="22" font-weight="400" text-anchor="middle" fill="#157a63" style="fill:#157a63">已知 A 后，新增 0 bit</text><text x="1050" y="740" font-size="27" font-weight="600" text-anchor="middle" fill="#157a63" style="fill:#157a63">P(A∩B) = 1/8 × 1 = 1/8</text><text x="1050" y="794" font-size="34" font-weight="700" text-anchor="middle" fill="#157a63" style="fill:#157a63">联合：3 + 0 = 3 bits</text><text x="700" y="872" font-size="29" font-weight="400" text-anchor="middle" fill="#6b7c74" style="fill:#6b7c74">复制增加了通知条数，没有增加已知事件的结果信息</text><text x="55" y="923" font-size="18" font-weight="400" text-anchor="start" fill="#6b7c74" style="fill:#6b7c74">数学之美 · 第25章 · 原创图解 · 虚构教学模型</text></svg>