<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">把“到了哪里”细化成“处于什么状态”</title><desc id="desc">C站展开成绿线平台与橙线平台，二者通过5分钟转换连接，路线S B C绿 C橙 T各段2 2 5 2分钟，共11分钟。</desc><rect width="1400" height="880" fill="#fffdf7"/><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#e0e5dd"/></pattern></defs><rect width="1400" height="880" fill="url(#dots)"/><text x="55" y="54" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  01  数学建模</text><text x="55" y="115" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">把“到了哪里”细化成“处于什么状态”</text><text x="55" y="168" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">同一个物理站点，不同站台会影响下一步的代价</text><rect x="450" y="205" width="500" height="140" rx="12" fill="#f0f2eb" stroke="#6f7e79" stroke-width="2"/><text x="700" y="265" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle">只记录“C站”</text><text x="700" y="311" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="middle">站在绿线，还是橙线？</text><text x="700" y="400" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">↓  把需要区分的状态展开</text><path d="M100,550 L340,550" fill="none" stroke="#127965" stroke-width="6" stroke-linecap="round"/><text x="220.0" y="502" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">2 分钟</text><path d="M340,550 L640,550" fill="none" stroke="#127965" stroke-width="6" stroke-linecap="round"/><text x="490.0" y="502" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">2 分钟</text><path d="M640,550 L960,550" fill="none" stroke="#bc5d25" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8"/><text x="800.0" y="502" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">换乘 5 分钟</text><path d="M960,550 L1270,550" fill="none" stroke="#bc5d25" stroke-width="6" stroke-linecap="round"/><text x="1115.0" y="502" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">2 分钟</text><circle cx="100" cy="550" r="27" fill="#fffdf7" stroke="#127965" stroke-width="4"/><text x="100" y="560" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">S</text><circle cx="340" cy="550" r="27" fill="#fffdf7" stroke="#127965" stroke-width="4"/><text x="340" y="560" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">B</text><rect x="588" y="513" width="104" height="74" rx="12" fill="#fffdf7" stroke="#127965" stroke-width="4"/><text x="640" y="560" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">C绿</text><rect x="908" y="513" width="104" height="74" rx="12" fill="#fffdf7" stroke="#bc5d25" stroke-width="4"/><text x="960" y="560" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">C橙</text><circle cx="1270" cy="550" r="27" fill="#fffdf7" stroke="#bc5d25" stroke-width="4"/><text x="1270" y="560" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">T</text><text x="700" y="678" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">2＋2＋5＋2＝11 分钟</text><text x="700" y="755" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">模型里的对象可以是“状态”，不必与物理物体一一对应</text><text x="55" y="850" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构线路与时间</text></svg>