<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">同一组关系，可以画成不同样子</title><desc id="desc">两幅虚构五站网络拓扑完全相同，几何布局不同。每幅都有S-A、A-T、S-B、B-C、C-T五条双向边。</desc><rect width="1400" height="880" fill="#fffdf7"/><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#e0e5dd"/></pattern></defs><rect width="1400" height="880" fill="url(#dots)"/><text x="55" y="54" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  01  数学建模</text><text x="55" y="115" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">同一组关系，可以画成不同样子</text><text x="55" y="166" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">改变形状，保留站名和连接；可达关系就不会改变</text><text x="350" y="230" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">画法 A</text><path d="M110,440 L330,300" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M330,300 L590,440" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M110,440 L210,630" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M210,630 L440,615" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M440,615 L590,440" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="440" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="110" y="450" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">S</text><circle cx="330" cy="300" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="330" y="310" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">A</text><circle cx="590" cy="440" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="590" y="450" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">T</text><circle cx="210" cy="630" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="210" y="640" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">B</text><circle cx="440" cy="615" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="440" y="625" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">C</text><text x="1050" y="230" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">画法 B</text><path d="M805,460 L950,315" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M950,315 L1270,315" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M805,460 L1010,635" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M1010,635 L1270,635" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><path d="M1270,635 L1270,315" fill="none" stroke="#2a6694" stroke-width="5" stroke-linecap="round"/><circle cx="805" cy="460" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="805" y="470" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">S</text><circle cx="950" cy="315" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="950" y="325" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">A</text><circle cx="1270" cy="315" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="1270" y="325" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">T</text><circle cx="1010" cy="635" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="1010" y="645" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">B</text><circle cx="1270" cy="635" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="1270" y="645" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">C</text><text x="700" y="750" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">两幅图的连接都只有：S—A、A—T、S—B、B—C、C—T</text><text x="700" y="800" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">线画得更短，不代表坐车更快；这里还没有记录时间</text><text x="55" y="850" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构线路与时间</text></svg>