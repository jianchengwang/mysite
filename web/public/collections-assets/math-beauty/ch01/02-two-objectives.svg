<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">同一张图，两个目标，两个答案</title><desc id="desc">P两段总8分钟，Q三段总6分钟。最少区间和最少行车时间的目标会产生不同最优路线。</desc><rect width="1400" height="880" fill="#fffdf7"/><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#e0e5dd"/></pattern></defs><rect width="1400" height="880" fill="url(#dots)"/><text x="55" y="54" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  01  数学建模</text><text x="55" y="115" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">同一张图，两个目标，两个答案</text><text x="55" y="168" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">本轮只算行车时间，暂不计候车、换乘与进出站</text><text x="55" y="247" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start">路线 P</text><path d="M170,320 L530,320" fill="none" stroke="#2a6694" stroke-width="6" stroke-linecap="round"/><text x="350.0" y="292" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">4 分钟</text><path d="M530,320 L890,320" fill="none" stroke="#2a6694" stroke-width="6" stroke-linecap="round"/><text x="710.0" y="292" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">4 分钟</text><circle cx="170" cy="320" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="170" y="330" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">S</text><circle cx="530" cy="320" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="530" y="330" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">A</text><circle cx="890" cy="320" r="27" fill="#fffdf7" stroke="#2a6694" stroke-width="4"/><text x="890" y="330" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">T</text><rect x="1030" y="240" width="305" height="165" rx="12" fill="#e7eef4" stroke="#2a6694" stroke-width="2"/><text x="1055" y="295" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start">2 个区间</text><text x="1055" y="350" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">4＋4＝8 分钟</text><text x="55" y="502" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start">路线 Q</text><path d="M170,575 L410,575" fill="none" stroke="#127965" stroke-width="6" stroke-linecap="round"/><text x="290.0" y="547" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">2 分钟</text><path d="M410,575 L650,575" fill="none" stroke="#127965" stroke-width="6" stroke-linecap="round"/><text x="530.0" y="547" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">2 分钟</text><path d="M650,575 L890,575" fill="none" stroke="#127965" stroke-width="6" stroke-linecap="round"/><text x="770.0" y="547" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">2 分钟</text><circle cx="170" cy="575" r="27" fill="#fffdf7" stroke="#127965" stroke-width="4"/><text x="170" y="585" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">S</text><circle cx="410" cy="575" r="27" fill="#fffdf7" stroke="#127965" stroke-width="4"/><text x="410" y="585" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">B</text><circle cx="650" cy="575" r="27" fill="#fffdf7" stroke="#127965" stroke-width="4"/><text x="650" y="585" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">C</text><circle cx="890" cy="575" r="27" fill="#fffdf7" stroke="#127965" stroke-width="4"/><text x="890" y="585" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">T</text><rect x="1030" y="495" width="305" height="165" rx="12" fill="#e4f1e8" stroke="#127965" stroke-width="2"/><text x="1055" y="550" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start">3 个区间</text><text x="1055" y="605" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">2＋2＋2＝6 分钟</text><text x="55" y="766" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">目标：区间最少 → P     目标：行车时间最少 → Q</text><text x="55" y="850" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构线路与时间</text></svg>