<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">加法没错，遗漏的条件改变了答案</title><desc id="desc">加入换乘5分钟，Q由6分钟变为11分钟。若换乘时间为非负tau，tau小于2时Q更快，等于2时相同，大于2时P更快。</desc><rect width="1400" height="880" fill="#fffdf7"/><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#e0e5dd"/></pattern></defs><rect width="1400" height="880" fill="url(#dots)"/><text x="55" y="54" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  01  数学建模</text><text x="55" y="115" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">加法没错，遗漏的条件改变了答案</text><text x="55" y="168" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">P 全程蓝线，不换乘；Q 在 C 从绿线换到橙线</text><rect x="55" y="220" width="1290" height="120" rx="12" fill="#e7eef4" stroke="#2a6694" stroke-width="2"/><text x="90" y="274" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" text-anchor="start">P</text><text x="180" y="275" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="start">行车 8 分钟</text><text x="1090" y="275" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">总计 8</text><rect x="55" y="380" width="1290" height="120" rx="12" fill="#e4f1e8" stroke="#127965" stroke-width="2"/><text x="90" y="434" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" text-anchor="start">Q</text><text x="180" y="435" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="start">行车 6 分钟</text><text x="545" y="435" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="start">＋ 换乘 5 分钟</text><text x="1090" y="435" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">总计 11</text><text x="55" y="560" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">换乘记为 τ 分钟：比较 8 与 6＋τ，分界就在 τ＝2</text><rect x="55" y="610" width="405" height="150" rx="12" fill="#fffdf7" stroke="#127965" stroke-width="2"/><text x="257" y="665" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">τ ＜ 2</text><text x="257" y="718" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">Q 更快</text><rect x="495" y="610" width="405" height="150" rx="12" fill="#fffdf7" stroke="#6f7e79" stroke-width="2"/><text x="697" y="665" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">τ ＝ 2</text><text x="697" y="718" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">两条一样快</text><rect x="935" y="610" width="405" height="150" rx="12" fill="#fffdf7" stroke="#2a6694" stroke-width="2"/><text x="1137" y="665" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">τ ＞ 2</text><text x="1137" y="718" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">P 更快</text><text x="55" y="850" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  虚构线路与时间</text></svg>