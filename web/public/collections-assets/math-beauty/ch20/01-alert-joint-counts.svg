<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">一次告警，有两种来源</title><desc id="desc">虚构台账共10000个窗口。有故障100，其中99告警、1未告警；无故障9900，其中99告警、9801未告警。两个告警分支相加为198。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#6f7e79" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1400" height="940" rx="0" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  20  证据与判断</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">一次告警，有两种来源</text><text x="55" y="160" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">先按故障分组，再按是否告警分组；最后把两个告警分支合回来</text><path d="M275 434 H315 V289 H370" fill="none" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M315 434 V579 H370" fill="none" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M610 289 H690 V242 H795" fill="none" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M690 289 V384 H795" fill="none" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M610 579 H690 V532 H795" fill="none" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M690 579 V674 H795" fill="none" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="379" width="215" height="110" rx="18" fill="#edf4ee" stroke="none" stroke-width="2"/><text x="167" y="422" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">全部窗口</text><text x="167" y="464" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle">10000</text><rect x="370" y="234" width="240" height="110" rx="18" fill="#dcefe7" stroke="none" stroke-width="2"/><text x="490" y="277" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">有故障 D</text><text x="490" y="320" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">100</text><rect x="370" y="524" width="240" height="110" rx="18" fill="#fff0de" stroke="none" stroke-width="2"/><text x="490" y="567" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">无故障 Dᶜ</text><text x="490" y="610" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">9900</text><rect x="795" y="187" width="345" height="110" rx="18" fill="#dcefe7" stroke="none" stroke-width="2"/><text x="820" y="230" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">告警 E</text><text x="1108" y="266" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="end">99</text><rect x="795" y="329" width="345" height="110" rx="18" fill="#edf4ee" stroke="none" stroke-width="2"/><text x="820" y="372" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">未告警 Eᶜ</text><text x="1108" y="408" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="end">1</text><rect x="795" y="477" width="345" height="110" rx="18" fill="#fff0de" stroke="none" stroke-width="2"/><text x="820" y="520" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">告警 E</text><text x="1108" y="556" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="end">99</text><rect x="795" y="619" width="345" height="110" rx="18" fill="#edf4ee" stroke="none" stroke-width="2"/><text x="820" y="662" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">未告警 Eᶜ</text><text x="1108" y="698" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="end">9801</text><text x="721" y="223" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="500" text-anchor="start">99%</text><text x="721" y="365" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">1%</text><text x="721" y="513" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="500" text-anchor="start">1%</text><text x="721" y="655" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">99%</text><path d="M1140 242 H1225 V774" fill="none" stroke="#127965" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1140 532 H1275 V774" fill="none" stroke="#bc5d25" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1125" y="758" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">相加</text><rect x="340" y="774" width="980" height="96" rx="18" fill="#f0eee5" stroke="none" stroke-width="2"/><text x="385" y="816" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">告警来自两组：99 ＋ 99 ＝ 198</text><text x="385" y="852" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">P(E) ＝ 198/10000 ＝ 0.0198</text><text x="55" y="910" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">结构示意，框面积不表示数量；每条末端分支互不重叠，四个数合计10000</text></svg>