<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970" viewBox="0 0 1400 970" role="img" aria-labelledby="title desc"><title id="title">第二条消息，增加了多少信息</title><desc id="desc">先验赔率1比99，第一次告警使其变成1比1。若第二条只是复制第一条，新增似然比1，后验仍1/2。若第二次检测在故障和无故障两组中分别条件独立且性能相同，新增似然比99，后验99/100。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#6f7e79" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1400" height="970" rx="0" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  20  证据与判断</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">第二条消息，增加了多少信息</text><text x="55" y="160" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">从同一个50%出发，能否再乘99，取决于证据的来源与依赖关系</text><rect x="55" y="210" width="275" height="110" rx="18" fill="#edf4ee" stroke="none" stroke-width="2"/><text x="192" y="251" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">先验赔率</text><text x="192" y="296" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle">1 ∶ 99</text><line x1="338" y1="265" x2="575" y2="265" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="457" y="241" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="middle">首次告警 ×99</text><rect x="590" y="210" width="310" height="110" rx="18" fill="#dcefe7" stroke="none" stroke-width="2"/><text x="745" y="251" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle">首次告警后</text><text x="745" y="296" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" text-anchor="middle">1 ∶ 1 → 50%</text><rect x="55" y="352" width="1290" height="213" rx="18" fill="#f0eee5" stroke="none" stroke-width="2"/><text x="85" y="397" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">路径 A  同一告警的副本</text><text x="85" y="443" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">E₂＝E₁；已经看到E₁后，两组中副本都必然出现</text><text x="85" y="492" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">新增似然比：1/1＝1</text><text x="930" y="464" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">赔率 1∶1</text><text x="930" y="517" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="start">后验仍为 1/2</text><rect x="55" y="600" width="1290" height="223" rx="18" fill="#dcefe7" stroke="none" stroke-width="2"/><text x="85" y="646" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">路径 B  两组内分别条件独立的检测</text><text x="85" y="691" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">给定D：0.99 × 0.99；给定Dᶜ：0.01 × 0.01</text><text x="85" y="742" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start">新增似然比：0.99/0.01＝99</text><text x="930" y="711" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">赔率 99∶1</text><text x="930" y="769" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="start">后验为 99/100</text><text x="55" y="875" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">一般更新要看：P(E₂|D,E₁) / P(E₂|Dᶜ,E₁)</text><text x="55" y="920" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">“有两条消息”不能代替条件独立假设；以上均为教学模型，不是实测</text></svg>