<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">同一个分子，两个不同的分母</title><desc id="desc">上行在100个故障窗口中比较99个告警和1个未告警，得到99%。下行在198个告警窗口中比较99个故障和99个无故障，得到50%。两条长条各自归一化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#6f7e79" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1400" height="940" rx="0" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  20  证据与判断</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">同一个分子，两个不同的分母</text><text x="55" y="160" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">P(E|D)与P(D|E)共用交集，但先选定的范围不同</text><rect x="55" y="211" width="1290" height="275" rx="18" fill="#f3f6ef" stroke="none" stroke-width="2"/><text x="85" y="253" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">问：有故障时，会不会告警？</text><text x="85" y="295" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">先只看 D：100个故障窗口</text><rect x="330" y="332" width="900.9" height="60" rx="0" fill="#127965" stroke="none" stroke-width="2"/><rect x="1230.9" y="332" width="9.1" height="60" rx="0" fill="#b8c9bd" stroke="none" stroke-width="2"/><text x="780.45" y="373" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">99个告警</text><path d="M1235.45 393 V410 H1070" fill="none" stroke="#6f7e79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="433" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">1个未告警</text><text x="85" y="447" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">P(E|D) ＝ 99/100 ＝ 99%</text><rect x="55" y="526" width="1290" height="278" rx="18" fill="#fff5e8" stroke="none" stroke-width="2"/><text x="85" y="568" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">问：已经告警，是否有故障？</text><text x="85" y="611" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">先只看 E：198个告警窗口</text><rect x="330" y="647" width="455.0" height="60" rx="0" fill="#127965" stroke="none" stroke-width="2"/><rect x="785.0" y="647" width="455.0" height="60" rx="0" fill="#bc5d25" stroke="none" stroke-width="2"/><text x="557.5" y="688" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">99个有故障</text><text x="1012.5" y="688" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">99个无故障</text><text x="85" y="764" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">P(D|E) ＝ 99/198 ＝ 50%</text><text x="55" y="858" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">绿色都指同一批99个真告警。两条长条各自归一为100%，不能跨行比较面积</text><text x="55" y="906" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">交换条件时，变化的不是这99个窗口，而是用来作分母的范围</text></svg>