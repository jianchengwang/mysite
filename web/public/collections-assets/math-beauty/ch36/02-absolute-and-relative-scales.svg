<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>相同的绝对变化，除以不同的参考值</title><desc>函数f(x)=x−1，x=1.000001，扰动h=10的负8次方。输入与输出的绝对变化相同，相对变化分别约为10的负8次方与百分之一。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf6" stroke="none" stroke-width="2"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 36 问题的条件性</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">相同的绝对变化，除以不同的参考值</text><text x="55" y="162" font-size="26" fill="#213b3d" font-weight="400" text-anchor="start">f(x) = x − 1；x = 1.000001；h = 10⁻⁸</text><rect x="55" y="224" width="620" height="419" rx="8" fill="#f0f7f2" stroke="#dce4de" stroke-width="2"/><rect x="725" y="224" width="620" height="419" rx="8" fill="#f3f6fa" stroke="#dce4de" stroke-width="2"/><text x="365" y="277" font-size="32" fill="#0b806c" font-weight="700" text-anchor="middle">输入尺度</text><text x="1035" y="277" font-size="32" fill="#2b6f9f" font-weight="700" text-anchor="middle">输出尺度</text><text x="365" y="335" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">x → x+h</text><text x="1035" y="335" font-size="30" fill="#2b6f9f" font-weight="600" text-anchor="middle">f(x) → f(x+h)</text><text x="365" y="401" font-size="42" fill="#213b3d" font-weight="600" text-anchor="middle">10⁻⁸</text><text x="1035" y="401" font-size="42" fill="#213b3d" font-weight="600" text-anchor="middle">10⁻⁸</text><line x1="195" y1="428" x2="535" y2="428" stroke="#213b3d" stroke-width="2"/><line x1="865" y1="428" x2="1205" y2="428" stroke="#213b3d" stroke-width="2"/><text x="365" y="481" font-size="40" fill="#0b806c" font-weight="600" text-anchor="middle">1.000001</text><text x="1035" y="481" font-size="40" fill="#2b6f9f" font-weight="600" text-anchor="middle">0.000001</text><text x="365" y="553" font-size="30" fill="#0b806c" font-weight="600" text-anchor="middle">相对变化 ≈ 10⁻⁸</text><text x="1035" y="553" font-size="30" fill="#2b6f9f" font-weight="600" text-anchor="middle">相对变化 = 0.01 = 1%</text><text x="365" y="608" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">分母：原输入的绝对值</text><text x="1035" y="608" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">分母：原输出的绝对值</text><text x="700" y="700" font-size="34" fill="#213b3d" font-weight="600" text-anchor="middle">绝对变化之比 = 1</text><text x="700" y="751" font-size="31" fill="#c35922" font-weight="600" text-anchor="middle">相对变化之比 = 1.000001 / 0.000001 = 1000001</text><text x="700" y="815" font-size="26" fill="#718582" font-weight="400" text-anchor="middle">参考值为 0 时，这种相对误差没有定义；改用绝对误差或任务尺度</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 虚构教学数据，按精确实数关系绘制</text></g></svg>