<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>问题层与算法层，比较的基准不同</title><desc>问题层比较理想输入x与实际输入x+h各自的精确答案。算法层固定实际输入x+h，比较程序输出q与精确答案f(x+h)。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf6" stroke="none" stroke-width="2"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 36 问题的条件性</text><text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">问题层与算法层，比较的基准不同</text><text x="55" y="162" font-size="26" fill="#213b3d" font-weight="400" text-anchor="start">先固定比较对象，再判断差异来自输入变化还是数值求解</text><text x="60" y="226" font-size="28" fill="#0b806c" font-weight="700" text-anchor="start">① 问题层</text><text x="252" y="226" font-size="26" fill="#213b3d" font-weight="400" text-anchor="start">两份输入，各自精确计算</text><rect x="70" y="259" width="310" height="96" rx="8" fill="#f0f7f2" stroke="#dce4de" stroke-width="2"/><rect x="515" y="259" width="365" height="96" rx="8" fill="#f0f7f2" stroke="#dce4de" stroke-width="2"/><text x="225" y="302" font-size="27" fill="#0b806c" font-weight="600" text-anchor="middle">理想输入 x</text><text x="225" y="339" font-size="24" fill="#213b3d" font-weight="400" text-anchor="middle">精确答案 f(x)</text><text x="697" y="302" font-size="27" fill="#0b806c" font-weight="600" text-anchor="middle">实际输入 x+h</text><text x="697" y="339" font-size="24" fill="#213b3d" font-weight="400" text-anchor="middle">精确答案 f(x+h)</text><line x1="389" y1="307" x2="499" y2="307" stroke="#0b806c" stroke-width="3"/><path d="M 489 301 L 499 307 L 489 313" fill="none" stroke="#0b806c" stroke-width="3"/><text x="444" y="285" font-size="22" fill="#0b806c" font-weight="400" text-anchor="middle">扰动</text><text x="949" y="299" font-size="25" fill="#0b806c" font-weight="600" text-anchor="start">比较两个精确答案</text><text x="949" y="339" font-size="27" fill="#213b3d" font-weight="500" text-anchor="start">f(x+h) − f(x)</text><line x1="60" y1="408" x2="1340" y2="408" stroke="#dce4de" stroke-width="2"/><text x="60" y="467" font-size="28" fill="#2b6f9f" font-weight="700" text-anchor="start">② 算法层</text><text x="252" y="467" font-size="26" fill="#213b3d" font-weight="400" text-anchor="start">固定同一份实际输入 x+h</text><rect x="70" y="506" width="310" height="96" rx="8" fill="#f3f6fa" stroke="#dce4de" stroke-width="2"/><rect x="515" y="506" width="365" height="96" rx="8" fill="#f3f6fa" stroke="#dce4de" stroke-width="2"/><text x="225" y="551" font-size="27" fill="#2b6f9f" font-weight="600" text-anchor="middle">精确求解</text><text x="225" y="586" font-size="24" fill="#213b3d" font-weight="400" text-anchor="middle">得到 f(x+h)</text><text x="697" y="551" font-size="27" fill="#2b6f9f" font-weight="600" text-anchor="middle">所选算法与有限精度</text><text x="697" y="586" font-size="24" fill="#213b3d" font-weight="400" text-anchor="middle">得到计算结果 q</text><text x="444" y="562" font-size="25" fill="#2b6f9f" font-weight="500" text-anchor="middle">比较</text><text x="949" y="547" font-size="25" fill="#2b6f9f" font-weight="600" text-anchor="start">比较数值结果与基准</text><text x="949" y="587" font-size="27" fill="#213b3d" font-weight="500" text-anchor="start">q − f(x+h)</text><line x1="60" y1="654" x2="1340" y2="654" stroke="#dce4de" stroke-width="2"/><text x="700" y="714" font-size="28" fill="#213b3d" font-weight="600" text-anchor="middle">总差异的精确拆分</text><text x="700" y="771" font-size="33" fill="#213b3d" font-weight="600" text-anchor="middle">q − f(x) = [f(x+h) − f(x)] + [q − f(x+h)]</text><text x="700" y="824" font-size="26" fill="#718582" font-weight="400" text-anchor="middle">前一项关注问题的敏感性；后一项需要分析算法与实现</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 虚构教学数据，按精确实数关系绘制</text></g></svg>