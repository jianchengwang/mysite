<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><title>只把中点费用加倍，排序就反转</title><desc>横条按相同平方厘米尺度绘制，三色分别代表x等于0、1、2的平方损失贡献。等权C为1/6、D为3/16；中点加倍后C为5/18、D为1/4。只展示两个候选的比较。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#718582"/></marker></defs><rect width="1400" height="1050" fill="#fffdf6"/><g font-family="Noto Sans CJK SC, sans-serif">
