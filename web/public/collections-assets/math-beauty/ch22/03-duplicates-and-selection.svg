<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">更多记录，也可能没有更接近目标</title><desc id="desc">左侧一个伯努利结果Z复制为多行，样本均值仍等于Z。右侧目标包含四个时段设备子群，只有白天平时稳定告警被选中；加大该子群抽样仍不能自动覆盖其余群体。</desc>
<rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf7" stroke="none" stroke-width="2"/>
<text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  22  从样本到整体</text>
<text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">更多记录，也可能没有更接近目标</text>
<text x="55" y="164" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">检查两件事：有没有新的独立信息？样本是否来自目标群体？</text>
