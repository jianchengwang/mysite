<text x="455" y="632" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">Xₙ</text>
<text x="540" y="632" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">= Z</text>
<text x="355" y="713" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="middle">p̂ = Z</text>
<text x="355" y="763" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">Var(p̂) = p(1 − p)</text>
