<text x="280" y="752" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">0</text>
<line x1="530.0" y1="710" x2="530.0" y2="720" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/>
<text x="530.0" y="752" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">0.25</text>
<line x1="780.0" y1="710" x2="780.0" y2="720" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/>
<text x="780.0" y="752" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">0.5</text>
<line x1="1030.0" y1="710" x2="1030.0" y2="720" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/>
<text x="1030.0" y="752" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">0.75</text>
<line x1="1280" y1="710" x2="1280" y2="720" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/>
<text x="1280" y="752" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1</text>
<text x="1280" y="792" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="end">样本均值 p̂</text>
<text x="65" y="818" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">彩色线段 = p ± 一个标准差；不是取值范围，也不是保证区间</text>
<text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  独立同分布与抽样条件</text>
</svg>