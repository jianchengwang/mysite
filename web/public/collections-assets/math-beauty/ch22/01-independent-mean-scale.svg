<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">平均值的波动，按平方根缩小</title><desc id="desc">固定p为二分之一，独立同分布样本的均值标准差依次为0.1、0.05、0.025；彩色线段表示p左右各一个标准差，不是取值范围或概率保证区间。</desc>
<rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf7" stroke="none" stroke-width="2"/>
<text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  22  从样本到整体</text>
<text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">平均值的波动，按平方根缩小</text>
<text x="55" y="164" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">同一个模型：p = 1/2；样本量每增加到四倍，标准差减半</text>
<line x1="780" y1="235" x2="780" y2="675" stroke="#127965" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 8"/>
<text x="780" y="229" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">p = 0.5</text>
<text x="65" y="335" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">n = 25</text>
<line x1="280" y1="325" x2="1280" y2="325" stroke="#dce3dc" stroke-width="3" stroke-linecap="round"/>
<line x1="680.0" y1="325" x2="880.0" y2="325" stroke="#2a6694" stroke-width="11" stroke-linecap="round"/>
<line x1="680.0" y1="307" x2="680.0" y2="343" stroke="#2a6694" stroke-width="3" stroke-linecap="round"/>
<line x1="880.0" y1="307" x2="880.0" y2="343" stroke="#2a6694" stroke-width="3" stroke-linecap="round"/>
<circle cx="780" cy="325" r="7" fill="#2a6694" stroke="#fffdf7" stroke-width="2"/>
<text x="1030" y="298" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">标准差 = 0.1</text>
<text x="680.0" y="372" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.4</text>
<text x="880.0" y="372" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.6</text>
<text x="65" y="475" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">n = 100</text>
<line x1="280" y1="465" x2="1280" y2="465" stroke="#dce3dc" stroke-width="3" stroke-linecap="round"/>
<line x1="730.0" y1="465" x2="830.0" y2="465" stroke="#127965" stroke-width="11" stroke-linecap="round"/>
<line x1="730.0" y1="447" x2="730.0" y2="483" stroke="#127965" stroke-width="3" stroke-linecap="round"/>
<line x1="830.0" y1="447" x2="830.0" y2="483" stroke="#127965" stroke-width="3" stroke-linecap="round"/>
<circle cx="780" cy="465" r="7" fill="#127965" stroke="#fffdf7" stroke-width="2"/>
<text x="1030" y="438" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">标准差 = 0.05</text>
<text x="718.0" y="512" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">0.45</text>
<text x="842.0" y="512" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">0.55</text>
<text x="65" y="615" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">n = 400</text>
<line x1="280" y1="605" x2="1280" y2="605" stroke="#dce3dc" stroke-width="3" stroke-linecap="round"/>
