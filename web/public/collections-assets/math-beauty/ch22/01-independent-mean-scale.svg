<line x1="755.0" y1="587" x2="755.0" y2="623" stroke="#bc5d25" stroke-width="3" stroke-linecap="round"/>
<line x1="805.0" y1="587" x2="805.0" y2="623" stroke="#bc5d25" stroke-width="3" stroke-linecap="round"/>
<circle cx="780" cy="605" r="7" fill="#bc5d25" stroke="#fffdf7" stroke-width="2"/>
<text x="1030" y="578" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">标准差 = 0.025</text>
<text x="743.0" y="652" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">0.475</text>
<text x="817.0" y="652" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">0.525</text>
