<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>先比方向，再决定走多远</title><desc>等比例方向坐标绘出单位圆。梯度为负12负10，负单位梯度为6和5除以根号61，点积为负2根号61；坐标轴单位方向点积为负12和负10；垂直单位方向5和负6除以根号61，点积为0。</desc><defs><marker id="greenarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b806c"/></marker><marker id="bluearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6f9f"/></marker><marker id="orangearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c35922"/></marker></defs><g font-family="Noto Sans CJK SC, sans-serif"><rect width="1400" height="900" fill="#fffdf6"/><text x="55.00" y="50.00" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 32 梯度与步长</text><text x="55.00" y="112.00" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">先比方向，再决定走多远</text><text x="55.00" y="165.00" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">在 θ = (0, 0) 处，g = (−12, −10)；只比较同样长的方向</text><circle cx="335" cy="498" r="198" fill="none" stroke="#dce4de" stroke-width="3"/><line x1="109.00" y1="498.00" x2="563.00" y2="498.00" stroke="#718582" stroke-width="2"/><line x1="335.00" y1="726.00" x2="335.00" y2="265.00" stroke="#718582" stroke-width="2"/><text x="576.00" y="506.00" font-size="26" fill="#718582" font-weight="400" text-anchor="start">v₁</text><text x="320.00" y="250.00" font-size="26" fill="#718582" font-weight="400" text-anchor="start">v₂</text><line x1="137.00" y1="493.00" x2="137.00" y2="503.00" stroke="#718582" stroke-width="2"/><text x="137.00" y="530.00" font-size="20" fill="#718582" font-weight="400" text-anchor="middle">-1</text><line x1="330.00" y1="696.00" x2="340.00" y2="696.00" stroke="#718582" stroke-width="2"/><text x="319.00" y="703.00" font-size="20" fill="#718582" font-weight="400" text-anchor="end">-1</text><line x1="533.00" y1="493.00" x2="533.00" y2="503.00" stroke="#718582" stroke-width="2"/><text x="533.00" y="530.00" font-size="20" fill="#718582" font-weight="400" text-anchor="middle">1</text><line x1="330.00" y1="300.00" x2="340.00" y2="300.00" stroke="#718582" stroke-width="2"/><text x="319.00" y="307.00" font-size="20" fill="#718582" font-weight="400" text-anchor="end">1</text><line x1="335.00" y1="498.00" x2="533.00" y2="498.00" stroke="#2b6f9f" stroke-width="4.5" marker-end="url(#bluearrow)"/><line x1="335.00" y1="498.00" x2="335.00" y2="300.00" stroke="#2b6f9f" stroke-width="4.5" marker-end="url(#bluearrow)"/><line x1="335.00" y1="498.00" x2="487.11" y2="371.24" stroke="#0b806c" stroke-width="4.5" marker-end="url(#greenarrow)"/><line x1="335.00" y1="498.00" x2="461.76" y2="650.11" stroke="#c35922" stroke-width="4.5" marker-end="url(#orangearrow)"/><circle cx="335.00" cy="498.00" r="5" fill="#213b3d"/><text x="320.00" y="530.00" font-size="20" fill="#718582" font-weight="400" text-anchor="end">0</text><text x="450.00" y="334.00" font-size="29" fill="#0b806c" font-weight="600" text-anchor="start">−g / ‖g‖</text><text x="430.00" y="715.00" font-size="25" fill="#c35922" font-weight="400" text-anchor="start">垂直于 g</text><text x="130.00" y="790.00" font-size="27" fill="#718582" font-weight="400" text-anchor="start">单位圆：v₁² + v₂² = 1</text><text x="700.00" y="259.00" font-size="27" fill="#718582" font-weight="600" text-anchor="start">方向 v</text><text x="1245.00" y="259.00" font-size="27" fill="#718582" font-weight="600" text-anchor="middle">g · v</text><line x1="700.00" y1="378.00" x2="1340.00" y2="378.00" stroke="#dce4de" stroke-width="1"/><text x="715.00" y="343.00" font-size="30" fill="#2b6f9f" font-weight="600" text-anchor="start">(1, 0)</text><text x="1245.00" y="343.00" font-size="27" fill="#2b6f9f" font-weight="600" text-anchor="middle">−12</text><line x1="700.00" y1="489.00" x2="1340.00" y2="489.00" stroke="#dce4de" stroke-width="1"/><text x="715.00" y="454.00" font-size="30" fill="#2b6f9f" font-weight="600" text-anchor="start">(0, 1)</text><text x="1245.00" y="454.00" font-size="27" fill="#2b6f9f" font-weight="600" text-anchor="middle">−10</text><line x1="700.00" y1="600.00" x2="1340.00" y2="600.00" stroke="#dce4de" stroke-width="1"/><text x="715.00" y="565.00" font-size="30" fill="#0b806c" font-weight="600" text-anchor="start">(6, 5) / √61</text><text x="1245.00" y="565.00" font-size="27" fill="#0b806c" font-weight="600" text-anchor="middle">−2√61 ≈ −15.62</text><line x1="700.00" y1="711.00" x2="1340.00" y2="711.00" stroke="#dce4de" stroke-width="1"/><text x="715.00" y="676.00" font-size="30" fill="#c35922" font-weight="600" text-anchor="start">(5, −6) / √61</text><text x="1245.00" y="676.00" font-size="27" fill="#c35922" font-weight="600" text-anchor="middle">0</text><text x="700.00" y="780.00" font-size="29" fill="#0b806c" font-weight="600" text-anchor="start">最小的一阶变化率是 −‖g‖</text><text x="700.00" y="826.00" font-size="25" fill="#718582" font-weight="400" text-anchor="start">结论依赖选定的欧氏数值坐标</text><text x="55.00" y="873.00" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 固定单位下的虚构教学数据</text></g></svg>