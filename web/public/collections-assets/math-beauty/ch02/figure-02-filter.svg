<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">图2 命题判断与集合筛选</title><desc id="desc">全集六条请求。持票筛选后留下甲乙丁己，安检筛选后留下甲丁己，排除暂停请求丁后留下甲己。集合 A 为持票请求，C 为通过安检请求，D 为暂停请求。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#53677d"/></marker></defs>
<rect width="1120" height="820" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="60" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">把同一条规则逐步用于六条请求</text><text x="48" y="103" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">每列只保留满足当前全部条件的请求；灰色位置表示已被筛掉</text><rect x="48" y="139" width="232" height="500" rx="16" fill="white" stroke="#d8e1ec"/><text x="164" y="184" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">U</text><text x="164" y="224" font-size="20" fill="#53677d" font-weight="400" text-anchor="middle">全部请求</text><line x1="68" y1="245" x2="260" y2="245" stroke="#d8e1ec" stroke-width="2"/><rect x="120" y="260" width="88" height="38" rx="10" fill="#e3f2ec" stroke="none"/><text x="164" y="288" font-size="24" fill="#147d64" font-weight="700" text-anchor="middle">甲</text><rect x="120" y="309" width="88" height="38" rx="10" fill="#e3f2ec" stroke="none"/><text x="164" y="337" font-size="24" fill="#147d64" font-weight="700" text-anchor="middle">乙</text><rect x="120" y="358" width="88" height="38" rx="10" fill="#e3f2ec" stroke="none"/><text x="164" y="386" font-size="24" fill="#147d64" font-weight="700" text-anchor="middle">丙</text><rect x="120" y="407" width="88" height="38" rx="10" fill="#e3f2ec" stroke="none"/><text x="164" y="435" font-size="24" fill="#147d64" font-weight="700" text-anchor="middle">丁</text><rect x="120" y="456" width="88" height="38" rx="10" fill="#e3f2ec" stroke="none"/><text x="164" y="484" font-size="24" fill="#147d64" font-weight="700" text-anchor="middle">戊</text><rect x="120" y="505" width="88" height="38" rx="10" fill="#e3f2ec" stroke="none"/><text x="164" y="533" font-size="24" fill="#147d64" font-weight="700" text-anchor="middle">己</text><line x1="68" y1="570" x2="260" y2="570" stroke="#d8e1ec" stroke-width="2"/><text x="164" y="612" font-size="24" fill="#10243a" font-weight="700" text-anchor="middle">6 条</text><line x1="285" y1="389" x2="306" y2="389" stroke="#53677d" stroke-width="2