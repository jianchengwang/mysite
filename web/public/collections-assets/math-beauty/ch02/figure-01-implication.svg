<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">图1 必要条件与充分条件的方向</title><desc id="desc">四种组合依次是 T=1 E=1，T=1 E=0，T=0 E=1，T=0 E=0。E 蕴含 T 仅在无票但获准时为假；T 蕴含 E 仅在有票但未获准时为假。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#53677d"/></marker></defs>
<rect width="1120" height="710" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="60" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">两个方向，两个不同的承诺</text><text x="48" y="103" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">T = 持有效票　 E = 规则允许进站　　1 为真，0 为假</text><rect x="48" y="143" width="508" height="194" rx="16" fill="white" stroke="#d8e1ec"/><text x="72" y="182" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">有票，获准</text><text x="390" y="182" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">T=1  E=1</text><line x1="72" y1="201" x2="532" y2="201" stroke="#d8e1ec" stroke-width="2"/><text x="72" y="244" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">E → T</text><text x="192" y="244" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">获准就必须有票</text><text x="515" y="244" font-size="26" fill="#147d64" font-weight="700" text-anchor="end">真</text><text x="72" y="296" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">T → E</text><text x="192" y="296" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">有票就足够获准</text><text x="515" y="296" font-size="26" fill="#147d64" font-weight="700" text-anchor="end">真</text><rect x="580" y="143" width="508" height="194" rx="16" fill="white" stroke="#d8e1ec"/><text x="604" y="182" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">有票，未获准</text><text x="922" y="182" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">T=1  E=0</text><line x1="604" y1="201" x2="1064" y2="201" stroke="#d8e1ec" stroke-width="2"/><text x="604" y="244" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">E → T</text><text x="724" y="244" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">获准就必须有票</text><text x="1047" y="244" font-size="26" fill="#147d64" font-weight="700" text-anchor="end">真</text><text x="604" y="296" font-size="25" fill="#bc3549" font-weight="700" text-anchor="start">T → E</text><text x="724" y="296" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">有票就足够获准</text><text x="1047" y="296" font-size="26" fill="#bc3549" font-weight="700" text-anchor="end">假</text><rect x="48" y="361" width="508" height="194" rx="16" fill="white" stroke="#d8e1ec"/><text x="72" y="400" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">无票，获准</text><text x="390" y="400" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">T=0  E=1</text><line x1="72" y1="419" x2="532" y2="419" stroke="#d8e1ec" stroke-width="2"/><text x="72" y="462" font-size="25" fill="#bc3549" font-weight="700" text-anchor="start">E → T</text><text x="192" y="462" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">获准就必须有票</text><text x="515" y="462" font-size="26" fill="#bc3549" font-weight="700" text-anchor="end">假</text><text x="72" y="514" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">T → E</text><text x="192" y="514" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">有票就足够获准</text><text x="515" y="514" font-size="26" fill="#147d64" font-weight="700" text-anchor="end">真</text><rect x="580" y="361" width="508" height="194" rx="16" fill="white" stroke="#d8e1ec"/><text x="604" y="400" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">无票，未获准</text><text x="922" y="400" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">T=0  E=0</text><line x1="604" y1="419" x2="1064" y2="419" stroke="#d8e1ec" stroke-width="2"/><text x="604" y="462" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">E → T</text><text x="724" y="462" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">获准就必须有票</text><text x="1047" y="462" font-size="26" fill="#147d64" font-weight="700" text-anchor="end">真</text><text x="604" y="514" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">T → E</text><text x="724" y="514" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">有票就足够获准</text><text x="1047" y="514" font-size="26" fill="#147d64" font-weight="700" text-anchor="end">真</text><text x="48" y="627" font-size="24" fill="#10243a" font-weight="400" text-anchor="start">仅“有票，未获准”这一种情况，就足以反驳“有票就足够获准”。</text><text x="48" y="667" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">四种组合用于检验规则，不表示它们都符合实际放行规则。</text></g></svg>