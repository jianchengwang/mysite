<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">图3 德摩根律如何改变拒绝条件</title><desc id="desc">放行条件把 T、S、非 B 用且连接。拒绝条件把非 T、非 S、B 用或连接。乙的状态为 T=1、S=0、B=0，放行为0，拒绝为1。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#53677d"/></marker></defs>
<rect width="1120" height="805" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="60" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">放行要全部通过，拒绝只需一项失败</text><text x="48" y="102" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">同一份状态快照；左边输出 E，右边输出 ¬E，二者始终相反</text><rect x="48" y="138" width="488" height="407" rx="16" fill="white" stroke="#d8e1ec"/><text x="72" y="183" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">放行检查</text><text x="72" y="224" font-size="26" fill="#10243a" font-weight="700" text-anchor="start">E = T ∧ S ∧ ¬B</text><rect x="72" y="260" width="176" height="48" rx="10" fill="#f4f7fb" stroke="#d8e1ec"/><text x="87" y="289" font-size="24" fill="#147d64" font-weight="700" text-anchor="start">T</text><text x="135" y="289" font-size="19" fill="#53677d" font-weight="400" text-anchor="start">持有效票</text><line x1="248" y1="284" x2="281" y2="284" stroke="#53677d" stroke-width="2"/><line x1="281" y1="284" x2="281" y2="364" stroke="#53677d" stroke-width="2"/><rect x="72" y="340" width="176" height="48" rx="10" fill="#f4f7fb" stroke="#d8e1ec"/><text x="87" y="369" font-size="24" fill="#147d64" font-weight="700" text-anchor="start">S</text><text x="135" y="369" font-size="19" fill="#53677d" font-weight="400" text-anchor="start">安检通过</text><line x1="248" y1="364" x2="281" y2="364" stroke="#53677d" stroke-width="2"/><rect x="72" y="420" width="176" height="48" rx="10" fill="#f4f7fb" stroke="#d8e1ec"/><text x="87" y="449" font-size="24" fill="#147d64" font-weight="700" text-anchor="start">¬B</text><text x="135" y="449" font-size="19" fill="#53677d" font-weight="400" text-anchor="start">未被暂停</text><line x1="248" y1="444" x2="281" y2="444" stroke="#53677d" stroke-width="2"/><line x1="281" y1="444" x2="281" y2="364" stroke="#53677d" stroke-width="2"/><line x1="281" y1="364" x2="318" y2="364" stroke="#53677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="329" y="330" width="62" height="68" rx="14" fill="#eef3fa" stroke="#d8e1ec"/><text x="360" y="375" font-size="30" fill="#147d64" font-weight="700" text-anchor="middle">且</text><line x1="391" y1="364" x2="432" y2="364" stroke="#53677d" stroke-width="2" marker-end="url(#arrow)"/><text x="458" y="375" font-size="31" fill="#147d64" font-weight="700" text-anchor="middle">E</text><rect x="584" y="138" width="488" height="407" rx="16" fill="white" stroke="#d8e1ec"/><text x="608" y="183" font-size="25" fill="#bc3549" font-weight="700" text-anchor="start">拒绝检查</text><text x="608" y="224" font-size="26" fill="#10243a" font-weight="700" text-anchor="start">¬E = ¬T ∨ ¬S ∨ B</text><rect x="608" y="260" width="176" height="48" rx="10" fill="#f4f7fb" stroke="#d8e1ec"/><text x="623" y="289" font-size="24" fill="#bc3549" font-weight="700" text-anchor="start">¬T</text><text x="671" y="289" font-size="19" fill="#53677d" font-weight="400" text-anchor="start">无有效票</text><line x1="784" y1="284" x2="817" y2="284" stroke="#53677d" stroke-width="2"/><line x1="817" y1="284" x2="817" y2="364" stroke="#53677d" stroke-width="2"/><rect x="608" y="340" width="176" height="48" rx="10" fill="#f4f7fb" stroke="#d8e1ec"/><text x="623" y="369" font-size="24" fill="#bc3549" font-weight="700" text-anchor="start">¬S</text><text x="671" y="369" font-size="19" fill="#53677d" font-weight="400" text-anchor="start">安检未通过</text><line x1="784" y1="364" x2="817" y2="364" stroke="#53677d" stroke-width="2"/><rect x="608" y="420" width="176" height="48" rx="10" fill="#f4f7fb" stroke="#d8e1ec"/><text x="623" y="449" font-size="24" fill="#bc3549" font-weight="700" text-anchor="start">B</text><text x="671" y="449" font-size="19" fill="#53677d" font-weight="400" text-anchor="start">被暂停</text><line x1="784" y1="444" x2="817" y2="444" stroke="#53677d" stroke-width="2"/><line x1="817" y1="444" x2="817" y2="364" stroke="#53677d" stroke-width="2"/><line x1="817" y1="364" x2="854" y2="364" stroke="#53677d" stroke-width="2" marker-end="url(#arrow)"/><rect x="865" y="330" width="62" height="68" rx="14" fill="#eef3fa" stroke="#d8e1ec"/><text x="896" y="375" font-size="30" fill="#bc3549" font-weight="700" text-anchor="middle">或</text><line x1="927" y1="364" x2="968" y2="364" stroke="#53677d" stroke-width="2" marker-end="url(#arrow)"/><text x="994" y="375" font-size="31" fill="#bc3549" font-weight="700" text-anchor="middle">¬E</text><rect x="48" y="575" width="1024" height="140" rx="16" fill="white" stroke="#d8e1ec"/><text x="72" y="618" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">代入乙的状态：T = 1，S = 0，B = 0</text><text x="72" y="668" font-size="25" fill="#147d64" font-weight="700" text-anchor="start">放行：1 ∧ 0 ∧ 1 = 0</text><text x="606" y="668" font-size="25" fill="#bc3549" font-weight="700" text-anchor="start">拒绝：0 ∨ 1 ∨ 0 = 1</text><text x="48" y="763" font-size="24" fill="#10243a" font-weight="400" text-anchor="start">否定“全部满足”，等价于“至少一项不满足”。</text></g></svg>