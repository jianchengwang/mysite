<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">同样100毫秒，等待体验不同</title><desc id="desc">A只取100毫秒，概率为1。B取90毫秒的概率为0.99，取1090毫秒的概率为0.01。两者均值均为100毫秒，A方差为0，B方差为9900平方毫秒。圆点大小不表示概率。</desc><rect x="0" y="0" width="1400" height="900" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  21  平均值之外</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">同样100毫秒，等待体验不同</text><text x="55" y="164" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">相同的均值，没有告诉我们是否会偶尔等很久</text><line x1="290" y1="242" x2="290" y2="628" stroke="#127965" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 8"/><text x="435" y="237" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">共同均值 100 ms</text><line x1="430" y1="248" x2="310" y2="248" stroke="#127965" stroke-width="2" stroke-linecap="round"/><line x1="310" y1="248" x2="290" y2="266" stroke="#127965" stroke-width="2" stroke-linecap="round"/><text x="65" y="362" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" text-anchor="start">A</text><line x1="190" y1="350" x2="1290" y2="350" stroke="#dce3dc" stroke-width="3" stroke-linecap="round"/><text x="65" y="547" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" text-anchor="start">B</text><line x1="190" y1="535" x2="1290" y2="535" stroke="#dce3dc" stroke-width="3" stroke-linecap="round"/><circle cx="290" cy="350" r="10" fill="#2a6694" stroke="#fffdf7" stroke-width="2"/><text x="330" y="322" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">100 ms · 概率 1</text><circle cx="280" cy="535" r="10" fill="#bc5d25" stroke="#fffdf7" stroke-width="2"/><circle cx="1280" cy="535" r="10" fill="#bc5d25" stroke="#fffdf7" stroke-width="2"/><text x="330" y="505" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">90 ms · 概率 0.99</text><line x1="320" y1="512" x2="290" y2="529" stroke="#bc5d25" stroke-width="2" stroke-linecap="round"/><text x="1100" y="473" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">1090 ms</text><text x="1100" y="510" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle">概率 0.01</text><line x1="1180" y1="495" x2="1280" y2="520" stroke="#bc5d25" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="630" x2="1290" y2="630" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><line x1="190" y1="630" x2="190" y2="642" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="190" y="681" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">0</text><line x1="290" y1="630" x2="290" y2="642" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="290" y="681" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">100</text><line x1="490" y1="630" x2="490" y2="642" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="490" y="681" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">300</text><line x1="690" y1="630" x2="690" y2="642" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="690" y="681" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">500</text><line x1="890" y1="630" x2="890" y2="642" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="890" y="681" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">700</text><line x1="1090" y1="630" x2="1090" y2="642" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="1090" y="681" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">900</text><line x1="1290" y1="630" x2="1290" y2="642" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="1290" y="681" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1100</text><text x="1285" y="720" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">响应时间 / ms</text><text x="190" y="747" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">90与100只差10 ms；横轴未省略任何区间</text><line x1="55" y1="781" x2="1345" y2="781" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="65" y="827" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">A：方差 0</text><text x="470" y="827" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">B：方差 9900 ms²；标准差 ≈ 99.50 ms</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  虚构有限概率模型</text></svg>