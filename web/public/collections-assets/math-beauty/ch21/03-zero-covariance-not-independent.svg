<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">协方差为0，关系仍然确定</title><desc id="desc">X等概率取负一、零、一，Y=X平方。三个点为负一一、零零、一一，每点概率三分之一。X均值为零，Y均值为三分之二，协方差三项贡献为负九分之一、零、正九分之一。Y由X完全确定，两者不独立。</desc><rect x="0" y="0" width="1400" height="900" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  21  平均值之外</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">协方差为0，关系仍然确定</text><text x="55" y="164" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">X等概率取 −1、0、1，Y = X²；每个点的概率都是1/3</text><line x1="118" y1="655" x2="745" y2="655" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><line x1="440" y1="692" x2="440" y2="264" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round"/><line x1="130" y1="435.0" x2="742" y2="435.0" stroke="#127965" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 8"/><text x="145" y="416.0" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" text-anchor="start">E[Y] = 2/3</text><text x="464" y="286" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">Y</text><text x="745" y="692" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">X</text><line x1="200" y1="655" x2="200" y2="665" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="200" y="702" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">-1</text><line x1="440" y1="655" x2="440" y2="665" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="440" y="702" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">0</text><line x1="680" y1="655" x2="680" y2="665" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="680" y="702" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">1</text><line x1="430" y1="325" x2="440" y2="325" stroke="#233a3b" stroke-width="2" stroke-linecap="round"/><text x="416" y="334" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">1</text><circle cx="200" cy="325" r="11" fill="#2a6694" stroke="#fffdf7" stroke-width="2"/><circle cx="440" cy="655" r="11" fill="#2a6694" stroke="#fffdf7" stroke-width="2"/><circle cx="680" cy="325" r="11" fill="#2a6694" stroke="#fffdf7" stroke-width="2"/><text x="200" y="299" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="middle">(−1,1)</text><text x="680" y="299" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="middle">(1,1)</text><text x="472" y="640" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">(0,0)</text><text x="450" y="751" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="middle">E[X] = 0</text><line x1="810" y1="220" x2="810" y2="791" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="855" y="260" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">各点对协方差的贡献</text><text x="855" y="307" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">概率 × (X − 0)(Y − 2/3)</text><text x="855" y="382" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">X = −1</text><text x="855" y="418" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">(1/3) × (−1) × (1/3) = −1/9</text><text x="855" y="465" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">X = 0</text><text x="855" y="501" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">(1/3) × 0 × (−2/3) = 0</text><text x="855" y="548" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">X = 1</text><text x="855" y="584" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">(1/3) × 1 × (1/3) = 1/9</text><line x1="850" y1="608" x2="1335" y2="608" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="855" y="656" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">Cov(X,Y) = −1/9 + 0 + 1/9 = 0</text><text x="855" y="714" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">但 P(Y = 0) = 1/3</text><text x="855" y="758" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">P(Y = 0 | X = 0) = 1</text><text x="700" y="824" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">抵消的是乘积的平均，不是 Y = X² 的联系</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  虚构有限概率模型</text></svg>