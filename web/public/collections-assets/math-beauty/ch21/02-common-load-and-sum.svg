<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">每个环节不变，合起来的波动变了</title><desc id="desc">两个串行环节X和Y各以一半概率取90或110毫秒。左侧独立时四格联合概率均为四分之一，总和方差200平方毫秒。右侧共同扰动时只有90与90、110与110两格各二分之一，总和方差400平方毫秒。</desc><rect x="0" y="0" width="1400" height="900" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  21  平均值之外</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">每个环节不变，合起来的波动变了</text><text x="55" y="164" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">各自都是：均值100 ms，方差100 ms²；总耗时记作 S = X + Y</text><line x1="700" y1="220" x2="700" y2="810" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="405" y="249" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="middle">独立扰动</text><text x="302.5" y="310" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Y = 90 ms</text><text x="507.5" y="310" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Y = 110 ms</text><text x="178" y="401" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="end">X = 90</text><rect x="200" y="335" width="205" height="130" fill="#edf3f8" stroke="#dce3dc" stroke-width="2"/><text x="302.5" y="386" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">180 ms</text><text x="302.5" y="432" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 1/4</text><rect x="405" y="335" width="205" height="130" fill="#edf3f8" stroke="#dce3dc" stroke-width="2"/><text x="507.5" y="386" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">200 ms</text><text x="507.5" y="432" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 1/4</text><text x="178" y="531" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="end">X = 110</text><rect x="200" y="465" width="205" height="130" fill="#edf3f8" stroke="#dce3dc" stroke-width="2"/><text x="302.5" y="516" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">200 ms</text><text x="302.5" y="562" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 1/4</text><rect x="405" y="465" width="205" height="130" fill="#edf3f8" stroke="#dce3dc" stroke-width="2"/><text x="507.5" y="516" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">220 ms</text><text x="507.5" y="562" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 1/4</text><text x="405" y="655" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">E[S] = 200 ms</text><text x="405" y="710" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Cov(X,Y) = 0 ms²</text><text x="405" y="769" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="middle">Var(S) = 200 ms²</text><text x="1105" y="249" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="middle">完全共同的扰动</text><text x="1002.5" y="310" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Y = 90 ms</text><text x="1207.5" y="310" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Y = 110 ms</text><text x="878" y="401" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="end">X = 90</text><rect x="900" y="335" width="205" height="130" fill="#faeee4" stroke="#dce3dc" stroke-width="2"/><text x="1002.5" y="386" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">180 ms</text><text x="1002.5" y="432" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 1/2</text><rect x="1105" y="335" width="205" height="130" fill="#fffdf7" stroke="#dce3dc" stroke-width="2"/><text x="1207.5" y="386" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">200 ms</text><text x="1207.5" y="432" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 0</text><text x="878" y="531" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="end">X = 110</text><rect x="900" y="465" width="205" height="130" fill="#fffdf7" stroke="#dce3dc" stroke-width="2"/><text x="1002.5" y="516" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">200 ms</text><text x="1002.5" y="562" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 0</text><rect x="1105" y="465" width="205" height="130" fill="#faeee4" stroke="#dce3dc" stroke-width="2"/><text x="1207.5" y="516" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">220 ms</text><text x="1207.5" y="562" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle">概率 1/2</text><text x="1105" y="655" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">E[S] = 200 ms</text><text x="1105" y="710" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Cov(X,Y) = 100 ms²</text><text x="1105" y="769" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="middle">Var(S) = 400 ms²</text><text x="700" y="824" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Var(X + Y) = Var(X) + Var(Y) + 2Cov(X,Y)</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  虚构有限概率模型</text></svg>