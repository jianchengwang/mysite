<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">最好的常数预测，就是平均读数</title><desc id="desc">三个观测读数为1、2、2厘米，最佳常数5/3厘米，残差-2/3、1/3、1/3厘米。SSE(t)=3(t-5/3)^2+2/3，唯一最小值2/3平方厘米。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#127965"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6694"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc5d25"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#233a3b"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  14  点积与一维投影</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">最好的常数预测，就是平均读数</text><text x="55" y="166" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">左侧看三个位置的读数；右侧比较所有常数预测的残差平方和</text><line x1="55" y1="825" x2="1345" y2="825" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  虚构玩具读数  ·  图中单位按坐标轴标明</text><text x="90" y="230" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">三个位置共用一个预测值</text><text x="825" y="230" fill="#233a3b" font-family="Noto Sans CJK SC, 