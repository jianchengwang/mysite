<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">一支箭头，两个分量，一种长度</title><desc id="desc">u=(3,2)，水平投影=(3,0)，竖直分量=(0,2)，水平单位向量e=(1,0)。长度平方为13，u与e点积为3。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#127965"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6694"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc5d25"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#233a3b"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  14  点积与一维投影</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">一支箭头，两个分量，一种长度</text><text x="55" y="166" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">点积把成对坐标相乘再相加；结果可以是分量，也可以是长度平方</text><line x1="55" y1="825" x2="1345" y2="825" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  横纵坐标采用相同长度标尺</text><line x1="300" y1="270" x2="300" y2="660" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="300" y="701" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1</text><line x1="430" y1="270" x2="430" y2="660" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="430" y="701" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">2</text><line x1="560" y1="270" x2="560" y2="660" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="560" y="701" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">3</text><line x1="170" y1="530" x2="670" y2="530" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="143" y="538" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">1</text><line x1="170" y1="400" x2="670" y2="400" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="143" y="408" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">2</text><line x1="170" y1="270" x2="670" y2="270" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="143" y="278" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">3</text><line x1="130" y1="660" x2="710" y2="660" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ink)"/><line x1="170" y1="705" x2="170" y2="235" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ink)"/><text x="608" y="748" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">第1坐标</text><text x="96" y="224" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">第2坐标</text><text x="150" y="700" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="end">0</text><line x1="170" y1="660" x2="560" y2="660" stroke="#2a6694" stroke-width="6" stroke-linecap="round" marker-end="url(#blue)"/><line x1="170" y1="660" x2="560" y2="400" stroke="#127965" stroke-width="6" stroke-linecap="round" marker-end="url(#teal)"/><line x1="560" y1="660" x2="560" y2="400" stroke="#bc5d25" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="170" y1="660" x2="300" y2="660" stroke="#bc5d25" stroke-width="5" stroke-linecap="round" marker-end="url(#orange)"/><path d="M 536 660 L 536 636 L 560 636" fill="none" stroke="#6f7e79" stroke-width="2.5"/><circle cx="560" cy="400" r="7" fill="#127965" stroke="#127965" stroke-width="2"/><text x="572" y="372" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start">u = (3, 2)</text><text x="205" y="733" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">e = (1, 0)</text><text x="406" y="634" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">水平分量 3</text><text x="582" y="525" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">竖直分量 2</text><line x1="795" y1="232" x2="795" y2="755" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="860" y="282" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">沿水平单位方向</text><text x="860" y="342" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="500" text-anchor="start">u · e = 3 × 1 + 2 × 0</text><text x="860" y="392" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="600" text-anchor="start">= 3</text><text x="860" y="495" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">与自己点乘</text><text x="860" y="553" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">u · u = 3² + 2² = 13</text><text x="860" y="606" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" text-anchor="start">‖u‖ = √13</text><text x="860" y="704" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">点积是数，投影是向量</text><text x="700" y="796" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">u = (3, 0) + (0, 2)</text></svg>