<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">最近的候选，留下垂直的残差</title><desc id="desc">y=(1,3)，v=(2,1)。投影系数1，投影p=(2,1)，残差r=(-1,2)。r与v点积为0。最佳距离平方为5。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#127965"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6694"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc5d25"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#233a3b"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  14  点积与一维投影</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">最近的候选，留下垂直的残差</text><text x="55" y="166" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">允许的候选是全部 tv；投影 p 留在线上，残差 r 从 p 指向 y</text><line x1="55" y1="825" x2="1345" y2="825" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">数学之美  ·  原创图解  ·  横纵坐标采用相同长度标尺</text><line x1="415" y1="236" x2="415" y2="690" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="415" y="730" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">1</text><line x1="540" y1="236" x2="540" y2="690" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="540" y="730" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">2</text><line x1="665" y1="236" x2="665" y2="690" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="665" y="730" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">3</text><line x1="170" y1="565" x2="760" y2="565" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="264" y="573" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">1</text><line x1="170" y1="440" x2="760" y2="440" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="264" y="448" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">2</text><line x1="170" y1="315" x2="760" y2="315" stroke="#dce3dc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/><text x="264" y="323" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">3</text><line x1="145" y1="690" x2="775" y2="690" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ink)"/><line x1="290" y1="735" x2="290" y2="216" stroke="#233a3b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ink)"/><text x="270" y="730" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">0</text><line x1="165" y1="752.5" x2="765.0" y2="452.5" stroke="#2a6694" stroke-width="3" stroke-linecap="round"/><text x="598" y="473" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">所有候选 tv</text><text x="195" y="232" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">第2坐标</text><text x="667" y="767" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">第1坐标</text><line x1="290" y1="690" x2="415" y2="315" stroke="#127965" stroke-width="6" stroke-linecap="round" marker-end="url(#teal)"/><line x1="290" y1="690" x2="540" y2="565" stroke="#2a6694" stroke-width="6" stroke-linecap="round" marker-end="url(#blue)"/><line x1="540" y1="565" x2="415" y2="315" stroke="#bc5d25" stroke-width="5" stroke-linecap="round" marker-end="url(#orange)"/><circle cx="415" cy="315" r="7" fill="#127965" stroke="#127965" stroke-width="2"/><circle cx="540" cy="565" r="7" fill="#2a6694" stroke="#2a6694" stroke-width="2"/><text x="420" y="284" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">y = (1, 3)</text><text x="559" y="620" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">p = v = (2, 1)</text><text x="535" y="370" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">r = (−1, 2)</text><polyline points="519.428,575.286 509.142,554.714 529.714,544.428" fill="none" stroke="#6f7e79" stroke-width="2.5"/><line x1="815" y1="230" x2="815" y2="765" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="865" y="273" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">先计算最佳倍数</text><text x="865" y="331" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start">t＊ = (y · v) / (v · v)</text><text x="865" y="383" fill="#2a6694" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="start">= 5 / 5 = 1</text><text x="865" y="473" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">再检查垂直</text><text x="865" y="530" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">r · v = −2 + 2 = 0</text><text x="865" y="617" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="500" text-anchor="start">长度平方也能核对</text><text x="865" y="675" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="start">‖y‖² = ‖p‖² + ‖r‖²</text><text x="865" y="723" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="start">10 = 5 + 5</text><text x="700" y="799" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">继续沿线移动 δ 份，距离平方增加 δ² ‖v‖²</text></svg>