<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">把198条告警单独拿出来</title><desc id="desc">每个圆点代表一个已告警窗口。左边9列11行共99个真告警，右边同样99个误报，合计198。真故障占99/198等于50%。未告警9802个窗口不在图中。</desc><rect width="1400" height="900" fill="#fffdf7"/>
<text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  18  告警与分母</text>
<text x="55" y="111" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">把198条告警单独拿出来</text>
<text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">分母从“全部故障”换成“全部告警”，真假两组各占一半</text>
<text x="375" y="244" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle">真告警 99</text>
<text x="1025" y="244" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle">误报 99</text>
<text x="375" y="286" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">来自 100 个故障窗口</text>
