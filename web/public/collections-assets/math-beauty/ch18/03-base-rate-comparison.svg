<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">检测表现相同，告警组成仍会改变</title><desc id="desc">第一张台账故障基准比例1%，故障100健康9900，TP99 FN1 FP99 TN9801，告警198真占50%。第二张故障基准比例10%，故障1000健康9000，TP990 FN10 FP90 TN8910，告警1080真占11/12。两张故障检出均99%健康误报均1%，accuracy均99%。条带长度归一化。</desc><rect width="1400" height="900" fill="#fffdf7"/>
<text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  18  告警与分母</text>
<text x="55" y="111" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">检测表现相同，告警组成仍会改变</text>
<text x="55" y="162" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">两张台账均有10000个窗口：故障检出99%，健康误报1%</text>
<text x="80" y="236" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">台账一：故障基准比例 1%</text>
<text x="80" y="280" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">故障 100 ｜ 健康 9900 ｜ 告警 198</text>
<rect x="80" y="311" width="620" height="86" rx="0" fill="#127965"/>
<rect x="700" y="311" width="620" height="86" rx="0" fill="#bc5d25"/>
<text x="390" y="365" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">真告警 99  ·  50%</text>
<text x="1010" y="365" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">误报 99  ·  50%</text>
<text x="80" y="438" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">漏报 1  ｜ 正常未告警 9801</text>
<line x1="80" y1="477" x2="1320" y2="477" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="535" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">台账二：故障基准比例 10%</text>
<text x="80" y="579" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">故障 1000 ｜ 健康 9000 ｜ 告警 1080</text>
<rect x="80" y="610" width="1136.6666666666667" height="86" rx="0" fill="#127965"/>
<rect x="1216.6666666666667" y="610" width="103.33333333333333" height="86" rx="0" fill="#bc5d25"/>
<text x="640" y="663" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">真告警 990  ·  11/12 ≈ 91.67%</text>
<text x="1268" y="646" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" text-anchor="middle">误报</text>
<text x="1268" y="678" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" text-anchor="middle">90</text>
<text x="80" y="739" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start">漏报 10 ｜ 正常未告警 8910</text>
<text x="1320" y="739" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="end">误报占 1/12 ≈ 8.33%</text>
<text x="700" y="794" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="middle">两张台账的 accuracy 都是 99%，告警可信度却不同</text>
<text x="700" y="833" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">每条横带都表示本台账 100% 的告警；长度不能比较告警总数</text>
<text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">原创图解  ·  虚构设备告警台账  ·  数量单位：检测窗口</text>
</svg>