<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">图1 五个对象映射到四个编号</title><desc id="desc">左边甲乙都映射到00，丙映射到01，丁映射到10，戊映射到11。右边说明假设每个编号至多一个对象，四个编号最多容纳四个，无法容纳五个。至少一对碰撞不等于每个对象都碰撞。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#53677d"/></marker></defs>
<rect width="1120" height="760" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="60" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">五个不同对象，只有四个编号</text><text x="48" y="101" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">左边给出一种分配；右边检验“完全没有碰撞”的假设</text><text x="113" y="158" font-size="23" fill="#53677d" font-weight="400" text-anchor="middle">对象</text><text x="427" y="158" font-size="23" fill="#53677d" font-weight="400" text-anchor="middle">编号</text><line x1="578" y1="146" x2="578" y2="618" stroke="#d8e1ec" stroke-width="2"/><circle cx="113" cy="208" r="29" fill="#fff0ec" stroke="#b44840" stroke-width="2"/><text x="113" y="217" font-size="25" fill="#b44840" font-weight="700" text-anchor="middle">甲</text><circle cx="113" cy="290" r="29" fill="#fff0ec" stroke="#b44840" stroke-width="2"/><text x="113" y="299" font-size="25" fill="#b44840" font-weight="700" text-anchor="middle">乙</text><circle cx="113" cy="372" r="29" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><text x="113" y="381" font-size="25" fill="#10243a" font-weight="700" text-anchor="middle">丙</text><circle cx="113" cy="454" r="29" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><text x="113" y="463" font-size="25" fill="#10243a" font-weight="700" text-anchor="middle">丁</text><circle cx="113" cy="536" r="29" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><text x="113" y="545" font-size="25" fill="#10243a" font-weight="700" text-anchor="middle">戊</text><rect x="382" y="180" width="90" height="58" rx="14" fill="#fff0ec" stroke="#b44840" stroke-width="2"/><text x="427" y="218" font-size="28" fill="#b44840" font-weight="700" text-anchor="middle">00</text><rect x="382" y="304" width="90" height="58" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="427" y="342" font-size="28" fill="#10243a" font-weight="700" text-anchor="middle">01</text><rect x="382" y="428" width="90" height="58" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="427" y="466" font-size="28" fill="#10243a" font-weight="700" text-anchor="middle">10</text><rect x="382" y="552" width="90" height="58" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="427" y="590" font-size="28" fill="#10243a" font-weight="700" text-anchor="middle">11</text><path d="M145,208 L366,208" fill="none" stroke="#b44840" stroke-width="3" marker-end="url(#arrow)"/><path d="M145,290 C236,290 275,222 366,222" fill="none" stroke="#b44840" stroke-width="3" marker-end="url(#arrow)"/><path d="M145,372 L366,334" fill="none" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><path d="M145,454 L366,457" fill="none" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><path d="M145,536 L366,581" fill="none" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><text x="251" y="200" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">h</text><text x="482" y="218" font-size="20" fill="#b44840" font-weight="400" text-anchor="start">碰撞</text><text x="626" y="184" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">假设：每个编号至多一个对象</text><rect x="628" y="227" width="90" height="118" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="673" y="258" font-size="23" fill="#53677d" font-weight="400" text-anchor="middle">00</text><circle cx="673" cy="302" r="17" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><rect x="739" y="227" width="90" height="118" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="784" y="258" font-size="23" fill="#53677d" font-weight="400" text-anchor="middle">01</text><circle cx="784" cy="302" r="17" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><rect x="850" y="227" width="90" height="118" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="895" y="258" font-size="23" fill="#53677d" font-weight="400" text-anchor="middle">10</text><circle cx="895" cy="302" r="17" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><rect x="961" y="227" width="90" height="118" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="1006" y="258" font-size="23" fill="#53677d" font-weight="400" text-anchor="middle">11</text><circle cx="1006" cy="302" r="17" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><text x="627" y="399" font-size="27" fill="#10243a" font-weight="700" text-anchor="start">最多容纳 4 × 1 = 4 个</text><text x="627" y="449" font-size="25" fill="#b44840" font-weight="700" text-anchor="start">但要求放入 5 个不同对象</text><text x="627" y="500" font-size="25" fill="#b44840" font-weight="700" text-anchor="start">4 ＜ 5，假设出现矛盾</text><text x="627" y="564" font-size="26" fill="#147d64" font-weight="700" text-anchor="start">所以至少两个对象同号</text><line x1="48" y1="645" x2="1072" y2="645" stroke="#d8e1ec" stroke-width="2"/><text x="48" y="696" font-size="24" fill="#10243a" font-weight="400" text-anchor="start">甲、乙同号就足以构成碰撞；丙、丁、戊仍可以独占各自编号</text><text x="48" y="733" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">“存在一对”不能扩大成“每一个对象都有同号伙伴”</text></g>
</svg>
