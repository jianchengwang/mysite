<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">图3 分桶后比较原始键的查找流程</title><desc id="desc">查询键9，计算余数得到1，进入1号桶。桶中依次保存键1记录甲，键5记录乙，键9记录丙。原始键比较前两次不相等，第三次相等才返回丙。查询13也进入1号桶，但没有相等的键，应回答未找到。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#53677d"/></marker></defs>
<rect width="1120" height="760" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="60" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">同桶只是候选，原始键相等才命中</text><text x="48" y="103" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">一个独立教学模型：按除以 4 的余数分桶，并保留完整 key</text><rect x="48" y="143" width="225" height="99" rx="14" fill="#e9f2fc" stroke="#286ab0" stroke-width="2"/><text x="160" y="182" font-size="22" fill="#53677d" font-weight="400" text-anchor="middle">查询键</text><text x="160" y="220" font-size="31" fill="#286ab0" font-weight="700" text-anchor="middle">9</text><line x1="285" y1="193" x2="336" y2="193" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="143" width="265" height="99" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="482" y="202" font-size="30" fill="#10243a" font-weight="700" text-anchor="middle">h(9) = 1</text><line x1="627" y1="193" x2="678" y2="193" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><rect x="692" y="143" width="380" height="99" rx="14" fill="#fff0ec" stroke="#b44840" stroke-width="2"/><text x="882" y="202" font-size="27" fill="#b44840" font-weight="700" text-anchor="middle">只定位到 1 号桶</text><text x="48" y="292" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">四个桶</text><text x="551" y="292" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">1 号桶中保存的完整记录</text><rect x="48" y="318" width="355" height="54" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="74" y="354" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">0 号桶</text><text x="376" y="354" font-size="22" fill="#53677d" font-weight="400" text-anchor="end">未访问</text><rect x="48" y="385" width="355" height="54" rx="14" fill="#fff0ec" stroke="#b44840" stroke-width="2"/><text x="74" y="421" font-size="23" fill="#b44840" font-weight="700" text-anchor="start">1 号桶</text><text x="376" y="421" font-size="22" fill="#b44840" font-weight="400" text-anchor="end">1，5，9</text><rect x="48" y="452" width="355" height="54" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="74" y="488" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">2 号桶</text><text x="376" y="488" font-size="22" fill="#53677d" font-weight="400" text-anchor="end">未访问</text><rect x="48" y="519" width="355" height="54" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="74" y="555" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">3 号桶</text><text x="376" y="555" font-size="22" fill="#53677d" font-weight="400" text-anchor="end">未访问</text><path d="M416,412 L487,412 L487,356 L534,356" fill="none" stroke="#b44840" stroke-width="3" marker-end="url(#arrow)"/><rect x="548" y="318" width="524" height="255" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="578" y="356" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">原始键</text><text x="754" y="356" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">记录</text><text x="879" y="356" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">与查询键 9 比较</text><line x1="567" y1="372" x2="1053" y2="372" stroke="#d8e1ec" stroke-width="2"/><text x="614" y="413" font-size="27" fill="#53677d" font-weight="700" text-anchor="middle">1</text><text x="777" y="413" font-size="27" fill="#53677d" font-weight="700" text-anchor="middle">甲</text><text x="953" y="413" font-size="24" fill="#53677d" font-weight="400" text-anchor="middle">不相等</text><text x="614" y="475" font-size="27" fill="#53677d" font-weight="700" text-anchor="middle">5</text><text x="777" y="475" font-size="27" fill="#53677d" font-weight="700" text-anchor="middle">乙</text><text x="953" y="475" font-size="24" fill="#53677d" font-weight="400" text-anchor="middle">不相等</text><text x="614" y="537" font-size="27" fill="#147d64" font-weight="700" text-anchor="middle">9</text><text x="777" y="537" font-size="27" fill="#147d64" font-weight="700" text-anchor="middle">丙</text><text x="953" y="537" font-size="24" fill="#147d64" font-weight="700" text-anchor="middle">相等，命中</text><text x="48" y="632" font-size="26" fill="#147d64" font-weight="700" text-anchor="start">比较原始键后，才返回键 9 对应的记录“丙”</text><line x1="48" y1="657" x2="1072" y2="657" stroke="#d8e1ec" stroke-width="2"/><text x="48" y="701" font-size="23" fill="#10243a" font-weight="400" text-anchor="start">若查询 13：仍进入 1 号桶，但 13 与 1、5、9 都不相等</text><text x="48" y="738" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">因此应回答“未找到”，不能返回桶中第一条记录</text></g>
</svg>
