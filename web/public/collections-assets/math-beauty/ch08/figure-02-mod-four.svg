<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">图2 除以4取余如何产生碰撞</title><desc id="desc">0到11分为四组：0、4、8输出0；1、5、9输出1；2、6、10输出2；3、7、11输出3。每组展示输入等于四乘商加余数，箭头指向共同输出。强调1、5、9彼此不同但余数相同。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#53677d"/></marker></defs>
<rect width="1120" height="760" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="60" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">只保留余数，就会丢掉商的区别</text><text x="48" y="103" font-size="24" fill="#53677d" font-weight="400" text-anchor="start">h(x) = x mod 4　　输入范围：0 到 11</text><rect x="48" y="144" width="237" height="434" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="166" y="184" font-size="24" fill="#286ab0" font-weight="700" text-anchor="middle">余数为 0</text><text x="166" y="241" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">0 = 4×0+0</text><text x="166" y="294" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">4 = 4×1+0</text><text x="166" y="347" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">8 = 4×2+0</text><line x1="166" y1="367" x2="166" y2="415" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><rect x="73" y="439" width="187" height="98" rx="14" fill="white" stroke="#286ab0" stroke-width="2"/><text x="166" y="478" font-size="21" fill="#53677d" font-weight="400" text-anchor="middle">共同输出</text><text x="166" y="519" font-size="30" fill="#286ab0" font-weight="700" text-anchor="middle">0</text><rect x="311" y="144" width="237" height="434" rx="14" fill="#fff0ec" stroke="#b44840" stroke-width="2"/><text x="429" y="184" font-size="24" fill="#b44840" font-weight="700" text-anchor="middle">余数为 1</text><text x="429" y="241" font-size="26" fill="#b44840" font-weight="400" text-anchor="middle">1 = 4×0+1</text><text x="429" y="294" font-size="26" fill="#b44840" font-weight="400" text-anchor="middle">5 = 4×1+1</text><text x="429" y="347" font-size="26" fill="#b44840" font-weight="400" text-anchor="middle">9 = 4×2+1</text><line x1="429" y1="367" x2="429" y2="415" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><rect x="336" y="439" width="187" height="98" rx="14" fill="#fff0ec" stroke="#b44840" stroke-width="2"/><text x="429" y="478" font-size="21" fill="#53677d" font-weight="400" text-anchor="middle">共同输出</text><text x="429" y="519" font-size="30" fill="#b44840" font-weight="700" text-anchor="middle">1</text><rect x="574" y="144" width="237" height="434" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="692" y="184" font-size="24" fill="#286ab0" font-weight="700" text-anchor="middle">余数为 2</text><text x="692" y="241" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">2 = 4×0+2</text><text x="692" y="294" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">6 = 4×1+2</text><text x="692" y="347" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">10 = 4×2+2</text><line x1="692" y1="367" x2="692" y2="415" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><rect x="599" y="439" width="187" height="98" rx="14" fill="white" stroke="#286ab0" stroke-width="2"/><text x="692" y="478" font-size="21" fill="#53677d" font-weight="400" text-anchor="middle">共同输出</text><text x="692" y="519" font-size="30" fill="#286ab0" font-weight="700" text-anchor="middle">2</text><rect x="837" y="144" width="237" height="434" rx="14" fill="white" stroke="#d8e1ec" stroke-width="2"/><text x="955" y="184" font-size="24" fill="#286ab0" font-weight="700" text-anchor="middle">余数为 3</text><text x="955" y="241" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">3 = 4×0+3</text><text x="955" y="294" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">7 = 4×1+3</text><text x="955" y="347" font-size="26" fill="#10243a" font-weight="400" text-anchor="middle">11 = 4×2+3</text><line x1="955" y1="367" x2="955" y2="415" stroke="#53677d" stroke-width="3" marker-end="url(#arrow)"/><rect x="862" y="439" width="187" height="98" rx="14" fill="white" stroke="#286ab0" stroke-width="2"/><text x="955" y="478" font-size="21" fill="#53677d" font-weight="400" text-anchor="middle">共同输出</text><text x="955" y="519" font-size="30" fill="#286ab0" font-weight="700" text-anchor="middle">3</text><text x="48" y="633" font-size="29" fill="#b44840" font-weight="700" text-anchor="start">h(1) = h(5) = h(9) = 1</text><text x="48" y="680" font-size="24" fill="#10243a" font-weight="400" text-anchor="start">看见输出 1，只知道余数；无法从中还原商是 0、1 还是 2</text><text x="48" y="728" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">输入不同可以同输出；同一输入在固定规则下只有一个输出</text></g>
</svg>
