<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">先固定规则，再接收新证据</title><desc id="desc">先约定总体、窗口、故障及告警事件。然后冻结检测器及阈值，采集后续时间窗，独立核验标签，再统计四格，最后说明抽样与迁移的条件。流程本身不保证独立性。</desc>
<rect width="1400" height="900" fill="#fffdf7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7e79"/></marker></defs>
<text x="55" y="50" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#127965" text-anchor="start">数学之美  /  23  可信的评估</text>
<text x="55" y="111" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#233a3b" text-anchor="start">先固定规则，再接收新证据</text>
<text x="55" y="164" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#233a3b" text-anchor="start">让每一步都能追溯：测的是谁，怎样记录，结论靠什么成立</text>
<rect x="65" y="206" width="1270" height="125" rx="14" fill="#edf1f1" stroke="none" stroke-width="1"/>
<text x="95" y="249" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#127965" text-anchor="start">评估协议</text>
<text x="285" y="247" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#233a3b" text-anchor="start">目标设备与时间范围  ·  每条记录：一台设备的一段五分钟</text>
<text x="285" y="293" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#233a3b" text-anchor="start">D：窗口确有故障  ·  E：同窗至少一次告警</text>
<rect x="65" y="394" width="295" height="218" rx="14" fill="#e5f2eb" stroke="none" stroke-width="1"/>
<text x="89" y="435" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#127965" text-anchor="start">01</text>
<text x="89" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" fill="#233a3b" text-anchor="start">冻结规则</text>
<text x="89" y="534" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">检测器版本与阈值</text>
<text x="89" y="574" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">输入处理与排除条件</text>
<line x1="361" y1="502" x2="386" y2="502" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="390" y="394" width="295" height="218" rx="14" fill="#e8f0f6" stroke="none" stroke-width="1"/>
<text x="414" y="435" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2a6694" text-anchor="start">02</text>
<text x="414" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" fill="#233a3b" text-anchor="start">采集新窗口</text>
<text x="414" y="534" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">预定的后续时间段</text>
<text x="414" y="574" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">告警与安静都记录</text>
<line x1="686" y1="502" x2="711" y2="502" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="715" y="394" width="295" height="218" rx="14" fill="#f7e8d9" stroke="none" stroke-width="1"/>
<text x="739" y="435" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#bc5d25" text-anchor="start">03</text>
<text x="739" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" fill="#233a3b" text-anchor="start">独立核验标签</text>
<text x="739" y="534" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">先不看告警结论</text>
<text x="739" y="574" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">保留证据与争议项</text>
<line x1="1011" y1="502" x2="1036" y2="502" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1040" y="394" width="295" height="218" rx="14" fill="#e5f2eb" stroke="none" stroke-width="1"/>
<text x="1064" y="435" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#127965" text-anchor="start">04</text>
<text x="1064" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" fill="#233a3b" text-anchor="start">交叉统计</text>
<text x="1064" y="534" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">唯一标识对齐记录</text>
<text x="1064" y="574" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">四格、合计与分母</text>
<line x1="212" y1="332" x2="212" y2="371" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1187" y1="613" x2="1187" y2="661" stroke="#6f7e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="65" y="687" width="1270" height="137" rx="14" fill="#f2f1eb" stroke="none" stroke-width="1"/>
<text x="96" y="733" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#127965" text-anchor="start">报告结论及边界</text>
<text x="400" y="732" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#233a3b" text-anchor="start">与全不报基线比较，回到检出目标和核查负担</text>
<text x="400" y="777" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#233a3b" text-anchor="start">抽样误差有模型条件；标签、独立性和迁移需核验</text>
<text x="65" y="871" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#6f7e79" text-anchor="start">换阈值形成新版本；再次证明它时，要留出未参与选择的新证据</text>
</svg>