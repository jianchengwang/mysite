<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">行数变多，证据未必变新</title><desc id="desc">三种评估陷阱：一条告警复制多次不能增加独立样本；同一次故障的相邻窗口分进开发集与测试集可能泄漏共同来源信息；在同一测试集反复选阈值，不能把赢家的分数当作独立证据。</desc>
<rect width="1400" height="900" fill="#fffdf7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7e79"/></marker></defs>
<text x="55" y="50" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#127965" text-anchor="start">数学之美  /  23  可信的评估</text>
<text x="55" y="111" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#233a3b" text-anchor="start">行数变多，证据未必变新</text>
<text x="55" y="164" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#233a3b" text-anchor="start">相关性与信息泄漏，要沿着记录的来源检查</text>
