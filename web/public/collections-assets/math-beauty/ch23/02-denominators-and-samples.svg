<rect x="808" y="373" width="98" height="57" rx="6" fill="#f7e8d9" stroke="#bc5d25" stroke-width="2"/>
<text x="857" y="412" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#bc5d25" text-anchor="middle">99</text>
<rect x="912" y="373" width="98" height="57" rx="6" fill="#f7e8d9" stroke="#bc5d25" stroke-width="2"/>
<text x="961" y="412" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#bc5d25" text-anchor="middle">9801</text>
<text x="742" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">故障</text>
<text x="742" y="409" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">健康</text>
<text x="1055" y="353" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#bc5d25" text-anchor="start">99 / 9900</text>
<text x="1055" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">分母：健康9900</text>
<rect x="65" y="505" width="615" height="250" rx="14" fill="#ffffff" stroke="#d4dfd8" stroke-width="2"/>
<text x="88" y="547" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#233a3b" text-anchor="start">精确率  /  precision</text>
