<rect x="257" y="597" width="98" height="57" rx="6" fill="#f4f5f3" stroke="#d4dfd8" stroke-width="2"/>
<text x="306" y="636" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#6f7e79" text-anchor="middle">1</text>
<rect x="153" y="660" width="98" height="57" rx="6" fill="#e8f0f6" stroke="#2a6694" stroke-width="2"/>
<text x="202" y="699" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#2a6694" text-anchor="middle">99</text>
<rect x="257" y="660" width="98" height="57" rx="6" fill="#f4f5f3" stroke="#d4dfd8" stroke-width="2"/>
<text x="306" y="699" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#6f7e79" text-anchor="middle">9801</text>
<text x="87" y="633" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">故障</text>
<text x="87" y="696" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">健康</text>
<text x="400" y="640" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#2a6694" text-anchor="start">99 / 198</text>
<text x="400" y="687" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">分母：告警198</text>
<rect x="720" y="505" width="615" height="250" rx="14" fill="#ffffff" stroke="#d4dfd8" stroke-width="2"/>
<text x="743" y="547" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#233a3b" text-anchor="start">准确率  /  accuracy</text>
<text x="859" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#6f7e79" text-anchor="middle">告警</text>
<text x="963" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#6f7e79" text-anchor="middle">安静</text>
<rect x="808" y="597" width="98" height="57" rx="6" fill="#e5f2eb" stroke="#127965" stroke-width="2"/>
<text x="857" y="636" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#127965" text-anchor="middle">99</text>
<rect x="912" y="597" width="98" height="57" rx="6" fill="#e5f2eb" stroke="#127965" stroke-width="2"/>
<text x="961" y="636" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#127965" text-anchor="middle">1</text>
