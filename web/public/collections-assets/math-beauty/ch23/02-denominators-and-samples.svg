<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">四个比例，四种分母</title><desc id="desc">低基准比例台账的四格为TP99、FN1、FP99、TN9801。检出率分母100，假阳性率分母9900，精确率分母198，准确率分母10000。方框等大只是排列格子，不表示数量。</desc>
<rect width="1400" height="900" fill="#fffdf7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7e79"/></marker></defs>
<text x="55" y="50" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#127965" text-anchor="start">数学之美  /  23  可信的评估</text>
<text x="55" y="111" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#233a3b" text-anchor="start">四个比例，四种分母</text>
<text x="55" y="164" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#233a3b" text-anchor="start">高亮格子组成分母；先选对记录集合，再开始做除法</text>
<rect x="65" y="218" width="615" height="250" rx="14" fill="#ffffff" stroke="#d4dfd8" stroke-width="2"/>
<text x="88" y="260" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#233a3b" text-anchor="start">检出率  /  recall</text>
<text x="204" y="296" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#6f7e79" text-anchor="middle">告警</text>
<text x="308" y="296" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#6f7e79" text-anchor="middle">安静</text>
<rect x="153" y="310" width="98" height="57" rx="6" fill="#e5f2eb" stroke="#127965" stroke-width="2"/>
<text x="202" y="349" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#127965" text-anchor="middle">99</text>
<rect x="257" y="310" width="98" height="57" rx="6" fill="#e5f2eb" stroke="#127965" stroke-width="2"/>
<text x="306" y="349" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#127965" text-anchor="middle">1</text>
<rect x="153" y="373" width="98" height="57" rx="6" fill="#f4f5f3" stroke="#d4dfd8" stroke-width="2"/>
<text x="202" y="412" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#6f7e79" text-anchor="middle">99</text>
<rect x="257" y="373" width="98" height="57" rx="6" fill="#f4f5f3" stroke="#d4dfd8" stroke-width="2"/>
<text x="306" y="412" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#6f7e79" text-anchor="middle">9801</text>
<text x="87" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">故障</text>
<text x="87" y="409" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">健康</text>
<text x="400" y="353" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#127965" text-anchor="start">99 / 100</text>
<text x="400" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">分母：故障100</text>
<rect x="720" y="218" width="615" height="250" rx="14" fill="#ffffff" stroke="#d4dfd8" stroke-width="2"/>
<text x="743" y="260" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#233a3b" text-anchor="start">假阳性率  /  FPR</text>
<text x="859" y="296" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#6f7e79" text-anchor="middle">告警</text>
<text x="963" y="296" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#6f7e79" text-anchor="middle">安静</text>
