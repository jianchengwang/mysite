<text x="1055" y="687" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#233a3b" text-anchor="start">分母：全部10000</text>
<text x="65" y="812" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#233a3b" text-anchor="start">记录数不同：precision只有198条告警可核查，灵敏度只有100个故障窗口</text>
<text x="65" y="861" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#6f7e79" text-anchor="start">这些是各组计数，是否能按独立同分布样本使用，还要检查采样机制</text>
</svg>