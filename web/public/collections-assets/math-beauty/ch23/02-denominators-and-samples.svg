<text x="961" y="699" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#127965" text-anchor="middle">9801</text>
<text x="742" y="633" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">故障</text>
<text x="742" y="696" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#6f7e79" text-anchor="start">健康</text>
