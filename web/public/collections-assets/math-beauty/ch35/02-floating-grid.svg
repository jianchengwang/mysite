<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>有限精度铺出不均匀的格点</title><desc>共同横向尺度下，三个有效二进制位在[1,2)内间隔0.25，在[2,4)内间隔0.5，在[4,8)内间隔1。各行右端点是下一数量级起点。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect width="1400" height="900" fill="#fffdf6"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 35 有限位数与表示</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">有限精度铺出不均匀的格点</text><text x="55" y="168" font-size="26" fill="#213b3d" font-weight="400" text-anchor="start">教学格式：共3个有效二进制位，含最前面的1；三行同一横向尺度</text><text x="55" y="220" font-size="29" fill="#0b806c" font-weight="600" text-anchor="start">[1, 2)</text><text x="480" y="220" font-size="29" fill="#0b806c" font-weight="600" text-anchor="start">间隔 0.25</text><line x1="125" y1="300" x2="270" y2="300" stroke="#0b806c" stroke-width="4"/><line x1="125" y1="287" x2="125" y2="313" stroke="#0b806c" stroke-width="3"/><text x="125" y="348" font-size="23" fill="#0b806c" font-weight="500" text-anchor="middle">1</text><line x1="161.25" y1="287" x2="161.25" y2="313" stroke="#0b806c" stroke-width="3"/><text x="161.25" y="378" font-size="23" fill="#0b806c" font-weight="500" text-anchor="middle">1.25</text><line x1="197.5" y1="287" x2="197.5" y2="313" stroke="#0b806c" stroke-width="3"/><text x="197.5" y="348" font-size="23" fill="#0b806c" font-weight="500" text-anchor="middle">1.5</text><line x1="233.75" y1="287" x2="233.75" y2="313" stroke="#0b806c" stroke-width="3"/><text x="233.75" y="378" font-size="23" fill="#0b806c" font-weight="500" text-anchor="middle">1.75</text><line x1="270" y1="287" x2="270" y2="313" stroke="#0b806c" stroke-width="3"/><text x="270" y="348" font-size="23" fill="#0b806c" font-weight="500" text-anchor="middle">2</text><text x="780" y="223" font-size="27" fill="#718582" font-weight="400" text-anchor="start">1.xx₂ × 2ᵉ</text><text x="55" y="410" font-size="29" fill="#2b6f9f" font-weight="600" text-anchor="start">[2, 4)</text><text x="480" y="410" font-size="29" fill="#2b6f9f" font-weight="600" text-anchor="start">间隔 0.5</text><line x1="270" y1="490" x2="560" y2="490" stroke="#2b6f9f" stroke-width="4"/><line x1="270" y1="477" x2="270" y2="503" stroke="#2b6f9f" stroke-width="3"/><text x="270" y="538" font-size="27" fill="#2b6f9f" font-weight="500" text-anchor="middle">2</text><line x1="342.5" y1="477" x2="342.5" y2="503" stroke="#2b6f9f" stroke-width="3"/><text x="342.5" y="538" font-size="27" fill="#2b6f9f" font-weight="500" text-anchor="middle">2.5</text><line x1="415" y1="477" x2="415" y2="503" stroke="#2b6f9f" stroke-width="3"/><text x="415" y="538" font-size="27" fill="#2b6f9f" font-weight="500" text-anchor="middle">3</text><line x1="487.5" y1="477" x2="487.5" y2="503" stroke="#2b6f9f" stroke-width="3"/><text x="487.5" y="538" font-size="27" fill="#2b6f9f" font-weight="500" text-anchor="middle">3.5</text><line x1="560" y1="477" x2="560" y2="503" stroke="#2b6f9f" stroke-width="3"/><text x="560" y="538" font-size="27" fill="#2b6f9f" font-weight="500" text-anchor="middle">4</text><text x="780" y="413" font-size="27" fill="#718582" font-weight="400" text-anchor="start">1.xx₂ × 2ᵉ</text><text x="55" y="600" font-size="29" fill="#c35922" font-weight="600" text-anchor="start">[4, 8)</text><text x="480" y="600" font-size="29" fill="#c35922" font-weight="600" text-anchor="start">间隔 1</text><line x1="560" y1="680" x2="1140" y2="680" stroke="#c35922" stroke-width="4"/><line x1="560" y1="667" x2="560" y2="693" stroke="#c35922" stroke-width="3"/><text x="560" y="728" font-size="27" fill="#c35922" font-weight="500" text-anchor="middle">4</text><line x1="705" y1="667" x2="705" y2="693" stroke="#c35922" stroke-width="3"/><text x="705" y="728" font-size="27" fill="#c35922" font-weight="500" text-anchor="middle">5</text><line x1="850" y1="667" x2="850" y2="693" stroke="#c35922" stroke-width="3"/><text x="850" y="728" font-size="27" fill="#c35922" font-weight="500" text-anchor="middle">6</text><line x1="995" y1="667" x2="995" y2="693" stroke="#c35922" stroke-width="3"/><text x="995" y="728" font-size="27" fill="#c35922" font-weight="500" text-anchor="middle">7</text><line x1="1140" y1="667" x2="1140" y2="693" stroke="#c35922" stroke-width="3"/><text x="1140" y="728" font-size="27" fill="#c35922" font-weight="500" text-anchor="middle">8</text><text x="780" y="603" font-size="27" fill="#718582" font-weight="400" text-anchor="start">1.xx₂ × 2ᵉ</text><text x="700" y="820" font-size="30" fill="#213b3d" font-weight="600" text-anchor="middle">数值范围翻倍，格点间距也翻倍；有效位数始终为3</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 格点和数值均为明确教学模型</text></g></svg>