<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>输入 运算 显示，各有一次选择</title><desc>三步区分：输入十进制数转换到二进制格点，已保存的浮点值运算后舍入，最后转换为可读的十进制显示。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect width="1400" height="900" fill="#fffdf6"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 35 有限位数与表示</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">输入 运算 显示，各有一次选择</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">同一个十进制显示，可以对应一个略有偏差的二进制存储值</text><rect x="110" y="220" width="1180" height="130" rx="8" fill="#eef3ee" stroke="#c8d8d0"/><text x="150" y="273" font-size="31" fill="#0b806c" font-weight="700" text-anchor="start">输入转换</text><text x="150" y="322" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">十进制0.1、0.2 → 各自最近的二进制格点</text><rect x="110" y="405" width="1180" height="130" rx="8" fill="#eef3ee" stroke="#c8d8d0"/><text x="150" y="458" font-size="31" fill="#0b806c" font-weight="700" text-anchor="start">算术与舍入</text><text x="150" y="507" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">对已保存的值相加 → 结果再落到允许格点</text><rect x="110" y="590" width="1180" height="130" rx="8" fill="#eef3ee" stroke="#c8d8d0"/><text x="150" y="643" font-size="31" fill="#0b806c" font-weight="700" text-anchor="start">输出显示</text><text x="150" y="692" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">把保存结果格式化 → 0.30000000000000004</text><line x1="700" y1="365" x2="700" y2="395" stroke="#2b6f9f" stroke-width="4"/><path d="M 688 384 L 700 399 L 712 384" fill="none" stroke="#2b6f9f" stroke-width="4"/><line x1="700" y1="550" x2="700" y2="580" stroke="#2b6f9f" stroke-width="4"/><path d="M 688 569 L 700 584 L 712 569" fill="none" stroke="#2b6f9f" stroke-width="4"/><text x="700" y="795" font-size="29" fill="#c35922" font-weight="600" text-anchor="middle">改变显示的小数位数，不会恢复先前没有存下来的数值</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 格点和数值均为明确教学模型</text></g></svg>