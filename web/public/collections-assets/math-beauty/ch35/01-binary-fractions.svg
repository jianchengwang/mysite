<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>分母决定能不能写完</title><desc>二进制小数0.1011等于11/16；有限k位的分母能约成2的幂，而1/10的分母含5，因此无法有限展开。</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect width="1400" height="900" fill="#fffdf6"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 35 有限位数与表示</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">分母决定能不能写完</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">小数点后向右一位，位权除以2；每个位置只能选0或1</text><rect x="290" y="240" width="185" height="195" rx="8" fill="#e3eee7" stroke="none"/><text x="382" y="310" font-size="45" fill="#0b806c" font-weight="700" text-anchor="middle">1</text><text x="382" y="380" font-size="32" fill="#213b3d" font-weight="500" text-anchor="middle">1/2</text><rect x="535" y="240" width="185" height="195" rx="8" fill="#e3eee7" stroke="none"/><text x="627" y="310" font-size="45" fill="#0b806c" font-weight="700" text-anchor="middle">0</text><text x="627" y="380" font-size="32" fill="#213b3d" font-weight="500" text-anchor="middle">1/4</text><rect x="780" y="240" width="185" height="195" rx="8" fill="#e3eee7" stroke="none"/><text x="872" y="310" font-size="45" fill="#0b806c" font-weight="700" text-anchor="middle">1</text><text x="872" y="380" font-size="32" fill="#213b3d" font-weight="500" text-anchor="middle">1/8</text><rect x="1025" y="240" width="185" height="195" rx="8" fill="#e3eee7" stroke="none"/><text x="1117" y="310" font-size="45" fill="#0b806c" font-weight="700" text-anchor="middle">1</text><text x="1117" y="380" font-size="32" fill="#213b3d" font-weight="500" text-anchor="middle">1/16</text><text x="75" y="325" font-size="48" fill="#213b3d" font-weight="500" text-anchor="start">0.</text><text x="700" y="505" font-size="31" fill="#0b806c" font-weight="600" text-anchor="middle">0.1011₂ = 1/2 + 0/4 + 1/8 + 1/16 = 11/16</text><line x1="55" y1="550" x2="1345" y2="550" stroke="#dce4de" stroke-width="2"/><text x="75" y="620" font-size="31" fill="#2b6f9f" font-weight="600" text-anchor="start">有限k位</text><text x="430" y="620" font-size="33" fill="#2b6f9f" font-weight="600" text-anchor="start">一定是某个整数 m / 2ᵏ</text><text x="75" y="695" font-size="35" fill="#c35922" font-weight="600" text-anchor="start">1/10</text><text x="430" y="695" font-size="31" fill="#c35922" font-weight="600" text-anchor="start">约分分母含5，不能整除任何2ᵏ</text><text x="700" y="793" font-size="36" fill="#213b3d" font-weight="600" text-anchor="middle">0.1₁₀ = 0.0001100110011…₂</text><text x="55" y="872" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 格点和数值均为明确教学模型</text></g></svg>