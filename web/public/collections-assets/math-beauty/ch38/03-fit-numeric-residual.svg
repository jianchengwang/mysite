<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>拟合残差与计算偏差要分清</title><desc>观测y到精确最佳预测p的差是拟合残差r星。计算预测相对p的位移X乘参数偏差仍在列空间中，因而与r星正交。总平方和等于原拟合残差平方和加预测位移平方。</desc><defs><marker id="213b3d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#213b3d"/></marker><marker id="0b806c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b806c"/></marker><marker id="2b6f9f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b6f9f"/></marker><marker id="c35922" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c35922"/></marker><marker id="718582" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718582"/></marker></defs><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" fill="#fffdf6" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 38 检查数值结果</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">拟合残差与计算偏差要分清</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">固定 X、y 的截面示意；为了看清方向，计算位移被放大</text><rect x="115" y="610" width="1170" height="105" fill="#e3eee7" rx="0"/><text x="1240" y="683" font-size="29" fill="#0b806c" font-weight="600" text-anchor="end">col(X)</text><line x1="115" y1="610" x2="1285" y2="610" stroke="#0b806c" stroke-width="3"/><line x1="400" y1="610" x2="400" y2="250" stroke="#0b806c" stroke-width="5" marker-end="url(#0b806c)"/><line x1="400" y1="610" x2="980" y2="610" stroke="#c35922" stroke-width="5" marker-end="url(#c35922)"/><line x1="980" y1="610" x2="400" y2="250" stroke="#2b6f9f" stroke-width="4" marker-end="url(#2b6f9f)"/><circle cx="400" cy="610" r="8" fill="#213b3d"/><circle cx="980" cy="610" r="8" fill="#213b3d"/><circle cx="400" cy="250" r="8" fill="#213b3d"/><path d="M400 586H424V610" fill="none" stroke="#718582" stroke-width="3"/><text x="400" y="221" font-size="31" fill="#213b3d" font-weight="600" text-anchor="middle">y：观测</text><text x="190" y="407" font-size="31" fill="#0b806c" font-weight="600" text-anchor="start">r* = y − p</text><text x="190" y="454" font-size="27" fill="#0b806c" font-weight="400" text-anchor="start">拟合原有的残差</text><text x="858" y="359" font-size="31" fill="#2b6f9f" font-weight="600" text-anchor="start">r̂ = y − p̂</text><text x="858" y="406" font-size="27" fill="#2b6f9f" font-weight="400" text-anchor="start">代回计算参数后的残差</text><text x="620" y="510" font-size="30" fill="#c35922" font-weight="600" text-anchor="middle">XΔθ</text><text x="620" y="555" font-size="26" fill="#c35922" font-weight="500" text-anchor="middle">计算参数造成的预测位移</text><text x="400" y="662" font-size="30" fill="#213b3d" font-weight="600" text-anchor="middle">p = Xθ*</text><text x="980" y="662" font-size="30" fill="#213b3d" font-weight="600" text-anchor="middle">p̂ = X(θ* + Δθ)</text><text x="700" y="775" font-size="38" fill="#213b3d" font-weight="600" text-anchor="middle">‖r̂‖² = 1/6 + ‖XΔθ‖²</text><text x="700" y="823" font-size="26" fill="#718582" font-weight="400" text-anchor="middle">这条恒等式使用精确算术；实际重算残差也会发生舍入</text><text x="55" y="873" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 数据为教学构造，示意图不替代误差分析</text></g></svg>