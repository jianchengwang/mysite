<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>输入略动，斜率也可能明显改变</title><desc>输入是1、1加ε、1减ε。将ε从十的负八次方改为原来的1.01倍，端点各移动十的负十次方，精确斜率从一亿变为一亿除以1.01。</desc><defs><marker id="213b3d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#213b3d"/></marker><marker id="0b806c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b806c"/></marker><marker id="2b6f9f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b6f9f"/></marker><marker id="c35922" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c35922"/></marker><marker id="718582" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718582"/></marker></defs><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" fill="#fffdf6" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 38 检查数值结果</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">输入略动，斜率也可能明显改变</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">图中从左到右：(1−间距, 0)、(1, 1)、(1＋间距, 2)</text><text x="95" y="235" font-size="26" fill="#718582" font-weight="400" text-anchor="start">围绕中心1的位置，按同一尺度放大</text><text x="850" y="235" font-size="26" fill="#718582" font-weight="400" text-anchor="start">由 a = 1 / 间距 得到斜率</text><text x="95" y="285" font-size="31" fill="#2b6f9f" font-weight="600" text-anchor="start">ε = 10⁻⁸</text><line x1="180" y1="350" x2="720" y2="350" stroke="#718582" stroke-width="2" marker-end="url(#718582)"/><circle cx="240" cy="350" r="9" fill="#2b6f9f"/><text x="240" y="398" font-size="25" fill="#2b6f9f" font-weight="500" text-anchor="middle">1 − 间距</text><circle cx="450" cy="350" r="9" fill="#2b6f9f"/><text x="450" y="398" font-size="25" fill="#2b6f9f" font-weight="500" text-anchor="middle">1</text><circle cx="660" cy="350" r="9" fill="#2b6f9f"/><text x="660" y="398" font-size="25" fill="#2b6f9f" font-weight="500" text-anchor="middle">1 + 间距</text><line x1="748" y1="350" x2="807" y2="350" stroke="#2b6f9f" stroke-width="3" marker-end="url(#2b6f9f)"/><text x="95" y="490" font-size="31" fill="#c35922" font-weight="600" text-anchor="start">ε′ = 1.01 ε</text><line x1="180" y1="555" x2="720" y2="555" stroke="#718582" stroke-width="2" marker-end="url(#718582)"/><circle cx="237.9" cy="555" r="9" fill="#c35922"/><text x="237.9" y="603" font-size="25" fill="#c35922" font-weight="500" text-anchor="middle">1 − 间距</text><circle cx="450" cy="555" r="9" fill="#c35922"/><text x="450" y="603" font-size="25" fill="#c35922" font-weight="500" text-anchor="middle">1</text><circle cx="662.1" cy="555" r="9" fill="#c35922"/><text x="662.1" y="603" font-size="25" fill="#c35922" font-weight="500" text-anchor="middle">1 + 间距</text><line x1="748" y1="555" x2="807" y2="555" stroke="#c35922" stroke-width="3" marker-end="url(#c35922)"/><text x="850" y="345" font-size="38" fill="#2b6f9f" font-weight="600" text-anchor="start">a = 100,000,000</text><text x="850" y="545" font-size="30" fill="#c35922" font-weight="600" text-anchor="start">a′ = 100,000,000 / 1.01</text><text x="850" y="592" font-size="35" fill="#c35922" font-weight="600" text-anchor="start">≈ 99,009,900.99</text><rect x="95" y="675" width="1210" height="136" fill="#e3eee7" rx="12"/><text x="700" y="730" font-size="33" fill="#213b3d" font-weight="600" text-anchor="middle">输入端点各移动 10⁻¹⁰ → 斜率相对改变约 0.99%</text><text x="700" y="779" font-size="28" fill="#0b806c" font-weight="500" text-anchor="middle">两组都能残差为0；残差不能单独证明参数对数据可靠</text><text x="55" y="873" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 数据为教学构造，示意图不替代误差分析</text></g></svg>