<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>正交投影把拟合变成上三角求解</title><desc>左图在q1与q2正交坐标中精确按比例画出x和u。u减去沿q1的投影后得到v，单位化得到q2。右图展示R的上三角坐标以及由投影坐标解回参数。</desc><defs><marker id="213b3d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#213b3d"/></marker><marker id="0b806c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b806c"/></marker><marker id="2b6f9f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b6f9f"/></marker><marker id="c35922" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c35922"/></marker><marker id="718582" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718582"/></marker></defs><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" fill="#fffdf6" rx="0"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 38 检查数值结果</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">正交投影把拟合变成上三角求解</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">在同一预测平面中，把 x、u 换成互相垂直的单位方向 q₁、q₂</text><line x1="140" y1="625" x2="640" y2="625" stroke="#718582" stroke-width="2" marker-end="url(#718582)"/><line x1="140" y1="625" x2="140" y2="240" stroke="#718582" stroke-width="2" marker-end="url(#718582)"/><text x="645" y="665" font-size="30" fill="#718582" font-weight="600" text-anchor="start">q₁</text><text x="115" y="230" font-size="30" fill="#718582" font-weight="600" text-anchor="start">q₂</text><line x1="140" y1="625" x2="587.21" y2="625" stroke="#2b6f9f" stroke-width="5" marker-end="url(#2b6f9f)"/><text x="555" y="600" font-size="32" fill="#2b6f9f" font-weight="600" text-anchor="start">x</text><line x1="140" y1="625" x2="408.33" y2="405.91" stroke="#0b806c" stroke-width="5" marker-end="url(#0b806c)"/><text x="385" y="370" font-size="34" fill="#0b806c" font-weight="600" text-anchor="start">u</text><line x1="408.33" y1="625" x2="408.33" y2="405.91" stroke="#c35922" stroke-width="4" marker-end="url(#c35922)"/><text x="430" y="501" font-size="33" fill="#c35922" font-weight="600" text-anchor="start">v</text><line x1="140" y1="405.91" x2="408.33" y2="405.91" stroke="#dce4de" stroke-width="2" stroke-dasharray="6 6"/><line x1="388.33" y1="625" x2="388.33" y2="605" stroke="#c35922" stroke-width="2"/><line x1="388.33" y1="605" x2="408.33" y2="605" stroke="#c35922" stroke-width="2"/><text x="272" y="678" font-size="27" fill="#0b806c" font-weight="500" text-anchor="middle">沿 q₁ 的投影</text><text x="272" y="723" font-size="28" fill="#0b806c" font-weight="500" text-anchor="middle">(3/√5) q₁</text><text x="100" y="787" font-size="30" fill="#c35922" font-weight="600" text-anchor="start">v / ‖v‖ = q₂</text><line x1="700" y1="215" x2="700" y2="790" stroke="#dce4de" stroke-width="2"/><text x="750" y="250" font-size="29" fill="#213b3d" font-weight="600" text-anchor="start">旧方向在新坐标下怎么写</text><text x="765" y="322" font-size="33" fill="#2b6f9f" font-weight="600" text-anchor="start">x = √5 q₁</text><text x="765" y="383" font-size="30" fill="#0b806c" font-weight="600" text-anchor="start">u = (3/√5) q₁ + √(6/5) q₂</text><text x="755" y="536" font-size="37" fill="#213b3d" font-weight="500" text-anchor="start">R =</text><path d="M892 445H870V612H892 M1300 445H1322V612H1300" fill="none" stroke="#213b3d" stroke-width="3"/><text x="990" y="503" font-size="35" fill="#213b3d" font-weight="500" text-anchor="middle">√5</text><text x="1185" y="503" font-size="35" fill="#213b3d" font-weight="500" text-anchor="middle">3/√5</text><text x="990" y="580" font-size="35" fill="#c35922" font-weight="600" text-anchor="middle">0</text><text x="1185" y="580" font-size="35" fill="#213b3d" font-weight="500" text-anchor="middle">√(6/5)</text><text x="1022" y="668" font-size="30" fill="#213b3d" font-weight="500" text-anchor="middle">Qᵀy = (6/√5, 7/√30)</text><text x="1022" y="736" font-size="31" fill="#0b806c" font-weight="600" text-anchor="middle">先解 b = 7/6，再解 a = 1/2</text><text x="1022" y="784" font-size="28" fill="#718582" font-weight="500" text-anchor="middle">满足 Rθ = Qᵀy</text><text x="55" y="873" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 数据为教学构造，示意图不替代误差分析</text></g></svg>