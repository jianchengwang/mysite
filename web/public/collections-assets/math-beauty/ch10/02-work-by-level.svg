<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">每层处理的总长度没有减半</title><desc id="desc">以n等于8为例，从最上面合并向下，深度0、1、2的合并数量为1、2、4，每次长度为8、4、2，总长度都是8，比较上限为7、6、4。单元素层不合并。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C7D2DB"/></marker></defs><rect width="1200" height="720" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="55" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">任务越分越多，每层总长度仍是 n</text><text x="48" y="95" font-size="23" fill="#536777" font-weight="400" text-anchor="start">以 n = 8 为例；各框表示一份子问题，同一行的长度合计不变</text><text x="60" y="150" font-size="22" fill="#536777" font-weight="500" text-anchor="start">深度</text><text x="510" y="150" font-size="23" fill="#17659E" font-weight="600" text-anchor="middle">本层总长度 = 8</text><text x="1050" y="150" font-size="23" fill="#536777" font-weight="500" text-anchor="middle">本层比较上限</text><text x="82" y="211" font-size="23" fill="#18334A" font-weight="500" text-anchor="middle">d = 0</text><rect x="183" y="178" width="666" height="52" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="516.0" y="212" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">长 8</text><text x="1050" y="212" font-size="26" fill="#AD6A12" font-weight="600" text-anchor="middle">1 × 7 = 7</text><line x1="264" y1="236" x2="264" y2="244" stroke="#C7D2DB" stroke-width="1"/><line x1="348" y1="236" x2="348" y2="244" stroke="#C7D2DB" stroke-width="1"/><line x1="432" y1="236" x2="432" y2="244" stroke="#C7D2DB" stroke-width="1"/><line x1="516" y1="236" x2="516" y2="244" stroke="#C7D2DB" stroke-width="1"/><line x1="600" y1="236" x2="600" y2="244" stroke="#C7D2DB" stroke-width="1"/><line x1="684" y1="236" x2="684" y2="244" stroke="#C7D2DB" stroke-width="1"/><line x1="768" y1="236" x2="768" y2="244" stroke="#C7D2DB" stroke-width="1"/><text x="82" y="318" font-size="23" fill="#18334A" font-weight="500" text-anchor="middle">d = 1</text><rect x="183" y="285" width="330" height="52" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="348.0" y="319" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">长 4</text><rect x="519" y="285" width="330" height="52" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="684.0" y="319" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">长 4</text><text x="1050" y="319" font-size="26" fill="#AD6A12" font-weight="600" text-anchor="middle">2 × 3 = 6</text><line x1="264" y1="343" x2="264" y2="351" stroke="#C7D2DB" stroke-width="1"/><line x1="348" y1="343" x2="348" y2="351" stroke="#C7D2DB" stroke-width="1"/><line x1="432" y1="343" x2="432" y2="351" stroke="#C7D2DB" stroke-width="1"/><line x1="516" y1="343" x2="516" y2="351" stroke="#C7D2DB" stroke-width="1"/><line x1="600" y1="343" x2="600" y2="351" stroke="#C7D2DB" stroke-width="1"/><line x1="684" y1="343" x2="684" y2="351" stroke="#C7D2DB" stroke-width="1"/><line x1="768" y1="343" x2="768" y2="351" stroke="#C7D2DB" stroke-width="1"/><text x="82" y="425" font-size="23" fill="#18334A" font-weight="500" text-anchor="middle">d = 2</text><rect x="183" y="392" width="162" height="52" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="264.0" y="426" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">长 2</text><rect x="351" y="392" width="162" height="52" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="432.0" y="426" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">长 2</text><rect x="519" y="392" width="162" height="52" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="600.0" y="426" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">长 2</text><rect x="687" y="392" width="162" height="52" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="768.0" y="426" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">长 2</text><text x="1050" y="426" font-size="26" fill="#AD6A12" font-weight="600" text-anchor="middle">4 × 1 = 4</text><line x1="264" y1="450" x2="264" y2="458" stroke="#C7D2DB" stroke-width="1"/><line x1="348" y1="450" x2="348" y2="458" stroke="#C7D2DB" stroke-width="1"/><line x1="432" y1="450" x2="432" y2="458" stroke="#C7D2DB" stroke-width="1"/><line x1="516" y1="450" x2="516" y2="458" stroke="#C7D2DB" stroke-width="1"/><line x1="600" y1="450" x2="600" y2="458" stroke="#C7D2DB" stroke-width="1"/><line x1="684" y1="450" x2="684" y2="458" stroke="#C7D2DB" stroke-width="1"/><line x1="768" y1="450" x2="768" y2="458" stroke="#C7D2DB" stroke-width="1"/><text x="82" y="532" font-size="23" fill="#18334A" font-weight="500" text-anchor="middle">d = 3</text><rect x="183" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="222.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="267" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="306.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="351" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="390.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="435" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="474.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="519" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="558.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="603" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="642.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="687" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="726.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="771" y="499" width="78" height="52" rx="8" fill="#FFFFFF" stroke="#C7D2DB" stroke-width="2"/><text x="810.0" y="533" font-size="24" fill="#18334A" font-weight="500" text-anchor="middle">1</text><text x="1050" y="533" font-size="26" fill="#536777" font-weight="600" text-anchor="middle">0（不合并）</text><line x1="48" y1="580" x2="1152" y2="580" stroke="#C7D2DB" stroke-width="2"/><text x="600" y="626" font-size="28" fill="#17659E" font-weight="700" text-anchor="middle">一般第 d 层：2ᵈ × (n / 2ᵈ − 1) = n − 2ᵈ</text><text x="600" y="672" font-size="23" fill="#536777" font-weight="400" text-anchor="middle">合并层 d = 0, 1, …, k − 1；n = 2ᵏ；叶子不再比较</text></g></svg>