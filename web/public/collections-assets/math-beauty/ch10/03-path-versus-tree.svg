="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="805" y="505" font-size="21" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="839.5" y="476" width="51" height="42" rx="8" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="865" y="505" font-size="21" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="899.5" y="476" width="51" height="42" rx="8" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="925" y="505" font-size="21" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="959.5" y="476" width="51" height="42" rx="8" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="985" y="505" font-size="21" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="1019.5" y="476" width="51" height="42" rx="8" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="1045" y="505" font-size="21" fill="#18334A" font-weight="500" text-anchor="middle">1</text><rect x="1079.5" y="476" width="51" height="42" rx="8" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="1105" y="505" font-size="21" fill="#18334A" font-weight="500" text-anchor="middle">1</text><text x="895" y="551" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">示意 n = 8 的完整任务树</text><line x1="48" y1="583" x2="1152" y2="583" stroke="#C7D2DB" stroke-width="2"/><text x="305" y="623" font-size="25" fill="#17659E" font-weight="600" text-anchor="middle">只沿一个范围继续查找</text><text x="305" y="662" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">每步访问与比较有固定成本上限</text><text x="895" y="623" font-size="25" fill="#17659E" font-weight="600" text-anchor="middle">左右两边都排完，再合并</text><text x="895" y="662" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">一个合并节点的成本随长度增加</text></g></svg>