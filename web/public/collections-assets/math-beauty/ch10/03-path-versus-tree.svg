<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labelledby="title desc"><title id="title">相同的减半不同的工作范围</title><desc id="desc">左侧二分查找在每层只保留一个范围继续，灰色范围被排除。右侧归并排序要执行所有分支，并为每个内部节点完成合并。树深不能直接代表总工作量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C7D2DB"/></marker></defs><rect width="1200" height="704" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="55" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">树深相近，不代表总工作相近</text><text x="48" y="95" font-size="23" fill="#536777" font-weight="400" text-anchor="start">还要问：继续几条分支？每个节点做多少额外工作？</text><line x1="600" y1="133" x2="600" y2="566" stroke="#C7D2DB" stroke-width="2"/><text x="305" y="155" font-size="28" fill="#17659E" font-weight="700" text-anchor="middle">二分查找</text><text x="895" y="155" font-size="28" fill="#17659E" font-weight="700" text-anchor="middle">归并排序</text><line x1="305" y1="242" x2="185" y2="292" stroke="#17659E" stroke-width="3"/><line x1="305" y1="242" x2="425" y2="292" stroke="#C7D2DB" stroke-width="2" stroke-dasharray="5 5"/><line x1="185" y1="334" x2="125" y2="384" stroke="#C7D2DB" stroke-width="2" stroke-dasharray="5 5"/><line x1="185" y1="334" x2="245" y2="384" stroke="#17659E" stroke-width="3"/><line x1="245" y1="426" x2="210" y2="476" stroke="#17659E" stroke-width="3"/><line x1="245" y1="426" x2="320" y2="476" stroke="#C7D2DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="263" y="200" width="84" height="42" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="305" y="229" font-size="21" fill="#18334A" font-weight="600" text-anchor="middle">查找</text><rect x="143" y="292" width="84" height="42" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="185" y="321" font-size="21" fill="#18334A" font-weight="600" text-anchor="middle">继续</text><rect x="383" y="292" width="84" height="42" rx="8" fill="#F1F3F5" stroke="#C7D2DB" stroke-width="2"/><text x="425" y="321" font-size="21" fill="#8C9AA5" font-weight="400" text-anchor="middle">排除</text><rect x="83" y="384" width="84" height="42" rx="8" fill="#F1F3F5" stroke="#C7D2DB" stroke-width="2"/><text x="125" y="413" font-size="21" fill="#8C9AA5" font-weight="400" text-anchor="middle">排除</text><rect x="203" y="384" width="84" height="42" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="245" y="413" font-size="21" fill="#18334A" font-weight="600" text-anchor="middle">继续</text><rect x="168" y="476" width="84" height="42" rx="8" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="210" y="505" font-size="21" fill="#18334A" font-weight="600" text-anchor="middle">继续</text><rect x="278" y="476" width="84" height="42" rx="8" fill="#F1F3F5" stroke="#C7D2DB" stroke-width="2"/><text x="320" y="505" font-size="21" fill="#8C9AA5" font-weight="400" text-anchor="middle">排除</text><line x1="895" y1="242" x2="775" y2="292" stroke="#17659E" stroke-width="2"/><line x1="895" y1="242" x2="1015" y2="292" stroke="#17659E" stroke-width="2"/><line x1="775" y1="334" x2="715" y2="384" stroke="#17659E" stroke-width="2"/><line x1="775" y1="334" x2="835" y2="384" stroke="#17659E" stroke-width="2"/><line x1="1015" y1="334" x2="955" y2="384" stroke="#17659E" stroke-width="2"/><line x1="1015" y1="334" x2="1075" y2="384" stroke="#17659E" stroke-width="2"/><line x1="715" y1="426" x2="685" y2="476" stroke="#17659E" stroke-width="2"/><line x1="715" y1="426" x2="745" y2="476" stroke="#17659E" stroke-width="2"/><line x1="835" y1="426" x2="805" y2="476" stroke="#17659E" stroke-width="2"/><line x1="835" y1="426" x2="865" y2="476" stroke="#17659E" stroke-width="2"/><line x1="955" y1="426" x2="925" y2="476" stroke="#17659E" stroke-width="2"/><line x1="955" y1="426" x2="985" y2="476" stroke="#17659E" stroke-width="2"/><line x1="1075" y1="426" x2="1045" y2="476" stroke="#17659