<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="748" viewBox="0 0 1200 748" role="img" aria-labelledby="title desc"><title id="title">八个数的归并账本</title><desc id="desc">单元素按7、2、6、3、1、8、5、4排列，自下向上合并成长度2、4、8的有序列表。各层比较4、6、7次，总共17次。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C7D2DB"/></marker></defs><rect width="1200" height="748" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="55" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">八个数：合并三层，共比较 17 次</text><text x="48" y="95" font-size="23" fill="#536777" font-weight="400" text-anchor="start">先按位置拆到单元素，再沿箭头向上合并；这里只数键比较</text><line x1="962" y1="130" x2="962" y2="638" stroke="#C7D2DB" stroke-width="2"/><text x="1070" y="151" font-size="24" fill="#536777" font-weight="500" text-anchor="middle">本层比较</text><line x1="265" y1="295" x2="485" y2="219" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="705" y1="295" x2="485" y2="219" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="155" y1="425" x2="265" y2="349" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="375" y1="425" x2="265" y2="349" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="595" y1="425" x2="705" y2="349" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="815" y1="425" x2="705" y2="349" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="100" y1="555" x2="155" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="210" y1="555" x2="155" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="320" y1="555" x2="375" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="430" y1="555" x2="375" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="540" y1="555" x2="595" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="650" y1="555" x2="595" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="760" y1="555" x2="815" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><line x1="870" y1="555" x2="815" y2="479" stroke="#C7D2DB" stroke-width="3" marker-end="url(#arrow)"/><rect x="175.0" y="165" width="620" height="54" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="485" y="201" font-size="29" fill="#18334A" font-weight="600" text-anchor="middle">1   2   3   4   5   6   7   8</text><rect x="102.5" y="295" width="325" height="54" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="265" y="331" font-size="27" fill="#18334A" font-weight="600" text-anchor="middle">2   3   6   7</text><rect x="542.5" y="295" width="325" height="54" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="705" y="331" font-size="27" fill="#18334A" font-weight="600" text-anchor="middle">1   4   5   8</text><rect x="75.0" y="425" width="160" height="54" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="155" y="461" font-size="27" fill="#18334A" font-weight="600" text-anchor="middle">2   7</text><rect x="295.0" y="425" width="160" height="54" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="375" y="461" font-size="27" fill="#18334A" font-weight="600" text-anchor="middle">3   6</text><rect x="515.0" y="425" width="160" height="54" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="595" y="461" font-size="27" fill="#18334A" font-weight="600" text-anchor="middle">1   8</text><rect x="735.0" y="425" width="160" height="54" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="815" y="461" font-size="27" fill="#18334A" font-weight="600" text-anchor="middle">4   5</text><rect x="65.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="100" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">7</text><rect x="175.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="210" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">2</text><rect x="285.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="320" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">6</text><rect x="395.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="430" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">3</text><rect x="505.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="540" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">1</text><rect x="615.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="650" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">8</text><rect x="725.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="760" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">5</text><rect x="835.0" y="555" width="70" height="54" rx="10" fill="#FFFFFF" stroke="#17659E" stroke-width="2"/><text x="870" y="591" font-size="28" fill="#18334A" font-weight="600" text-anchor="middle">4</text><text x="1070" y="195" font-size="27" fill="#AD6A12" font-weight="700" text-anchor="middle">7 次</text><text x="1070" y="232" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">1 次合并</text><text x="1070" y="325" font-size="27" fill="#AD6A12" font-weight="700" text-anchor="middle">2 × 3 = 6</text><text x="1070" y="362" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">2 次合并</text><text x="1070" y="455" font-size="27" fill="#AD6A12" font-weight="700" text-anchor="middle">4 × 1 = 4</text><text x="1070" y="492" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">4 次合并</text><text x="1070" y="585" font-size="27" fill="#AD6A12" font-weight="700" text-anchor="middle">0 次</text><text x="1070" y="622" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">单元素已排序</text><line x1="48" y1="650" x2="1152" y2="650" stroke="#C7D2DB" stroke-width="2"/><text x="600" y="697" font-size="30" fill="#17659E" font-weight="700" text-anchor="middle">比较总数  4 + 6 + 7 = 17</text></g></svg>