<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">先放大再旋转，还是先旋转再放大</title><desc id="desc">对同一起点(1,1)，先横向放大两倍再逆时针转90度得到(-1,2)，先逆时针旋转再横向放大得到(-2,1)。两坐标图同尺度，实心圆为起点，空心圆为中间结果，方块为终点。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#127965"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#bc5d25"/></marker><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#233a3b"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  15  矩阵与变换</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">先放大再旋转，还是先旋转再放大</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">S：横坐标乘 2　　R：绕原点逆时针转 90°　　两幅图使用同一尺度</text><line x1="700" y1="220" x2="700" y2="805" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="350" y="235" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">先 S，后 R：RS</text><text x="1050" y="235" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">先 R，后 S：SR</text><line x1="140" y1="290" x2="140" y2="640" stroke="#dce3dc" stroke-width="1.3" stroke-linecap="round"/><text x="140" y="622" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">-2</text><line 