<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">把列装进矩阵，一次算出三个预测</title><desc id="desc">X的列分别为x=(0,1,2)与u=(1,1,1)。参数顺序为a、b；矩阵乘法按列线性组合，也按行与参数向量做点积。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#127965"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#bc5d25"/></marker><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#233a3b"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  15  矩阵与变换</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">把列装进矩阵，一次算出三个预测</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">输入是两个参数的数值，输出是按三个观测位置排列的预测数值</text><text x="235" y="240" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">x</text><text x="335" y="240" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">u</text><rect x="205" y="275" width="60" height="218" rx="10" fill="#e1f0e7"/><rect x="305" y="275" width="60" height="218" rx="10" fill="#f8e8d9"/><text x="60" y="399" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" text-anchor="start">Xθ =</text><path d="M191 265 H175 V510 H191 M379 265 H395 V510 H379" fill="none" stroke="#233a3b" stroke-width="3"/><text x="235" y="320" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">0</text><text x="335" y="320" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="235" y="400" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="335" y="400" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="235" y="480" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">2</text><text x="335" y="480" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="464" y="401" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="400" text-anchor="middle">×</text><text x="581" y="243" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">θ</text><path d="M542 305 H526 V474 H542 M620 305 H636 V474 H620" fill="none" stroke="#233a3b" stroke-width="3"/><text x="581" y="365" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="500" text-anchor="middle">a</text><text x="581" y="444" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="500" text-anchor="middle">b</text><text x="747" y="401" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" text-anchor="middle">=</text><path d="M865 265 H849 V510 H865 M1229 265 H1245 V510 H1229" fill="none" stroke="#233a3b" stroke-width="3"/><text x="1047" y="320" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">b</text><text x="1047" y="400" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">a + b</text><text x="1047" y="480" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">2a + b</text><text x="285" y="554" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="middle">3 × 2</text><text x="581" y="554" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">2 个分量</text><text x="1047" y="554" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="middle">3 个分量</text><line x1="65" y1="590" x2="1335" y2="590" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><line x1="700" y1="627" x2="700" y2="819" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="90" y="649" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">按列读：合成两个调整方向</text><text x="90" y="714" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="500" text-anchor="start">a(0,1,2) + b(1,1,1)</text><text x="90" y="774" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="500" text-anchor="start">= (b, a + b, 2a + b)</text><text x="758" y="649" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">按行读：分别计算三个点积</text><text x="758" y="705" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">(0,1) · (a,b) = b</text><text x="758" y="754" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">(1,1) · (a,b) = a + b</text><text x="758" y="803" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start">(2,1) · (a,b) = 2a + b</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  按约定单位进行数值运算</text></svg>