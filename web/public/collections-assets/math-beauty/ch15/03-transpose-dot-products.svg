<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">转置重新排好方向，再收集点积</title><desc id="desc">X的绿色第一列(0,1,2)成为X转置的第一行，橙色第二列(1,1,1)成为第二行。两行各自与观测y=(1,2,2)点积得到6和5。转置不是求逆，结果不是参数。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#127965"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#bc5d25"/></marker><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#233a3b"/></marker></defs><rect width="1400" height="900" fill="#fffdf7"/><text x="55" y="50" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" text-anchor="start">数学之美  /  15  矩阵与变换</text><text x="55" y="112" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">转置重新排好方向，再收集点积</text><text x="55" y="165" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start">转置只交换行与列的位置；Xᵀy 收集的是 y 与 X 各列的点积</text><text x="275" y="249" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">X：3 行 2 列</text><text x="984" y="249" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">Xᵀ：2 行 3 列</text><path d="M188 280 H172 V507 H188 M362 280 H378 V507 H362" fill="none" stroke="#233a3b" stroke-width="3"/><rect x="205" y="289" width="60" height="208" rx="8" fill="#e1f0e7"/><rect x="285" y="289" width="60" height="208" rx="8" fill="#f8e8d9"/><text x="235" y="335" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">0</text><text x="315" y="335" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="235" y="410" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="315" y="410" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="235" y="485" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">2</text><text x="315" y="485" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><line x1="443" y1="389" x2="644" y2="389" stroke="#233a3b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="545" y="355" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" text-anchor="middle">行列互换</text><path d="M797 305 H781 V478 H797 M1161 305 H1177 V478 H1161" fill="none" stroke="#233a3b" stroke-width="3"/><rect x="808" y="317" width="342" height="60" rx="8" fill="#e1f0e7"/><rect x="808" y="407" width="342" height="60" rx="8" fill="#f8e8d9"/><text x="865" y="361" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">0</text><text x="980" y="361" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="1095" y="361" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">2</text><text x="865" y="451" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="980" y="451" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="1095" y="451" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle">1</text><text x="1223" y="359" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="500" text-anchor="start">xᵀ</text><text x="1223" y="449" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="500" text-anchor="start">uᵀ</text><line x1="65" y1="559" x2="1335" y2="559" stroke="#dce3dc" stroke-width="2" stroke-linecap="round"/><text x="90" y="619" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="start">再与 y = (1,2,2) 做点积</text><text x="90" y="684" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="500" text-anchor="start">第一行：x · y = 0×1 + 1×2 + 2×2 = 6</text><text x="90" y="742" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="500" text-anchor="start">第二行：u · y = 1×1 + 1×2 + 1×2 = 5</text><path d="M1075 636 H1059 V755 H1075 M1193 636 H1209 V755 H1193" fill="none" stroke="#233a3b" stroke-width="3"/><text x="1134" y="681" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">6</text><text x="1134" y="733" fill="#bc5d25" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="600" text-anchor="middle">5</text><text x="1026" y="705" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" text-anchor="middle">=</text><text x="1134" y="610" fill="#233a3b" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">Xᵀy</text><text x="700" y="816" fill="#127965" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="middle">这两个数是点积汇总，不是拟合出的斜率和截距</text><text x="55" y="875" fill="#6f7e79" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jiancheng Wang  ·  原创图解  ·  按约定单位进行数值运算</text></svg>