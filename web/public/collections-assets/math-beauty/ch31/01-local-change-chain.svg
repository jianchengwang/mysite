<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>两层近似为何仍能控制误差</title><desc>h先产生中间变化Δg，再产生输出变化Δf。两层可微余项保留在等式中；因为Δg趋零且Δg除以h有界，输出差商趋向两个导数的乘积。</desc>
<defs><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#0b806c"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#c35922"/></marker></defs>
<rect width="1400" height="900" fill="#fffdf6"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif">
<text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 31 链式法则与反向传播</text>
<text x="55" y="112" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">两层近似，仍然保留误差</text>
<text x="55" y="165" font-size="25" fill="#213b3d" font-weight="400" text-anchor="start">g 在 x 可微，f 在 g(x) 可微；复合运算在 x 附近有定义</text>
<rect x="65" y="265" width="270" height="160" rx="16" fill="#eef5ed" stroke="#dce4de" stroke-width="2"/>
<text x="200.0" y="310" font-size="26" fill="#657d78" font-weight="400" text-anchor="middle">输入变化</text>
<text x="200.0" y="380" font-size="46" fill="#0b806c" font-weight="600" text-anchor="middle">h</text>
<rect x="505" y="265" width="340" height="160" rx="16" fill="#eef5ed" stroke="#dce4de" stroke-width="2"/>
<text x="675.0" y="310" font-size="26" fill="#657d78" font-weight="400" text-anchor="middle">中间变化</text>
<text x="675.0" y="380" font-size="46" fill="#0b806c" font-weight="600" text-anchor="middle">Δg</text>
<rect x="1015" y="265" width="320" height="160" rx="16" fill="#eef5ed" stroke="#dce4de" stroke-width="2"/>
<text x="1175.0" y="310" font-size="26" fill="#657d78" font-weight="400" text-anchor="middle">输出变化</text>
<text x="1175.0" y="380" font-size="46" fill="#0b806c" font-weight="600" text-anchor="middle">Δf</text>
<path d="M335 345 L505 345" fill="none" stroke="#0b806c" stroke-width="4" marker-end="url(#greenArrow)"/>
<path d="M845 345 L1015 345" fill="none" stroke="#0b806c" stroke-width="4" marker-end="url(#greenArrow)"/>
<text x="420" y="258" font-size="26" fill="#0b806c" font-weight="600" text-anchor="middle">经过 g</text>
<text x="930" y="258" font-size="26" fill="#0b806c" font-weight="600" text-anchor="middle">经过 f</text>
<text x="420" y="402" font-size="23" fill="#0b806c" font-weight="400" text-anchor="middle">倍率 g′(x)</text>
<text x="930" y="402" font-size="23" fill="#0b806c" font-weight="400" text-anchor="middle">倍率 f′(g(x))</text>
<line x1="55" y1="465" x2="1345" y2="465" stroke="#dce4de" stroke-width="2"/>
<text x="65" y="525" font-size="28" fill="#0b806c" font-weight="600" text-anchor="start">第一步</text>
<text x="235" y="525" font-size="32" fill="#213b3d" font-weight="400" text-anchor="start">Δg = [g′(x) + ε(h)] h</text>
<text x="65" y="593" font-size="28" fill="#0b806c" font-weight="600" text-anchor="start">第二步</text>
<text x="235" y="593" font-size="32" fill="#213b3d" font-weight="400" text-anchor="start">Δf = [f′(g(x)) + η(Δg)] Δg</text>
<text x="65" y="675" font-size="28" fill="#c35922" font-weight="600" text-anchor="start">只除以 h</text>
<text x="260" y="675" font-size="29" fill="#213b3d" font-weight="400" text-anchor="start">Δf/h = [f′(g(x)) + η(Δg)] [g′(x) + ε(h)]</text>
<rect x="65" y="723" width="1270" height="95" rx="16" fill="#f9eddf" stroke="#eed9c4" stroke-width="2"/>
<text x="90" y="761" font-size="28" fill="#c35922" font-weight="500" text-anchor="start">h → 0 时，ε(h) → 0，Δg → 0，η(Δg) → 0</text>
<text x="90" y="798" font-size="25" fill="#c35922" font-weight="400" text-anchor="start">允许 Δg = 0：定义 η(0) = 0；不在任何一步除以 Δg</text>
<text x="55" y="872" font-size="20" fill="#657d78" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 局部变化与计算图</text>
</g></svg>