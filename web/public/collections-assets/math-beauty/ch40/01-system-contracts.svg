<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>从请求计数，到一条可复核的告警</title><desc>五个环节依次为真实采集查询、教学比例和误差、教学判断与记忆、真实通知组织、教学事后核查；每个环节标明输出与假设。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#213b3d"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b806c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b6f9f"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c35922"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718582"/></marker></defs><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf6"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 40 数学能保证什么</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">从请求计数，到一条可复核的告警</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">沿着一条数据流，逐个检查输入、输出与假设</text><text x="60" y="220" font-size="23" fill="#0b806c" font-weight="500" text-anchor="start">绿色：公开的软件机制</text><text x="450" y="220" font-size="23" fill="#c35922" font-weight="500" text-anchor="start">橙色：本章添加的教学设计</text><rect x="60" y="255" width="240" height="290" rx="12" fill="#e3eee7"/><rect x="60" y="255" width="240" height="10" rx="0" fill="#0b806c"/><text x="180" y="310" font-size="29" fill="#0b806c" font-weight="600" text-anchor="middle">采集与查询</text><text x="180" y="365" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">累计计数器</text><text x="180" y="410" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">标签与时间戳</text><text x="180" y="455" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">rate / increase</text><text x="180" y="515" font-size="22" fill="#0b806c" font-weight="600" text-anchor="middle">输出：窗口估计</text><text x="180" y="598" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">重置语义明确</text><text x="180" y="640" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">采集覆盖须核查</text><rect x="320" y="255" width="240" height="290" rx="12" fill="#f8e9d9"/><rect x="320" y="255" width="240" height="10" rx="0" fill="#c35922"/><text x="440" y="310" font-size="29" fill="#c35922" font-weight="600" text-anchor="middle">比例与误差</text><text x="440" y="365" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">同范围分子分母</text><text x="440" y="410" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">N &gt; 0 才求比例</text><text x="440" y="455" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">误差界须有依据</text><text x="440" y="515" font-size="22" fill="#c35922" font-weight="600" text-anchor="middle">输出：q̂ 与误差界</text><text x="440" y="598" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">外推不是精确计数</text><text x="440" y="640" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">零分母另记未知</text><rect x="580" y="255" width="240" height="290" rx="12" fill="#f8e9d9"/><rect x="580" y="255" width="240" height="10" rx="0" fill="#c35922"/><text x="700" y="310" font-size="29" fill="#c35922" font-weight="600" text-anchor="middle">判断与记忆</text><text x="700" y="365" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">T / F / U</text><text x="700" y="410" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">连续 k 次 T</text><text x="700" y="455" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">U 中断连续证据</text><text x="700" y="515" font-size="22" fill="#c35922" font-weight="600" text-anchor="middle">输出：触发状态</text><text x="700" y="598" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">三值规则另行定义</text><text x="700" y="640" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">状态机不是 for</text><rect x="840" y="255" width="240" height="290" rx="12" fill="#e3eee7"/><rect x="840" y="255" width="240" height="10" rx="0" fill="#0b806c"/><text x="960" y="310" font-size="29" fill="#0b806c" font-weight="600" text-anchor="middle">通知组织</text><text x="960" y="365" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">Alertmanager</text><text x="960" y="410" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">去重与分组</text><text x="960" y="455" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">路由到接收方</text><text x="960" y="515" font-size="22" fill="#0b806c" font-weight="600" text-anchor="middle">输出：通知</text><text x="960" y="598" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">分组按配置进行</text><text x="960" y="640" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">通知数不等于故障数</text><rect x="1100" y="255" width="240" height="290" rx="12" fill="#f8e9d9"/><rect x="1100" y="255" width="240" height="10" rx="0" fill="#c35922"/><text x="1220" y="310" font-size="29" fill="#c35922" font-weight="600" text-anchor="middle">事后核查</text><text x="1220" y="365" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">独立故障标签</text><text x="1220" y="410" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">覆盖未告警窗口</text><text x="1220" y="455" font-size="23" fill="#213b3d" font-weight="400" text-anchor="middle">记录抽样口径</text><text x="1220" y="515" font-size="22" fill="#c35922" font-weight="600" text-anchor="middle">输出：评估台账</text><text x="1220" y="598" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">故障定义先写清</text><text x="1220" y="640" font-size="22" fill="#718582" font-weight="400" text-anchor="middle">不能用告警自证</text><line x1="302" y1="402" x2="317" y2="402" stroke="#213b3d" stroke-width="2.5" marker-end="url(#ink)"/><line x1="562" y1="402" x2="577" y2="402" stroke="#213b3d" stroke-width="2.5" marker-end="url(#ink)"/><line x1="822" y1="402" x2="837" y2="402" stroke="#213b3d" stroke-width="2.5" marker-end="url(#ink)"/><line x1="1082" y1="402" x2="1097" y2="402" stroke="#213b3d" stroke-width="2.5" marker-end="url(#ink)"/><rect x="60" y="693" width="1280" height="128" rx="12" fill="#e4eef5"/><text x="90" y="744" font-size="30" fill="#2b6f9f" font-weight="600" text-anchor="start">手算起点：N = 1000，B = 12，q = 0.012</text><text x="90" y="791" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">每个箭头传递的保证，都不能超过上一环实际提供的证据</text><text x="55" y="873" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 以公开架构为参照；数值、三值判定与评估流程为教学构造</text></g></svg>