<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>一个误差区间，决定判断的边界</title><desc>固定阈值0.01。估计0.008的区间为0.007到0.009，判F；估计0.0105的区间为0.0095到0.0115，判U；估计0.012的区间为0.011到0.013，判T。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#213b3d"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b806c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b6f9f"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c35922"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718582"/></marker></defs><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fffdf6"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 40 数学能保证什么</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">一个误差区间，决定判断的边界</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">规则：q &gt; τ；阈值 τ = 0.01；假设 |q̂ − q| ≤ ε = 0.001</text><text x="75" y="245" font-size="24" fill="#718582" font-weight="400" text-anchor="start">估计值</text><text x="1155" y="245" font-size="24" fill="#718582" font-weight="400" text-anchor="start">可靠结论</text><path d="M730 265 V510 M730 550 V755" fill="none" stroke="#213b3d" stroke-width="2" stroke-dasharray="10 8"/><text x="730.0" y="237" font-size="25" fill="#213b3d" font-weight="500" text-anchor="middle">τ = 0.01</text><text x="75" y="338" font-size="28" fill="#2b6f9f" font-weight="600" text-anchor="start">q̂ = 0.008</text><rect x="445.0" y="316" width="190.0000000000001" height="28" rx="0" fill="#e4eef5"/><line x1="445.0" y1="330" x2="635.0000000000001" y2="330" stroke="#2b6f9f" stroke-width="5"/><line x1="445.0" y1="309" x2="445.0" y2="351" stroke="#2b6f9f" stroke-width="3"/><line x1="635.0000000000001" y1="309" x2="635.0000000000001" y2="351" stroke="#2b6f9f" stroke-width="3"/><circle cx="540.0" cy="330" r="8" fill="#2b6f9f"/><text x="540.0" y="389" font-size="24" fill="#2b6f9f" font-weight="400" text-anchor="middle">[0.0070, 0.0090]</text><text x="1155" y="332" font-size="24" fill="#2b6f9f" font-weight="600" text-anchor="start">F：可证未越线</text><text x="1155" y="371" font-size="22" fill="#718582" font-weight="400" text-anchor="start">q ≤ τ</text><text x="75" y="488" font-size="28" fill="#c35922" font-weight="600" text-anchor="start">q̂ = 0.0105</text><rect x="682.5000000000001" y="466" width="189.9999999999999" height="28" rx="0" fill="#f8e9d9"/><line x1="682.5000000000001" y1="480" x2="872.5" y2="480" stroke="#c35922" stroke-width="5"/><line x1="682.5000000000001" y1="459" x2="682.5000000000001" y2="501" stroke="#c35922" stroke-width="3"/><line x1="872.5" y1="459" x2="872.5" y2="501" stroke="#c35922" stroke-width="3"/><circle cx="777.5" cy="480" r="8" fill="#c35922"/><text x="777.5" y="539" font-size="24" fill="#c35922" font-weight="400" text-anchor="middle">[0.0095, 0.0115]</text><text x="1155" y="482" font-size="24" fill="#c35922" font-weight="600" text-anchor="start">U：不确定</text><text x="1155" y="521" font-size="22" fill="#718582" font-weight="400" text-anchor="start">区间横跨阈值</text><text x="75" y="638" font-size="28" fill="#0b806c" font-weight="600" text-anchor="start">q̂ = 0.012</text><rect x="825.0" y="616" width="190.0000000000001" height="28" rx="0" fill="#e3eee7"/><line x1="825.0" y1="630" x2="1015.0000000000001" y2="630" stroke="#0b806c" stroke-width="5"/><line x1="825.0" y1="609" x2="825.0" y2="651" stroke="#0b806c" stroke-width="3"/><line x1="1015.0000000000001" y1="609" x2="1015.0000000000001" y2="651" stroke="#0b806c" stroke-width="3"/><circle cx="920.0" cy="630" r="8" fill="#0b806c"/><text x="920.0" y="689" font-size="24" fill="#0b806c" font-weight="400" text-anchor="middle">[0.0110, 0.0130]</text><text x="1155" y="632" font-size="24" fill="#0b806c" font-weight="600" text-anchor="start">T：可证越线</text><text x="1155" y="671" font-size="22" fill="#718582" font-weight="400" text-anchor="start">q &gt; τ</text><line x1="330" y1="746" x2="1125" y2="746" stroke="#718582" stroke-width="2" marker-end="url(#muted)"/><line x1="350.0" y1="746" x2="350.0" y2="757" stroke="#718582" stroke-width="2"/><text x="350.0" y="790" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0.006</text><line x1="540.0" y1="746" x2="540.0" y2="757" stroke="#718582" stroke-width="2"/><text x="540.0" y="790" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0.008</text><line x1="730.0" y1="746" x2="730.0" y2="757" stroke="#718582" stroke-width="2"/><text x="730.0" y="790" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0.010</text><line x1="920.0" y1="746" x2="920.0" y2="757" stroke="#718582" stroke-width="2"/><text x="920.0" y="790" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0.012</text><line x1="1110.0" y1="746" x2="1110.0" y2="757" stroke="#718582" stroke-width="2"/><text x="1110.0" y="790" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">0.014</text><text x="1160" y="791" font-size="24" fill="#718582" font-weight="400" text-anchor="start">比例 q</text><text x="55" y="850" font-size="26" fill="#213b3d" font-weight="500" text-anchor="start">这里的 ε 必须覆盖实际测量与计算误差；机器舍入单位不能替代它</text><text x="55" y="886" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 区间按同一比例尺绘制；误差界为教学假设</text></g></svg>