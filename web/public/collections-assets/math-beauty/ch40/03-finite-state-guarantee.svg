><line x1="190" y1="520" x2="190" y2="406" stroke="#c35922" stroke-width="3" marker-end="url(#orange)"/><path d="M132 295 C45 245 42 394 130 364" fill="none" stroke="#c35922" stroke-width="3" marker-end="url(#orange)"/><text x="74" y="266" font-size="21" fill="#c35922" font-weight="600" text-anchor="middle">F/U</text><text x="735" y="575" font-size="29" fill="#c35922" font-weight="600" text-anchor="middle">F 或 U：任意状态 → 0</text><text x="735" y="615" font-size="24" fill="#718582" font-weight="400" text-anchor="middle">未知中断连续证据；不等于健康</text><rect x="60" y="654" width="1280" height="166" rx="12" fill="#f3f4ed"/><text x="90" y="711" font-size="26" fill="#213b3d" font-weight="600" text-anchor="start">输入</text><text x="90" y="778" font-size="26" fill="#213b3d" font-weight="600" text-anchor="start">计数 c</text><rect x="289" y="671" width="122" height="132" rx="12" fill="#e4eef5"/><text x="350" y="713" font-size="28" fill="#0b806c" font-weight="600" text-anchor="middle">T</text><text x="350" y="779" font-size="32" fill="#213b3d" font-weight="600" text-anchor="middle">1</text><rect x="455" y="671" width="122" height="132" rx="12" fill="#e4eef5"/><text x="516" y="713" font-size="28" fill="#0b806c" font-weight="600" text-anchor="middle">T</text><text x="516" y="779" font-size="32" fill="#213b3d" font-weight="600" text-anchor="middle">2</text><rect x="621" y="671" width="122" height="132" rx="12" fill="#f8e9d9"/><text x="682" y="713" font-size="28" fill="#c35922" font-weight="600" text-anchor="middle">U</text><text x="682" y="779" font-size="32" fill="#213b3d" font-weight="600" text-anchor="middle">0</text><rect x="787" y="671" width="122" height="132" rx="12" fill="#e4eef5"/><text x="848" y="713" font-size="28" fill="#0b806c" font-weight="600" text-anchor="middle">T</text><text x="848" y="779" font-size="32" fill="#213b3d" font-weight="600" text-anchor="middle">1</text><rect x="953" y="671" width="122" height="132" rx="12" fill="#e4eef5"/><text x="1014" y="713" font-size="28" fill="#0b806c" font-weight="600" text-anchor="middle">T</text><text x="1014" y="779" font-size="32" fill="#213b3d" font-weight="600" text-anchor="middle">2</text><rect x="1119" y="671" width="122" height="132" rx="12" fill="#e3eee7"/><text x="1180" y="713" font-size="28" fill="#0b806c" font-weight="600" text-anchor="middle">T</text><text x="1180" y="779" font-size="32" fill="#0b806c" font-weight="600" text-anchor="middle">3</text><text x="55" y="861" font-size="28" fill="#213b3d" font-weight="600" text-anchor="start">不变量：c = min(末尾连续 T 的长度, 3)</text><text x="55" y="903" font-size="20" fill="#718582" font-weight="400" text-anchor="start">数学之美 · 原创图解 · 有限状态证明不包含观测独立性；本图不是 Prometheus for 的精确实现</text></g></svg>