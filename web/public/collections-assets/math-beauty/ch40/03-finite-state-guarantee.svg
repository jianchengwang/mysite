<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><title>连续证据，能证明到哪一步</title><desc>四个状态0、1、2、3。T使状态加一并饱和于3。任何状态遇F或U均归零。输入T、T、U、T、T、T得到计数1、2、0、1、2、3。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#213b3d"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b806c"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b6f9f"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c35922"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718582"/></marker></defs><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="920" rx="0" fill="#fffdf6"/><text x="55" y="50" font-size="22" fill="#0b806c" font-weight="400" text-anchor="start">数学之美 / 40 数学能保证什么</text><text x="55" y="115" font-size="42" fill="#213b3d" font-weight="700" text-anchor="start">连续证据，能证明到哪一步</text><text x="55" y="170" font-size="27" fill="#213b3d" font-weight="400" text-anchor="start">教学模型：k = 3；T 表示可证越线；F 或 U 都使计数归零</text><circle cx="190" cy="330" r="67" fill="#e4eef5" stroke="#2b6f9f" stroke-width="4"/><text x="190" y="328" font-size="43" fill="#2b6f9f" font-weight="700" text-anchor="middle">0</text><text x="190" y="365" font-size="21" fill="#213b3d" font-weight="400" text-anchor="middle">未触发</text><circle cx="520" cy="330" r="67" fill="#e4eef5" stroke="#2b6f9f" stroke-width="4"/><text x="520" y="328" font-size="43" fill="#2b6f9f" font-weight="700" text-anchor="middle">1</text><text x="520" 