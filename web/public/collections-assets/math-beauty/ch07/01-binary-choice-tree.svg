<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">每个前缀都能接上0或1</title><desc id="desc">三个开关的完整选择树。根为空串；第一层0、1；第二层00、01、10、11；第三层八个不同的三位串。黄色路径得到101。</desc><rect width="1200" height="660" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="52" y="56" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">每个前缀都能接上 0 或 1</text><text x="52" y="96" font-size="23" fill="#536777" font-weight="400" text-anchor="start">先固定开关编号；一条完整路径对应一个最终配置</text><line x1="600" y1="179" x2="330" y2="234" stroke="#D4DFE7" stroke-width="3"/><line x1="600" y1="179" x2="870" y2="234" stroke="#AD6A12" stroke-width="4"/><line x1="330" y1="282" x2="195" y2="346" stroke="#D4DFE7" stroke-width="3"/><line x1="330" y1="282" x2="465" y2="346" stroke="#D4DFE7" stroke-width="3"/><line x1="870" y1="282" x2="735" y2="346" stroke="#AD6A12" stroke-width="4"/><line x1="870" y1="282" x2="1005" y2="346" stroke="#D4DFE7" stroke-width="3"/><line x1="195" y1="394" x2="127.5" y2="469" stroke="#D4DFE7" stroke-width="3"/><line x1="195" y1="394" x2="262.5" y2="469" stroke="#D4DFE7" stroke-width="3"/><line x1="465" y1="394" x2="397.5" y2="469" stroke="#D4DFE7" stroke-width="3"/><line x1="465" y1="394" x2="532.5" y2="469" stroke="#D4DFE7" stroke-width="3"/><line x1="735" y1="394" x2="667.5" y2="469" stroke="#D4DFE7" stroke-width="3"/><line x1="735" y1="394" x2="802.5" y2="469" stroke="#AD6A12" stroke-width="4"/><line x1="1005" y1="394" x2="937.5" y2="469" stroke="#D4DFE7" stroke-width="3"/><line x1="1005" y1="394" x2="1072.5" y2="469" stroke="#D4DFE7" stroke-width="3"/><rect x="548.0" y="131" width="104" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="600" y="164" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">空串</text><rect x="286.0" y="234" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="330" y="267" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">0</text><rect x="826.0" y="234" width="88" height="48" rx="10" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="870" y="267" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">1</text><rect x="151.0" y="346" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="195" y="379" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">00</text><rect x="421.0" y="346" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="465" y="379" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">01</text><rect x="691.0" y="346" width="88" height="48" rx="10" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="735" y="379" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">10</text><rect x="961.0" y="346" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="1005" y="379" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">11</text><rect x="83.5" y="469" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="127.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">000</text><rect x="218.5" y="469" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="262.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">001</text><rect x="353.5" y="469" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="397.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">010</text><rect x="488.5" y="469" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="532.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">011</text><rect x="623.5" y="469" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="667.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">100</text><rect x="758.5" y="469" width="88" height="48" rx="10" fill="#FFF2D9" stroke="#AD6A12" stroke-width="2"/><text x="802.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">101</text><rect x="893.5" y="469" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="937.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">110</text><rect x="1028.5" y="469" width="88" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="1072.5" y="502" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">111</text><text x="40" y="265" font-size="19" fill="#536777" font-weight="400" text-anchor="start">1位</text><text x="40" y="377" font-size="19" fill="#536777" font-weight="400" text-anchor="start">2位</text><text x="40" y="500" font-size="19" fill="#536777" font-weight="400" text-anchor="start">3位</text><text x="600" y="571" font-size="29" fill="#17659E" font-weight="700" text-anchor="middle">叶子数：2 × 2 × 2 = 8</text><text x="600" y="614" font-size="22" fill="#536777" font-weight="400" text-anchor="middle">黄色路径读作 1 → 10 → 101；不同叶子没有重复配置</text></g></svg>