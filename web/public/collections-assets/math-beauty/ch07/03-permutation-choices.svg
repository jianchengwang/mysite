<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">可选任务会变 选择数量仍然固定</title><desc id="desc">三个互异任务PQR任意排列。首位P、Q、R各有两种次位选择，末位各只剩一种。六种序列为PQR、PRQ、QPR、QRP、RPQ、RQP。</desc><rect width="1200" height="700" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="52" y="56" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">可选的是谁会变，剩下几个始终确定</text><text x="52" y="97" font-size="23" fill="#536777" font-weight="400" text-anchor="start">三个互异任务各出现一次，允许任意顺序</text><text x="230" y="151" font-size="24" fill="#18334A" font-weight="600" text-anchor="middle">第 1 位</text><text x="230" y="186" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">3 种选择</text><text x="555" y="151" font-size="24" fill="#18334A" font-weight="600" text-anchor="middle">第 2 位</text><text x="555" y="186" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">每个前缀都是 2 种</text><text x="900" y="151" font-size="24" fill="#18334A" font-weight="600" text-anchor="middle">第 3 位</text><text x="900" y="186" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">每个前缀都是 1 种</text><rect x="180.0" y="256" width="100" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="230" y="289" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">P</text><line x1="280" y1="280" x2="435" y2="244" stroke="#17659E" stroke-width="3"/><rect x="435.0" y="220" width="114" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="492" y="253" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">PQ</text><text x="630" y="252" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">只剩 R</text><line x1="690" y1="244" x2="818" y2="244" stroke="#17659E" stroke-width="3"/><rect x="819.0" y="220" width="162" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="900" y="253" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">PQR</text><text x="1090" y="252" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">1 种</text><line x1="280" y1="280" x2="435" y2="316" stroke="#17659E" stroke-width="3"/><rect x="435.0" y="292" width="114" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="492" y="325" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">PR</text><text x="630" y="324" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">只剩 Q</text><line x1="690" y1="316" x2="818" y2="316" stroke="#17659E" stroke-width="3"/><rect x="819.0" y="292" width="162" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="900" y="325" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">PRQ</text><text x="1090" y="324" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">1 种</text><rect x="180.0" y="401" width="100" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="230" y="434" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">Q</text><line x1="280" y1="425" x2="435" y2="389" stroke="#17659E" stroke-width="3"/><rect x="435.0" y="365" width="114" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="492" y="398" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">QP</text><text x="630" y="397" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">只剩 R</text><line x1="690" y1="389" x2="818" y2="389" stroke="#17659E" stroke-width="3"/><rect x="819.0" y="365" width="162" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="900" y="398" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">QPR</text><text x="1090" y="397" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">1 种</text><line x1="280" y1="425" x2="435" y2="461" stroke="#17659E" stroke-width="3"/><rect x="435.0" y="437" width="114" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="492" y="470" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">QR</text><text x="630" y="469" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">只剩 P</text><line x1="690" y1="461" x2="818" y2="461" stroke="#17659E" stroke-width="3"/><rect x="819.0" y="437" width="162" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="900" y="470" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">QRP</text><text x="1090" y="469" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">1 种</text><rect x="180.0" y="546" width="100" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="230" y="579" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">R</text><line x1="280" y1="570" x2="435" y2="534" stroke="#17659E" stroke-width="3"/><rect x="435.0" y="510" width="114" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="492" y="543" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">RP</text><text x="630" y="542" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">只剩 Q</text><line x1="690" y1="534" x2="818" y2="534" stroke="#17659E" stroke-width="3"/><rect x="819.0" y="510" width="162" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="900" y="543" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">RPQ</text><text x="1090" y="542" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">1 种</text><line x1="280" y1="570" x2="435" y2="606" stroke="#17659E" stroke-width="3"/><rect x="435.0" y="582" width="114" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="492" y="615" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">RQ</text><text x="630" y="614" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">只剩 P</text><line x1="690" y1="606" x2="818" y2="606" stroke="#17659E" stroke-width="3"/><rect x="819.0" y="582" width="162" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="900" y="615" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">RQP</text><text x="1090" y="614" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">1 种</text><text x="230" y="659" font-size="28" fill="#17659E" font-weight="700" text-anchor="middle">3 × 2 × 1 = 6</text><text x="770" y="659" font-size="22" fill="#536777" font-weight="400" text-anchor="middle">每条路径保留顺序，因此六个结果互不重复</text></g></svg>