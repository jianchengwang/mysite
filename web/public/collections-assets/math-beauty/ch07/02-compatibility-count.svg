<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">依赖关系改变分支数</title><desc id="desc">规则B开启必须A开启。A等于0时B只能0，A等于1时B可以0或1。合法前缀00、10、11各有256个八位后缀，合计768。</desc><rect width="1200" height="700" fill="#FAFBFC"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="52" y="56" font-size="32" fill="#18334A" font-weight="700" text-anchor="start">依赖关系改变了第二步的分支数</text><text x="52" y="97" font-size="23" fill="#536777" font-weight="400" text-anchor="start">规则：B → A，预取开启必须有缓存开启</text><text x="150" y="148" font-size="21" fill="#536777" font-weight="600" text-anchor="middle">先定 A</text><text x="460" y="148" font-size="21" fill="#536777" font-weight="600" text-anchor="middle">再定 B</text><text x="732" y="148" font-size="21" fill="#536777" font-weight="600" text-anchor="middle">合法前缀</text><text x="1045" y="148" font-size="21" fill="#536777" font-weight="600" text-anchor="middle">其余 8 位</text><line x1="600" y1="167" x2="600" y2="534" stroke="#D4DFE7" stroke-width="1"/><line x1="866" y1="167" x2="866" y2="534" stroke="#D4DFE7" stroke-width="1"/><rect x="75.0" y="218" width="150" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="150" y="251" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">A = 0</text><rect x="75.0" y="427" width="150" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="150" y="460" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">A = 1</text><line x1="225" y1="242" x2="373" y2="215" stroke="#17659E" stroke-width="3"/><line x1="225" y1="242" x2="373" y2="300" stroke="#C58787" stroke-width="3" stroke-dasharray="8 7"/><line x1="225" y1="451" x2="373" y2="404" stroke="#17659E" stroke-width="3"/><line x1="225" y1="451" x2="373" y2="492" stroke="#17659E" stroke-width="3"/><rect x="385.0" y="191" width="150" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="460" y="224" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">B = 0</text><rect x="385.0" y="276" width="150" height="48" rx="10" fill="#FCEAEA" stroke="#C58787" stroke-width="2"/><text x="460" y="309" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">B = 1</text><rect x="385.0" y="380" width="150" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="460" y="413" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">B = 0</text><rect x="385.0" y="468" width="150" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="460" y="501" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">B = 1</text><line x1="535" y1="215" x2="680" y2="215" stroke="#17659E" stroke-width="2"/><rect x="689.0" y="191" width="86" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="732" y="224" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">00</text><line x1="775" y1="215" x2="907" y2="215" stroke="#17659E" stroke-width="2"/><text x="1045" y="224" font-size="25" fill="#17659E" font-weight="600" text-anchor="middle">2⁸ = 256 种</text><line x1="535" y1="404" x2="680" y2="404" stroke="#17659E" stroke-width="2"/><rect x="689.0" y="380" width="86" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="732" y="413" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">10</text><line x1="775" y1="404" x2="907" y2="404" stroke="#17659E" stroke-width="2"/><text x="1045" y="413" font-size="25" fill="#17659E" font-weight="600" text-anchor="middle">2⁸ = 256 种</text><line x1="535" y1="492" x2="680" y2="492" stroke="#17659E" stroke-width="2"/><rect x="689.0" y="468" width="86" height="48" rx="10" fill="#E4F0F8" stroke="#17659E" stroke-width="2"/><text x="732" y="501" font-size="26" fill="#18334A" font-weight="600" text-anchor="middle">11</text><line x1="775" y1="492" x2="907" y2="492" stroke="#17659E" stroke-width="2"/><text x="1045" y="501" font-size="25" fill="#17659E" font-weight="600" text-anchor="middle">2⁸ = 256 种</text><line x1="545" y1="282" x2="575" y2="312" stroke="#B44D4D" stroke-width="4"/><line x1="545" y1="312" x2="575" y2="282" stroke="#B44D4D" stroke-width="4"/><text x="732" y="306" font-size="23" fill="#B44D4D" font-weight="600" text-anchor="middle">01 不合法</text><text x="150" y="302" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">1 条合法分支</text><text x="150" y="511" font-size="20" fill="#536777" font-weight="400" text-anchor="middle">2 条合法分支</text><line x1="52" y1="555" x2="1148" y2="555" stroke="#D4DFE7" stroke-width="2"/><text x="600" y="606" font-size="29" fill="#17659E" font-weight="700" text-anchor="middle">先分类再相加：(1 + 2) × 2⁸ = 768</text><text x="600" y="650" font-size="22" fill="#536777" font-weight="400" text-anchor="middle">不能写 2 × 2 × 2⁸，因为 A = 0 时，B 并没有两种合法选择</text></g></svg>