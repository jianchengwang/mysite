<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1560" viewBox="0 0 1080 1560" role="img"><title>两秒请求花在哪里</title><desc>假设两秒请求中等待连接池1.60秒、SQL执行0.08秒、其他处理0.32秒。下方虚线只表达待核实的排查证据关联。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">两秒请求花在哪里</text><path d="M55 104 Q542.0 103.5 1025 105" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round"/><text x="540" y="170.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">假设请求的时间分解</text><rect x="80" y="245" width="920" height="95" fill="#EDF5FA" stroke="#263544" stroke-width="3"/><text x="540" y="307.0" text-anchor="middle" fill="#263544" font-size="44" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API请求 2.00秒</text><rect x="80" y="395" width="736.0" height="95" fill="#FCF0E7" stroke="#B95B2A" stroke-width="3"/><rect x="816.0" y="395" width="36.799999999999955" height="95" fill="#246FA7" stroke="#263544" stroke-width="3"/><rect x="852.8" y="395" width="147.20000000000005" height="95" fill="#D8DEE1" stroke="#263544" stroke-width="3"/><text x="440" y="457.0" text-anchor="middle" fill="#B95B2A" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">等待连接池 1.60秒</text><path d="M80 540 Q542.0 539.0 1000 540" fill="none" stroke="#586875" stroke-width="2" stroke-linecap="round"/><path d="M80 527 Q82.0 540.0 80 555" fill="none" stroke="#586875" stroke-width="2" stroke-linecap="round"/><path d="M816.0 527 Q818.0 540.0 816.0 555" fill="none" stroke="#586875" stroke-width="2" stroke-linecap=