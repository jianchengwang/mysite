-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">manifest digest B</text><text x="800.0" y="936.6999999999999" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">该变体的</text><text x="800.0" y="989.9" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">配置＋文件层</text><text x="800.0" y="1153.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">ARM64 节点</text><text x="540" y="1247.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">固定索引摘要，固定这一组变体；仍需逐平台验证</text><text x="540" y="1297.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">摘要以 I、A、B 示意</text><text x="172" y="1370.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">内容引用</text><text x="707" y="1370.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">平台选择</text></svg>