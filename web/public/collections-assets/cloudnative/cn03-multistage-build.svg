Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">复制源码</text><text x="360.0" y="1142.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">go build</text><text x="360.0" y="1302.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">/out/notes</text><text x="865" y="1035.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">源码变化影响</text><text x="865" y="1085.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">此步及之后</text><text x="875.0" y="611.4" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">构建 secret</text><text x="875.0" y="661.8" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">仅临时挂载</text><text x="865" y="1175.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">秘密仅用于</text><text x="865" y="1225.4" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">私有模块下载</text><text x="865" y="1290.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">脚本避免</text><text x="865" y="1340.4" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">复制或记录秘密</text><text x="540" y="1490.0" text-anchor="middle" fill="#263544" font-size="44" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">runtime 阶段 → 最终镜像</text><text x="332.5" y="1594.55" text-anchor="middle" fill="#263544" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">debian:bookworm-slim</text><text x="332.5" y="1646.35" text-anchor="middle" fill="#263544" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">安装 CA 证书</text><text x="820.0" y="1594.2" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">notes</text><text x="820.0" y="1647.4" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">可执行文件</text><text x="540" y="1732.0" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">USER 65532:65532</text><text x="540" y="1796.0" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">api / worker 两种启动参数</text><text x="540" y="1896.0" text-anchor="middle" fill="#B95B2A" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">示例不依赖 cgo；原生库需在运行阶段满足</text><text x="540" y="1954.0" text-anchor="middle" fill="#263544" font-size="39" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">缓存复用计算；最终制品仍须测试</text><text x="172" y="2025.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">制品 / 执行顺序</text><text x="707" y="2025.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">输入影响的步骤</text></svg>