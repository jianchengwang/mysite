<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1940" viewBox="0 0 1080 1940" role="img"><title>凭据轮换有四个验收点</title><desc>准备、分发、用新凭据建立连接验证、撤销旧凭据，随后再次验证业务。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">凭据轮换有四个验收点</text><path d="M55 104 Q542.0 103.5 1025 105" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round"/><text x="540" y="163.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">是否允许新旧并存，取决于服务能力</text><text x="540" y="221.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">示例：旧A → 新B</text><ellipse cx="94" cy="340" rx="37" ry="36.26" fill="#FFFEFA" stroke="#246FA7" stroke-width="3"/><text x="94" y="354.0" text-anchor="middle" fill="#246FA7" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">1</text><ellipse cx="94" cy="620" rx="37" ry="36.26" fill="#FFFEFA" stroke="#246FA7" stroke-width="3"/><text x="94" y="634.0" text-anchor="middle" fill="#246FA7" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">2</text><ellipse cx="94" cy="1250" rx="37" ry="36.26" fill="#FFFEFA" stroke="#246FA7" stroke-width="3"/><text x="94" y="1264.0" text-anchor="middle" fill="#246FA7" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">3</text><ellipse cx="94" cy="1670" rx="37" ry="36.26" fill="#FFFEFA" stroke="#246FA7" stroke-width="3"/><text x="94" y="1684.0" text-anchor="middle" fill="#246FA7" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">4</text><path d="M195 271 Q535.0 268 876 272 Q886 275 885 283 L884 420 Q883 431 872 430 L196 429 Q184 430 186 418 L187 283 Q186 272 195 271 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="337.0" text-anchor="middle" fill="#263544" font-size="44" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">准备新凭据</text><text x="535" y="396.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">数据库 / 密钥服务</text><path d="M535 432 Q537.0 485.0 535 540" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M195 551 Q535.0 548 876 552 Q886 555 885 563 L884 970 Q883 981 872 980 L196 979 Q184 980 186 968 L187 563 Q186 552 195 551 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="616.0" text-anchor="middle" fill="#263544" font-size="44" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">分发到应用</text><text x="535" y="674.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Secret与消费方式</text><path d="M224 713 Q535.0 710 847 714 Q857 717 856 725 L855 939 Q854 950 843 949 L225 948 Q213 949 215 937 L216 725 Q215 714 224 713 Z" fill="#FCF0E7" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="775.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">环境变量：需要新进程</text><text x="535" y="844.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">普通卷：传播后还要重读</text><text x="535" y="913.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">subPath：不自动更新</text><path d="M535 982 Q537.0 1050.0 535 1120" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M195 1131 Q535.0 1128 876 1132 Q886 1135 885 1143 L884 1390 Q883 1401 872 1400 L196 1399 Q184 1400 186 1388 L187 1143 Q186 1132 195 1131 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="1197.0" text-anchor="middle" fill="#263544" font-size="44" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">建立新连接并验证</text><text x="535" y="1257.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">应用与连接池</text><text x="535" y="1323.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">旧连接仍成功</text><text x="535" y="1375.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">不证明新凭据有效</text><path d="M535 1402 Q537.0 1490.0 535 1580" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M195 1591 Q535.0 1588 876 1592 Q886 1595 885 1603 L884 1740 Q883 1751 872 1750 L196 1749 Q184 1750 186 1738 L187 1603 Q186 1592 195 1591 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="1657.0" text-anchor="middle" fill="#263544" font-size="44" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">撤销旧凭据</text><text x="535" y="1716.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">数据库 / 密钥服务</text><path d="M 887 1670 L 1035 1670 L 1035 1250 L 895 1250" fill="none" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="902" y="1460.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">撤销后</text><text x="902" y="1514.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">复查业务</text><path d="M140 1865 Q194.5 1864.0 245 1865" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="395" y="1878.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">轮换步骤</text><path d="M650 1865 Q704.5 1864.0 755 1865" fill="none" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="860" y="1878.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">验证</text></svg>