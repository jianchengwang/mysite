<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" role="img"><title>一条数据库连接要通过两侧策略</title><desc>连接必须同时通过源端出站和目标端入站策略。下方示例在目标端未允许时停止，并另示DNS解析流量。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">一条数据库连接要通过两侧策略</text><path d="M55 104 Q542.0 103.5 1025 105" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round"/><text x="540" y="160.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">前提：网络实现支持并执行NetworkPolicy</text><path d="M360 216 Q565.0 213 771 217 Q781 220 780 228 L779 325 Q778 336 767 335 L361 334 Q349 335 351 323 L352 228 Q351 217 360 216 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="565.0" y="289.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">读书笔记API Pod</text><path d="M435 461 Q565.0 458 696 462 Q706 465 705 473 L704 580 Q703 591 692 590 L436 589 Q424 590 426 578 L427 473 Q426 462 435 461 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="565" y="511.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">源端 Egress</text><text x="565" y="564.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">✓ 允许</text><path d="M435 706 Q565.0 703 696 707 Q706 710 705 718 L704 825 Q703 836 692 835 L436 834 Q424 835 426 823 L427 718 Q426 707 435 706 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="565" y="756.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">目标端 Ingress</text><text x="565" y="809.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">✓ 允许</text><path d="M360 951 Q565.0 948 771 952 Q781 955 780 963 L779 1050 Q778 1061 767 1060 L361 1059 Q349 1060 351 1048 L352 963 Q351 952 360 951 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="565.0" y="1019.7" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">数据库Pod</text><path d="M565 337 Q567.0 392.5 565 450" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M565 592 Q567.0 642.5 565 695" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M565 837 Q567.0 887.5 565 940" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="820" y="393.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">TCP 5432</text><text x="820" y="446.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">（本例）</text><path d="M 350 277 L 190 415" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M75 426 Q190.0 423 306 427 Q316 430 315 438 L314 525 Q313 536 302 535 L76 534 Q64 535 66 523 L67 438 Q66 427 75 426 Z" fill="#FFFEFA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="190.0" y="495.4" text-anchor="middle" fill="#263544" font-size="44" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">DNS</text><text x="150" y="333.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">必要的</text><text x="150" y="384.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">解析流量</text><text x="822" y="663.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">两侧都允许</text><path d="M70 1110 Q542.0 1109.0 1010 1110" fill="none" stroke="#586875" stroke-width="2" stroke-linecap="round"/><text x="540" y="1175.0" text-anchor="middle" fill="#B95B2A" font-size="44" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">目标侧未允许时</text><path d="M70 1261 Q157.5 1258 246 1262 Q256 1265 255 1273 L254 1410 Q253 1421 242 1420 L71 1419 Q59 1420 61 1408 L62 1273 Q61 1262 70 1261 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="157.5" y="1327.3999999999999" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">读书笔记</text><text x="157.5" y="1377.8" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API Pod</text><path d="M345 1261 Q437.5 1258 531 1262 Q541 1265 540 1273 L539 1410 Q538 1421 527 1420 L346 1419 Q334 1420 336 1408 L337 1273 Q336 1262 345 1261 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="437.5" y="1302.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">源端</text><text x="437.5" y="1352.0" text-anchor="middle" fill="#263