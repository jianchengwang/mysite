necap="round" stroke-linejoin="round"/><path d="M360 1227 Q397.0 1226.0 430 1227" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M675 1227 Q727.0 1226.0 775 1227" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M100 1227 H35 V320 H680 V275" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M75 1467 Q114.5 1466.0 150 1467" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M610 1467 Q649.5 1466.0 685 1467" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">提交声明之后，谁继续推进</text><text x="225.0" y="235.05" text-anchor="middle" fill="#263544" font-size="43" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">kubectl</text><text x="795.0" y="235.05" text-anchor="middle" fill="#263544" font-size="43" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API server</text><text x="490" y="183.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">提交声明</text><text x="540" y="405.0" text-anchor="middle" fill="#263544" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API 中的对象与控制器关系</text><text x="210.0" y="523.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Deployment</text><text x="545.0" y="523.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">ReplicaSet</text><text x="880.0" y="496.7" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Pod 对象</text><text x="880.0" y="549.9" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">未绑定节点</text><text x="367" y="636.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Deployment</text><text x="367" y="686.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">控制器</text><text x="705" y="636.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">ReplicaSet</text><text x="705" y="686.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">控制器</text><text x="845.0" y="812.2" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">scheduler</text><text x="845.0" y="862.6" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">为未绑定 Pod</text><text x="845.0" y="913.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">选择 Node</text><text x="650" y="736.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">观察未绑定 Pod</text><text x="840" y="984.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">绑定结果写回 API</text><text x="110" y="1135.0" text-anchor="start" fill="#263544" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Node N1</text><text x="230.0" y="1241.5" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">kubelet</text><text x="552.5" y="1240.8" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">容器运行时</text><text x="880.0" y="1241.85" text-anchor="middle" fill="#263544" font-size="41" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">容器</text><text x="302" y="842.0" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">kubelet 观察</text><text x="302" y="895.2" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">本节点的 Pod</text><text x="302" y="948.4" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">并回报状态</text><text x="540" y="1400.0" text-anchor="middle" fill="#B95B2A" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">这是持续协作，不是一次同步流水线</text><text x="172" y="1480.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">请求 / 数据</text><text x="707" y="1480.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">观察 / 控制</text></svg>