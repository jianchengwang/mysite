<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>云原生</title><desc>一份镜像启动两个实例；观察运行状态并调整；用户数据独立保存。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><text x="600" y="210.0" text-anchor="middle" fill="#263544" font-size="152" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">云原生</text><path d="M355 265 Q601.0 261.5 843 260" fill="none" stroke="#246FA7" stroke-width="7" stroke-linecap="round"/><text x="600" y="353.0" text-anchor="middle" fill="#263544" font-size="54" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">从一个程序开始</text><text x="600" y="425.0" text-anchor="middle" fill="#586875" font-size="45" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">把运行、发布与恢复连起来</text><path d="M310 511 Q600.0 508 891 512 Q901 515 900 523 L899 660 Q898 671 887 670 L311 669 Q299 670 301 658 L302 523 Q301 512 310 511 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600.0" y="573.1999999999999" text-anchor="middle" fill="#263544" font-size="48" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">同一份镜像</text><text x="600.0" y="640.3999999999999" text-anchor="middle" fill="#263544" font-size="48" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">代码 + 依赖</text><path d="M460 674 C460 718 303 729 303 782" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M740 674 C740 718 895 729 895 782" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M130 791 Q305.0 788 4