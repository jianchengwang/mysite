o Sans CJK SC, Noto Sans CJK JP, sans-serif">EndpointSlice</text><text x="545.0" y="934.1" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">控制器</text><text x="795" y="392.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">观察 selector 与端口</text><text x="160" y="753.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">观察标签、</text><text x="160" y="803.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">地址与状态</text><text x="545.0" y="1116.5500000000002" text-anchor="middle" fill="#263544" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">EndpointSlice</text><text x="545.0" y="1171.15" text-anchor="middle" fill="#263544" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">A 的 IP:8080，ready=true</text><text x="545.0" y="1225.7500000000002" text-anchor="middle" fill="#263544" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">B 的 IP:8080，ready=false</text><text x="758" y="1024.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">写入后端记录</text><text x="702.5" y="1429.7" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">数据面实现</text><text x="210.0" y="1428.65" text-anchor="middle" fill="#263544" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">调用方</text><text x="260" y="1320.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">访问 Service</text><text x="