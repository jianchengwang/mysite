" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">容器重启：Pod 身份可以不变</text><text x="105" y="282.0" text-anchor="start" fill="#263544" font-size="40" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Node N1</text><text x="540" y="382.0" text-anchor="middle" fill="#246FA7" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">同一个 Pod · UID=A</text><text x="297.5" y="493.3" text-anchor="middle" fill="#B95B2A" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">容器 1 退出</text><text x="782.5" y="493.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">容器 2 启动</text><text x="540" y="455.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">重启策略</text><text x="75" y="750.0" text-anchor="start" fill="#263544" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">节点故障：创建新身份</text><text x="265" y="866.0" text-anchor="middle" fill="#B95B2A" font-size="41" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Node N1 故障</text><text x="265.0" y="974.0" text-anchor="middle" fill="#B95B2A" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Pod UID=A</text><text x="815" y="866.0" text-anchor="middle" fill="#246FA7" font-size="41" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Node N2</text><text x="815.0" y="974.0" text-anchor="middle" fill="#246FA7" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Pod UID=B</text><text x="265" y="1112.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">终止 / 删除旧 Pod</text><text x="815" y="1112.0" text-anchor="mid