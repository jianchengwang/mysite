<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1770" viewBox="0 0 1080 1770" role="img"><title>替换数据库 Pod，与恢复历史</title><desc>上半新 UID 的同名 notes-db-0 Pod 引用原 PVC，PVC 绑定 PV，驱动连接底层数据卷；替代 Pod 挂载后读取当前数据。下半生产数据库生成独立备份，在隔离环境恢复到选定时点并验证笔记、图片引用与任务状态。持久卷与备份有不同职责。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><path d="M55 104 Q542.0 103.5 1025 105" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round"/><path d="M80 236 Q285.0 233 491 237 Q501 240 500 248 L499 395 Q498 406 487 405 L81 404 Q69 405 71 393 L72 248 Q71 237 80 236 Z" fill="#EDF5FA" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 236 Q835.0 233 1001 237 Q1011 240 1010 248 L1009 395 Q1008 406 997 405 L671 404 Q659 405 661 393 L662 248 Q661 237 670 236 Z" fill="#FFFEFA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 626 Q835.0 623 1001 627 Q1011 630 1010 638 L1009 785 Q1008 796 997 795 L671 794 Q659 795 661 783 L662 638 Q661 627 670 626 Z" fill="#FFFEFA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 626 Q285.0 623 491 627 Q501 630 500 638 L499 785 Q498 796 487 795 L81 794 Q69 795 71 783 L72 638 Q71 627 80 626 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 320 Q582.0 319.0 660 320" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M835 405 Q837.0 514.0 835 625" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M660 710 Q582.0 709.0 500 710" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M285 405 Q287.0 514.0 285 625" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M55 957 Q542.0 956.0 1025 957" fill="none" stroke="#586875" stroke-width="3" stroke-linecap="round"/><path d="M85 1106 Q265.0 1103 446 1107 Q456 1110 455 1118 L454 1205 Q453 1216 442 1215 L86 1214 Q74 1215 76 1203 L77 1118 Q76 1107 85 1106 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M635 1106 Q815.0 1103 996 1107 Q1006 1110 1005 1118 L1004 1205 Q1003 1216 992 1215 L636 1214 Q624 1215 626 1203 L627 1118 Q626 1107 635 1106 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 1160 Q542.0 1159.0 625 1160" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M635 1411 Q815.0 1408 996 1412 Q1006 1415 1005 1423 L1004 1510 Q1003 1521 992 1520 L636 1519 Q624 1520 626 1508 L627 1423 Q626 1412 635 1411 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 1411 Q265.0 1408 446 1412 Q456 1415 455 1423 L454 1510 Q453 1521 442 1520 L86 1519 Q74 1520 76 1508 L77 1423 Q76 1412 85 1411 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M815 1215 Q817.0 1311.5 815 1410" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M625 1465 Q542.0 1464.0 455 1465" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M75 1717 Q114.5 1716.0 150 1717" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M610 1717 Q649.5 1716.0 685 1717" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">替换数据库 Pod，与恢复历史</text><text x="70" y="173.0" text-anchor="start" fill="#263544" font-size="41" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">替换运行实例：读取当前数据</text><text x="285.0" y="280.1" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">替代 notes-db-0</text><text x="285.0" y="333.3" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">新 UID</text><text x="285.0" y="386.5" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">同一稳定名称</text><text x="835.0" y="280.1" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">PVC</text><text x="835.0" y="333.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">容量、类别</text><text x="835.0" y="386.5" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">访问模式</text><text x="835.0" y="670.0999999999999" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">PV</text><text x="835.0" y="723.3" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">具体存储资源</text><text x="835.0" y="776.4999999999999" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">与连接信息</text><text x="285.0" y="695.65" text-anchor="middle" fill="#263544" font-size="41" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">底层数据卷</text><text x="285.0" y="753.05" text-anchor="middle" fill="#263544" font-size="41" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">当前状态</text><text x="580" y="440.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">引用原有</text><text x="580" y="490.4" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">存储请求</text><text x="615" y="568.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">需求与资源绑定</text><text x="580" y="850.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">驱动连接实际存储</text><text x="165" y="520.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">挂载后读取</text><text x="165" y="570.4" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">当前数据</text><text x="540" y="912.0" text-anchor="middle" fill="#B95B2A" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">原 Pod 已退出，旧 UID 不再使用</text><text x="70" y="1032.0" text-anchor="start" fill="#263544" font-size="41" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">恢复过去的状态：找回历史数据</text><text x="265.0" y="1174.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">生产数据库</text><text x="815.0" y="1174.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">独立备份</text><text x="540" y="1076.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">按数据库要求生成备份</text><text x="815.0" y="1479.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">隔离恢复环境</text><text x="265.0" y="1479.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">业务验证</text><text x="660" y="1300.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">恢复到</text><text x="660" y="1350.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">选定时点</text><text x="350" y="1330.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">检查笔记、图片引用</text><text x="350" y="1380.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">与任务状态</text><text x="540" y="1604.0" text-anchor="middle" fill="#B95B2A" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">PVC / PV 的保留受具体策略影响</text><text x="540" y="1660.0" text-anchor="middle" fill="#B95B2A" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">备份仍需隔离保存与恢复演练</text><text x="172" y="1730.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">请求 / 数据</text><text x="707" y="1730.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">观察 / 控制</text></svg>