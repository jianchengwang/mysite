<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img"><title>配置更新后，进程何时知道</title><desc>配置对象把示例摘要并发数由 4 改为 8 后，现有进程环境变量仍为 4，受控替换时重新注入；普通卷文件延迟更新，需要应用重新读取和校验才改变内存配置；subPath 挂载不会自动接收对象更新。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><path d="M55 104 Q542.0 103.5 1025 105" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round"/><path d="M95 166 Q540.0 163 986 167 Q996 170 995 178 L994 295 Q993 306 982 305 L96 304 Q84 305 86 293 L87 178 Q86 167 95 166 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 506 Q275.0 503 456 507 Q466 510 465 518 L464 645 Q463 656 452 655 L96 654 Q84 655 86 643 L87 518 Q86 507 95 506 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 506 Q827.5 503 986 507 Q996 510 995 518 L994 645 Q993 656 982 655 L671 654 Q659 655 661 643 L662 518 Q661 507 670 506 Z" fill="#FCF0E7" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 305 V505" fill="none" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M258 430 Q277.0 416.5 292 405" fill="none" stroke="#B95B2A" stroke-width="5" stroke-linecap="round"/><path d="M465 580 Q564.5 579.0 660 580" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M65 765 Q542.0 764.0 1015 765" fill="none" stroke="#586875" stroke-width="3" stroke-linecap="round"/><path d="M95 931 Q275.0 928 456 932 Q466 935 465 943 L464 1070 Q463 1081 452 1080 L96 1079 Q84 1080 86 1068 L87 943 Q86 932 95 931 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 931 Q827.5 928 986 932 Q996 935 995 943 L994 1070 Q993 1081 982 1080 L671 1079 Q659 1080 661 1068 L662 943 Q661 932 670 931 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 240 H40 V1005 H85" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M465 1005 Q564.5 1004.0 660 1005" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M65 1190 Q542.0 1189.0 1015 1190" fill="none" stroke="#586875" stroke-width="3" stroke-linecap="round"/><path d="M95 1341 Q540.0 1338 986 1342 Q996 1345 995 1353 L994 1430 Q993 1441 982 1440 L96 1439 Q84 1440 86 1428 L87 1353 Q86 1342 95 1341 Z" fill="#FCF0E7" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M995 240 H1040 V1305 H795 V1340" fill="none" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><path d="M1024 1165 Q1041.0 1149.0 1054 1135" fill="none" stroke="#B95B2A" stroke-width="5" stroke-linecap="round"/><path d="M75 1537 Q114.5 1536.0 150 1537" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M610 1537 Q649.5 1536.0 685 1537" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">配置更新后，进程何时知道</text><text x="540.0" y="220.65" text-anchor="middle" fill="#263544" font-size="41" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">ConfigMap / Secret 已更新</text><text x="540.0" y="278.05" text-anchor="middle" fill="#263544" font-size="41" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">示例：摘要并发数 4 → 8</text><text x="90" y="410.0" text-anchor="start" fill="#263544" font-size="43" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">环境变量</text><text x="275.0" y="566.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">启动时注入</text><text x="275.0" y="622.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">环境变量 = 4</text><text x="827.5" y="566.0" text-anchor="middle" fill="#B95B2A" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">现有进程</text><text x="827.5" y="622.0" text-anchor="middle" fill="#B95B2A" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">仍使用 4</text><text x="540" y="467.0" text-anchor="middle" fill="#B95B2A" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">现有进程不自动更新</text><text x="562" y="550.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">读取</text><text x="540" y="715.0" text-anchor="middle" fill="#B95B2A" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">受控替换进程后，才重新注入</text><text x="90" y="838.0" text-anchor="start" fill="#263544" font-size="43" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">普通卷文件</text><text x="275.0" y="991.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">文件最终更新</text><text x="275.0" y="1047.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">有传播延迟</text><text x="827.5" y="991.35" text-anchor="middle" fill="#263544" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">应用内存配置</text><text x="827.5" y="1045.95" text-anchor="middle" fill="#263544" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">重载成功用 8</text><text x="562" y="890.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">程序重新读取</text><text x="562" y="940.4" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">并校验</text><text x="540" y="1140.0" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">文件变新，与应用接受配置是两步</text><text x="90" y="1262.0" text-anchor="start" fill="#263544" font-size="43" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">subPath 挂载</text><text x="540.0" y="1404.35" text-anchor="middle" fill="#B95B2A" font-size="41" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">挂载文件不自动接收对象更新</text><text x="172" y="1550.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">程序读取数据</text><text x="707" y="1550.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">配置分发</text></svg>