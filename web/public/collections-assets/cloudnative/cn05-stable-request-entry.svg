<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1570" viewBox="0 0 1080 1570" role="img"><title>名字、虚拟入口与真实进程</title><desc>浏览器通过 DNS 找到对外入口，在示例中入口经 Service 的 ClusterIP 80 端口选择一个 API Pod 的 8080 端口，API 再查询数据库；两个 Pod 是候选后端，不会同时处理同一个请求。部分入口实现可直接连接后端地址。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><path d="M55 104 Q542.0 103.5 1025 105" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round"/><path d="M75 226 Q205.0 223 336 227 Q346 230 345 238 L344 325 Q343 336 332 335 L76 334 Q64 335 66 323 L67 238 Q66 227 75 226 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M755 226 Q885.0 223 1016 227 Q1026 230 1025 238 L1024 325 Q1023 336 1012 335 L756 334 Q744 335 746 323 L747 238 Q746 227 755 226 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 254 Q547.0 253.0 745 254" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M745 308 Q547.0 307.0 345 308" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M275 466 Q540.0 463 806 467 Q816 470 815 478 L814 565 Q813 576 802 575 L276 574 Q264 575 266 563 L267 478 Q266 467 275 466 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 335 V520 H265" fill="none" stroke="#246FA7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M540 575 Q542.0 664.0 540 755" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M230 756 Q540.0 753 851 757 Q861 760 860 768 L859 860 Q858 871 847 870 L231 869 Q219 870 221 858 L222 768 Q221 757 230 756 Z" fill="#FFFEFA" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 870 V934 H275 V1070" fill="none" stroke="#246FA7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M540 934 H805 V1070" fill="none" stroke="#586875" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M85 1071 Q275.0 1068 466 1072 Q476 1075 475 1083 L474 1160 Q473 1171 462 1170 L86 1169 Q74 1170 76 1158 L77 1083 Q76 1072 85 1071 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M615 1071 Q805.0 1068 996 1072 Q1006 1075 1005 1083 L1004 1160 Q1003 1171 992 1170 L616 1169 Q604 1170 606 1158 L607 1083 Q606 1072 615 1071 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 1170 V1230 H540 V1300" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M805 1170 V1230 H540" fill="none" stroke="#586875" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 1301 Q540.0 1298 721 1302 Q731 1305 730 1313 L729 1390 Q728 1401 717 1400 L361 1399 Q349 1400 351 1388 L352 1313 Q351 1302 360 1301 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 1517 Q114.5 1516.0 150 1517" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M610 1517 Q649.5 1516.0 685 1517" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">名字、虚拟入口与真实进程</text><text x="205.0" y="294.7" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">浏览器</text><text x="885.0" y="294.7" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">对外 DNS</text><text x="545" y="175.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">查询</text><text x="545" y="225.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">notes.example.com</text><text x="545" y="364.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">返回入口地址</text><text x="540.0" y="535.05" text-anchor="middle" fill="#263544" font-size="43" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">入口代理</text><text x="630" y="424.0" text-anchor="middle" fill="#246FA7" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">HTTPS /api/notes/42</text><text x="760" y="622.0" text-anchor="middle" fill="#246FA7" font-size="39" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">示例：ClusterIP:80</text><text x="765" y="683.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Service 是 API 对象</text><text x="765" y="733.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">ClusterIP 是虚拟入口</text><text x="540.0" y="827.55" text-anchor="middle" fill="#246FA7" font-size="43" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Service 转发机制</text><text x="150" y="1000.0" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">本次连接</text><text x="150" y="1050.4" text-anchor="middle" fill="#246FA7" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Pod IP:8080</text><text x="935" y="1000.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">另一连接</text><text x="935" y="1050.4" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Pod IP:8080</text><text x="275.0" y="1134.7" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API Pod A</text><text x="805.0" y="1134.7" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API Pod B</text><text x="738" y="1278.0" text-anchor="middle" fill="#263544" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">查询笔记</text><text x="540.0" y="1364.7" text-anchor="middle" fill="#263544" font-size="42" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">数据库</text><text x="540" y="1470.0" text-anchor="middle" fill="#B95B2A" font-size="37" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">部分入口实现可直接连接后端地址</text><text x="172" y="1530.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">请求 / 数据</text><text x="707" y="1530.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">观察 / 控制</text></svg>