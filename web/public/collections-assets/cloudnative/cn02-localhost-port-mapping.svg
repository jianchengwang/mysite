er-end="url(#arrow)"/><path d="M610 1597 Q649.5 1596.0 685 1597" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="540.0" y="66.0" text-anchor="middle" fill="#263544" font-size="48" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">三个 localhost，两条访问路径</text><text x="72" y="205.0" text-anchor="start" fill="#263544" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Docker 宿主</text><text x="250.0" y="291.7" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">浏览器</text><text x="250.0" y="344.9" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">宿主 localhost</text><text x="755" y="285.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">访问 127.0.0.1:8080</text><text x="850" y="378.0" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">发布到 API:8080</text><text x="540" y="510.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">用户自定义 bridge 网络</text><text x="292" y="611.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API 容器</text><text x="292" y="662.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">独立网络空间</text><text x="787" y="611.0" text-anchor="middle" fill="#263544" font-size="40" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">数据库容器 db</text><text x="787" y="662.0" text-anchor="middle" fill="#586875" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">独立网络空间</text><text x="292" y="742.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">监听 0.0.0.0:8080</text><text x="787" y="742.0" text-anchor="middle" fill="#246FA7" font-size="40" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">db:5432</text><text x="787" y="801.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">监听与认证须允许</text><text x="787" y="851.4" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">该网络的连接</text><text x="292" y="847.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">localhost:5432</text><text x="292" y="987.0" text-anchor="middle" fill="#B95B2A" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">回到 API 自己</text><text x="292" y="1036.0" text-anchor="middle" fill="#B95B2A" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">此处没有数据库</text><text x="787" y="968.0" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">自己的 localhost</text><text x="287.5" y="1148.6" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">veth：容器端</text><text x="787.5" y="1148.6" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">veth：容器端</text><text x="287.5" y="1268.6" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">veth：宿主端</text><text x="787.5" y="1268.6" text-anchor="middle" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">veth：宿主端</text><text x="540" y="1317.0" text-anchor="middle" fill="#263544" font-size="37" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">宿主 bridge</text><text x="540" y="1475.0" text-anchor="middle" fill="#246FA7" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">API → bridge → db:5432</text><text x="540" y="1530.0" text-anchor="middle" fill="#263544" font-size="38" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">容器间连接不绕宿主的发布端口</text><text x="172" y="1610.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">请求 / 数据</text><text x="707" y="1610.0" text-anchor="start" fill="#263544" font-size="36" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">错误的回环路径</text></svg>