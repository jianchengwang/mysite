<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1660" viewBox="0 0 1080 1660" role="img"><title>三个 localhost，两条访问路径</title><desc>浏览器访问宿主 127.0.0.1:8080，经发布规则到 API 的 0.0.0.0:8080 监听；API 通过一对 veth、宿主 bridge 和另一对 veth 访问 db:5432。三个 localhost 属于不同网络空间，API 自己的 localhost 不指向数据库容器。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFEFA"/><path d="M55 104 Q542.0 103.5 1025 105" fill="none" stroke="#246FA7" stroke-width="3" stroke-linecap="round"/><path d="M45 146 Q540.0 143 1036 147 Q1046 150 1045 158 L1044 1415 Q1043 1426 1032 1425 L46 1424 Q34 1425 36 1413 L37 158 Q36 147 45 146 Z" fill="#FFFEFA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 246 Q250.0 243 411 247 Q421 250 420 258 L419 355 Q418 366 407 365 L91 364 Q79 365 81 353 L82 258 Q81 247 90 246 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 456 Q540.0 453 1011 457 Q1021 460 1020 468 L1019 1375 Q1018 1386 1007 1385 L71 1384 Q59 1385 61 1373 L62 468 Q61 457 70 456 Z" fill="#FFFEFA" stroke="#246FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 551 Q292.5 548 491 552 Q501 555 500 563 L499 1180 Q498 1191 487 1190 L96 1189 Q84 1190 86 1178 L87 563 Q86 552 95 551 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 551 Q787.5 548 986 552 Q996 555 995 563 L994 1180 Q993 1191 982 1190 L591 1189 Q579 1190 581 1178 L582 563 Q581 552 590 551 Z" fill="#EDF5FA" stroke="#263544" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 874 C110 960 460 960 437 874" fill="none" stroke="#B95B2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1